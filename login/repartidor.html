<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panel Repartidor - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f7f3f6;color:#222;max-width:480px;margin:0 auto;min-height:100vh}
.topbar{background:#5c0f2a;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:10px}
.menu-icon{color:#fff;font-size:22px}
.logo-area{line-height:1}
.logo-area h1{color:#fff;font-size:32px;font-weight:900;letter-spacing:-1px;display:flex;align-items:center}
.logo-area h1 span{position:relative}
.logo-area h1 span::after{content:'';width:12px;height:12px;background:#ffc300;border-radius:50%;position:absolute;top:-4px;right:-14px}
.logo-area p{color:#fff;font-size:11px;font-weight:400;margin-top:-2px;margin-left:2px;letter-spacing:0.2px}
.online-pill{border:1.5px solid rgba(255,255,255,0.4);border-radius:30px;padding:7px 14px;display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:600}
.online-pill .dot{width:18px;height:18px;background:#22c55e;border-radius:50%;display:inline-block;box-shadow:0 0 0 4px rgba(34,197,94,0.2)}

.wrap{padding:12px}
.card{background:#fff;border-radius:22px;padding:14px 12px;box-shadow:0 4px 20px rgba(0,0,0,0.06);margin-bottom:16px;border:1px solid #f0e6ec}
.card.nuevo{border:2px solid #00ff88;box-shadow:0 0 0 5px rgba(0,255,136,0.15),0 8px 24px rgba(0,0,0,0.08);animation:neon 1.2s infinite}
@keyframes neon{0%,100%{box-shadow:0 0 0 5px rgba(0,255,136,0.15)}50%{box-shadow:0 0 0 8px rgba(0,255,136,0.25)}}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pedido-badge{background:#5c0f2a;color:#fff;border-radius:30px;padding:8px 16px;font-weight:700;font-size:14px}
.meta-head{display:flex;align-items:center;gap:10px;color:#5c0f2a;font-size:12px;font-weight:600}
.meta-head i{font-size:18px}
.sep{width:1px;height:16px;background:#ddd}

.client-box{background:#faf6f8;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.client-icon{width:48px;height:48px;background:#5c0f2a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.client-info small{color:#5c0f2a;font-size:12px;font-weight:600}
.client-info b{font-size:15px;color:#111;display:block;margin-top:1px}
.client-info span{font-size:12px;color:#555;display:flex;align-items:center;gap:6px;margin-top:2px}

.section-title{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px}
.section-title h3{color:#5c0f2a;font-size:15px;font-weight:800}
.count-pill{background:#faf6f8;border-radius:20px;padding:6px 12px;font-size:12px;color:#5c0f2a;font-weight:600;display:flex;align-items:center;gap:6px}

.prod-list{display:flex;flex-direction:column}
.prod-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1e8ef}
.prod-item:last-child{border:none}
.prod-img{width:54px;height:48px;border-radius:12px;object-fit:cover;background:#eee}
.prod-name{flex:1;font-size:13px;font-weight:500;color:#1e2a4a}
.prod-qty{font-size:12px;color:#666}

.info-grid{background:#faf6f8;border-radius:16px;display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 6px;margin:12px 0}
.info-col{display:flex;flex-direction:column;gap:2px;padding:0 8px;border-right:1px solid #ece0e8}
.info-col:last-child{border:none}
.info-col .icon{width:30px;height:30px;background:#5c0f2a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;margin-bottom:4px}
.info-col small{font-size:10px;color:#333;font-weight:500}
.info-col b{font-size:14px;font-weight:800;color:#5c0f2a;line-height:1.1}

.addr-box{display:flex;gap:10px;margin-top:12px;align-items:flex-start}
.addr-icon{color:#5c0f2a;font-size:22px;margin-top:2px}
.addr-text{flex:1}
.addr-text b{color:#5c0f2a;font-size:13px}
.addr-text p{font-size:11px;color:#6b7280;line-height:1.3;margin-top:2px}
.map-link{color:#5c0f2a;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;margin-top:8px}
.map-link i{font-size:16px}

.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.btn{border:none;border-radius:14px;padding:12px 6px;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;line-height:1.1;text-align:left}
.btn i{font-size:18px}
.btn-yellow{background:#ffc300;color:#111}
.btn-vino{background:#5c0f2a;color:#fff}
.btn-outline{background:#fff;border:1.5px solid #5c0f2a;color:#5c0f2a}
.btn:disabled{opacity:0.5}

.empty{background:#fff;border-radius:22px;padding:40px 20px;text-align:center;color:#999;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,0.04)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <i class="fa-solid fa-bars menu-icon"></i>
    <div class="logo-area"><h1><span>Santillos</span></h1><p>Panel del repartidor</p></div>
  </div>
  <div class="online-pill"><span class="dot"></span> En línea</div>
</div>

<div class="wrap" id="lista"></div>

<script>
const configPedidos={
  apiKey: "AIzaSyC0Y1TKsFWX-byB6ws_m2ldJ0P7Gs8k4N4",
  authDomain: "santillos-pedidos.firebaseapp.com",
  databaseURL: "https://santillos-pedidos-default-rtdb.firebaseio.com",
  projectId: "santillos-pedidos"
};
const configRepartidor={
  apiKey: "AIzaSyDQ0SPfwvP_T06wcEXla2UW_SP8CcGYbjI",
  authDomain: "santillos-repartidor.firebaseapp.com",
  databaseURL: "https://santillos-repartidor-default-rtdb.firebaseio.com",
  projectId: "santillos-repartidor"
};
const appPedidos = firebase.initializeApp(configPedidos, "pedidos");
const appRepartidor = firebase.initializeApp(configRepartidor, "repartidor");
const dbPedidos = appPedidos.database();
const dbRepartidor = appRepartidor.database();

let cache=[]; let idsVistos=new Set(); let primer=true; let nuevos=new Set();

function init(){
  dbRepartidor.ref('pedidos_en_camino').on('value', snap=>{
    let data=snap.val()||{};
    let lista=Object.entries(data).map(([k,v])=>({firebaseId:k, ...v}));
    lista.sort((a,b)=>(a.correlativo||0)-(b.correlativo||0));
    if(!primer){
      let diff=lista.filter(x=>!idsVistos.has(x.firebaseId));
      if(diff.length){ diff.forEach(d=>{ nuevos.add(d.firebaseId); setTimeout(()=>{ nuevos.delete(d.firebaseId); render(); },10000)}); sonar(); }
    }
    idsVistos=new Set(lista.map(x=>x.firebaseId)); primer=false; cache=lista; render();
  });
  dbPedidos.ref('pedidos').on('value', snap=>{
    if(cache.length>0) return;
    let data=snap.val()||{}; let lista=Object.entries(data).map(([k,v])=>({firebaseId:k, id:k, ...v})).filter(x=>x.estado==='en_camino');
    if(lista.length>0){ cache=lista; render(); }
  });
}
init();

let ctx=null; function sonar(){ try{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); const t=ctx.currentTime; [0,0.3].forEach((d,i)=>{ const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.setValueAtTime(i?1200:900, t+d); o.frequency.exponentialRampToValueAtTime(i?900:700, t+d+0.3); g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(0.9,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.01,t+d+0.5); o.connect(g); g.connect(ctx.destination); o.start(t+d); o.stop(t+d+0.6); }); if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){} }

function timeAgo(ts){
  if(!ts) return 'Ahora';
  let diff=Math.floor((Date.now()-ts)/60000);
  if(diff<1) return 'Ahora'; if(diff<60) return `Hace ${diff} min`; return `Hace ${Math.floor(diff/60)} h`;
}

function render(){
  const c=document.getElementById('lista');
  if(cache.length===0){ c.innerHTML=`<div class="empty"><i class="fa-solid fa-motorcycle" style="font-size:30px;margin-bottom:10px;display:block;color:#5c0f2a"></i>No tienes pedidos en camino<br><small>Cuando admin ponga En camino te llega aquí</small></div>`; return; }
  c.innerHTML=cache.map(p=>{
    const numero = p.numero || `ST-${String(p.correlativo||0).padStart(4,'0')}`;
    const idShort = numero.replace('ST-','');
    const cliente = p.cliente || {};
    const nombre = cliente.nombre || p.nombre || 'Juan Pérez';
    const tel = cliente.telefono || p.telefono || '418 123 4567';
    const dir = cliente.direccion || p.direccion || 'Calle Hidalgo #145, Col. Centro, Dolores Hidalgo, Gto.';
    const productos = p.productos ? (Array.isArray(p.productos)?p.productos:Object.values(p.productos)) : [{nombre:'Hamburguesa Clásica', cant:1, img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=200'},{nombre:'Papas a la Francesa', cant:1, img:'https://images.unsplash.com/photo-1630384060421-cb20d0e0649d?w=200'},{nombre:'Refresco 600 ml', cant:1, img:'https://images.unsplash.com/photo-1624553307583-6d06d05b9df2?w=200'}];
    const valorServicio = p.valorServicio || 45;
    const distancia = p.distancia || '2.8 km';
    const tiempo = p.tiempoLlegada || '9 min';
    const hace = timeAgo(p.timestamp || p.creadoEn);
    const esNuevo = nuevos.has(p.firebaseId);

    let prodHtml = productos.map(pr=>{
      const img = pr.img || pr.imagen || 'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=200';
      return `<div class="prod-item"><img class="prod-img" src="${img}"><div class="prod-name">${pr.nombre}</div><div class="prod-qty">x${pr.cant||pr.cantidad||1}</div></div>`;
    }).join('');

    return `
    <div class="card ${esNuevo?'nuevo':''}">
      <div class="card-head">
        <div class="pedido-badge">Pedido #${idShort}</div>
        <div class="meta-head"><span><i class="fa-regular fa-clock"></i> ${hace}</span><div class="sep"></div><span><i class="fa-solid fa-location-dot"></i> ${distancia}</span></div>
      </div>
      <div class="client-box">
        <div class="client-icon"><i class="fa-solid fa-user"></i></div>
        <div class="client-info"><small>Cliente</small><b>${nombre}</b><span><i class="fa-solid fa-phone"></i> ${tel}</span></div>
      </div>
      <div class="section-title"><h3>Productos del pedido</h3><div class="count-pill"><i class="fa-solid fa-utensils"></i> ${productos.length} productos</div></div>
      <div class="prod-list">${prodHtml}</div>
      <div class="info-grid">
        <div class="info-col"><div class="icon"><i class="fa-solid fa-dollar-sign"></i></div><small>Valor del servicio</small><b>$${valorServicio} MXN</b></div>
        <div class="info-col"><div class="icon"><i class="fa-regular fa-clock"></i></div><small>Tiempo de llegada</small><b>${tiempo}</b></div>
        <div class="info-col"><div class="icon"><i class="fa-solid fa-route"></i></div><small>Distancia al cliente</small><b>${distancia}</b></div>
      </div>
      <div class="addr-box">
        <i class="fa-solid fa-location-dot addr-icon"></i>
        <div class="addr-text"><b>Dirección de entrega</b><p>${dir}</p></div>
        <div class="map-link" onclick="abrirMapa('${dir}', ${cliente.lat||''}, ${cliente.lng||''})"><i class="fa-solid fa-map"></i> Ver en mapa <i class="fa-solid fa-chevron-right"></i></div>
      </div>
      <div class="actions">
        <button class="btn btn-yellow" onclick="cambiarEstado('${p.firebaseId}','en_camino')"><i class="fa-solid fa-motorcycle"></i> En camino</button>
        <button class="btn btn-vino" onclick="cambiarEstado('${p.firebaseId}','entregado')"><i class="fa-solid fa-check"></i> Entregado</button>
        <button class="btn btn-outline" onclick="cambiarEstado('${p.firebaseId}','cancelado')"><i class="fa-solid fa-ban"></i> Rechazado / Cancelado</button>
      </div>
    </div>`;
  }).join('');
}

window.abrirMapa=function(dir, lat, lng){
  if(lat && lng) window.open(`https://www.google.com/maps?q=${lat},${lng}`,'_blank');
  else window.open(`https://www.google.com/maps/search/${encodeURIComponent(dir)}`,'_blank');
}

window.cambiarEstado=async function(id, estado){
  let msg = estado==='entregado' ? '¿Confirmas entrega?' : estado==='cancelado' ? '¿Cancelar pedido?' : '¿Marcar en camino?';
  if(!confirm(msg)) return;
  try{
    await dbRepartidor.ref('pedidos_en_camino/'+id).update({estado, actualizadoEn: Date.now()});
    await dbPedidos.ref('pedidos/'+id).update({estado, actualizadoEn: Date.now(), repartidor: localStorage.getItem('santillos_rep_user')||'repa'});
    if(estado==='entregado' || estado==='cancelado'){
      setTimeout(async()=>{
        await dbRepartidor.ref('pedidos_en_camino/'+id).remove();
      },1500);
    }
    if(estado==='entregado') alert('¡Entregado! Cliente ya lo ve en confirmación.');
  }catch(e){ alert(e.message); }
}
document.addEventListener('click',()=>{ if(ctx && ctx.state==='suspended') ctx.resume(); });
</script>
</body>
</html>
