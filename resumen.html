<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finalizar compra - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;max-width:500px;margin:0 auto;padding-bottom:24px}
.header{padding:18px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#0f0f0f;z-index:10;border-bottom:1px solid #1e1e1e}
.header a{width:36px;height:36px;background:#1c1c1c;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.header h1{font-size:20px;font-weight:800}
.free-card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;margin:10px 12px;padding:12px}
.free-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.free-top b{font-size:12px}.free-top span{font-size:11px;color:#22c55e;font-weight:800}
.free-bar{width:100%;height:8px;background:#2a2a2a;border-radius:20px;overflow:hidden}
.free-fill{height:100%;background:linear-gradient(90deg,#22c55e,#10d8a2);border-radius:20px;transition:width 0.5s}
.free-sub{font-size:10px;color:#aaa;margin-top:6px}
.map-box{width:100%;height:240px;border-radius:14px;overflow:hidden;margin-top:10px;border:1px solid #2a2a2a}
#map{width:100%;height:100%}
.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;margin:10px 12px;padding:12px}
.card-title{font-size:13px;font-weight:800;margin-bottom:10px}
.input-wrap{position:relative;margin-bottom:4px}
.input-field{background:#232323;border:1px solid #333;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.input-field i{color:#777;font-size:14px;min-width:18px;text-align:center}
.input-field input{flex:1;background:transparent;border:none;color:#fff;font-size:12px;outline:none}
.resumen-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.total-card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:18px;margin:10px 12px;padding:14px}
.total-row{display:flex;justify-content:space-between;margin-bottom:12px}.total-row span{font-size:17px;font-weight:800}
.btn-confirm{width:100%;background:#5e0a28;color:#fff;border:none;border-radius:16px;padding:14px;font-weight:800;font-size:14px;cursor:pointer}
.pac-container{background:#fff!important;border-radius:12px!important;margin-top:6px;box-shadow:0 4px 20px rgba(0,0,0,0.3)!important}
.pac-item{padding:10px 12px!important;font-size:11px!important}
</style>
</head>
<body>
<div class="header"><a href="carrito.html"><i class="fa-solid fa-chevron-left"></i></a><h1>Finalizar compra</h1></div>
<div class="free-card">
  <div class="free-top"><b id="freeTxt"></b><span id="freePct"></span></div>
  <div class="free-bar"><div class="free-fill" id="freeFill"></div></div>
  <div class="free-sub" id="freeSub"></div>
  <div class="map-box"><div id="map"></div></div>
</div>
<div class="card">
  <div class="card-title">Detalles de entrega</div>
  <div class="input-wrap"><div class="input-field"><i class="fa-solid fa-location-dot"></i><input type="text" id="direccion" placeholder="Escribe tu dirección..."></div></div>
  <div class="input-wrap"><div class="input-field"><i class="fa-solid fa-house"></i><input type="text" id="referencia" placeholder="Referencia - Casa azul, portón negro"></div></div>
  <div class="input-wrap"><div class="input-field"><i class="fa-solid fa-phone"></i><input type="tel" id="telefono" placeholder="Teléfono"></div></div>
  <div class="input-wrap"><div class="input-field"><i class="fa-solid fa-user"></i><input type="text" id="nombre" placeholder="Nombre"></div></div>
</div>
<div class="card"><div class="card-title">Resumen del pedido</div><div id="listaResumen"></div><div style="display:flex;justify-content:space-between;padding:8px 0;font-size:11px;color:#999;border-top:1px solid #2a2a2a;margin-top:6px"><span>Subtotal</span><span id="subtotalTxt"></span></div></div>
<div class="total-card"><div class="total-row"><span>Total</span><span id="totalFinal"></span></div><button class="btn-confirm" onclick="confirmarPedido()">Confirmar pedido</button></div>

<script>
const firebaseConfig={apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA",authDomain:"santillos-1ac6d.firebaseapp.com",databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com",projectId:"santillos-1ac6d",storageBucket:"santillos-1ac6d.firebasestorage.app",messagingSenderId:"285600299102",appId:"1:285600299102:web:9590597c2b3d8888821ccf"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const META=200; const TIENDA={lat:21.1560,lng:-100.9340};
let carrito={};try{carrito=JSON.parse(localStorage.getItem('santillos_carrito')||'{}')}catch(e){}
if(Object.keys(carrito).length===0) location.href="carrito.html";
let subtotal=0,html='';Object.values(carrito).forEach(p=>{let t=p.precio*p.cant;subtotal+=t;html+=`<div class="resumen-item"><img src="${p.img}" style="width:38px;height:38px;border-radius:8px"><div style="flex:1"><div style="font-size:11px;font-weight:700">${p.nombre} x${p.cant}</div></div><div style="font-size:11px;font-weight:800">$${t}</div></div>`});
document.getElementById('listaResumen').innerHTML=html;
document.getElementById('subtotalTxt').innerText='$'+subtotal; document.getElementById('totalFinal').innerText='$'+subtotal;
let f=META-subtotal;let pct=Math.min(100,Math.round(subtotal/META*100));document.getElementById('freeFill').style.width=pct+'%';document.getElementById('freePct').innerText=pct+'%';if(f<=0){document.getElementById('freeTxt').innerText='¡Tienes envio gratis!';document.getElementById('freeSub').innerText='Tu pedido supera $'+META;}else{document.getElementById('freeTxt').innerText='Te faltan $'+f+' para envío gratis';document.getElementById('freeSub').innerText='Cuando completes $'+f+' más, tu envío será gratis';}
try{let cli=JSON.parse(localStorage.getItem('santillos_cliente')||'{}');if(cli.nombre)nombre.value=cli.nombre;if(cli.telefono)telefono.value=cli.telefono;if(cli.direccion)direccion.value=cli.direccion;if(cli.referencia)referencia.value=cli.referencia;}catch(e){}

let map, markerTienda, markerCliente, directionsService, directionsRenderer, autocomplete, bounds;
function initMap(){
  map=new google.maps.Map(document.getElementById("map"),{center:TIENDA,zoom:15,disableDefaultUI:false,zoomControl:false,mapTypeControl:false});
  directionsService=new google.maps.DirectionsService();
  directionsRenderer=new google.maps.DirectionsRenderer({map:map,suppressMarkers:true,polylineOptions:{strokeColor:"#5e0a28",strokeWeight:4,strokeOpacity:0.9}});
  bounds=new google.maps.LatLngBounds();

  // ICONOS TIPO PIN DE LA FOTO - RESTAURANTE VINO Y CLIENTE VERDE
  const iconRestaurante = {
    url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="52" viewBox="0 0 40 52"><path d="M20 0C9 0 0 9 0 20c0 14 20 32 20 32s20-18 20-32C40 9 31 0 20 0z" fill="#5e0a28"/><circle cx="20" cy="19" r="8" fill="white"/></svg>`),
    scaledSize: new google.maps.Size(40,52),
    anchor: new google.maps.Point(20,52)
  };

  const iconCliente = {
    url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="52" viewBox="0 0 40 52"><path d="M20 0C9 0 0 9 0 20c0 14 20 32 20 32s20-18 20-32C40 9 31 0 20 0z" fill="#22c55e"/><circle cx="20" cy="19" r="8" fill="white"/></svg>`),
    scaledSize: new google.maps.Size(40,52),
    anchor: new google.maps.Point(20,52)
  };

  markerTienda=new google.maps.Marker({position:TIENDA,map:map,icon:iconRestaurante,title:"Santillos"});
  bounds.extend(TIENDA);
  map.fitBounds(bounds);

  autocomplete=new google.maps.places.Autocomplete(document.getElementById("direccion"),{types:['geocode'],componentRestrictions:{country:'mx'}});
  autocomplete.addListener("place_changed",()=>{
    const place=autocomplete.getPlace();
    if(!place.geometry) return;
    mostrarRuta(place.geometry.location, iconCliente);
  });

  // Guardar iconCliente global para usar en mostrarRuta
  window._iconCliente = iconCliente;
  window._iconRestaurante = iconRestaurante;
}

function mostrarRuta(destino, iconCli){
  if(markerCliente) markerCliente.setMap(null);
  const icono = iconCli || window._iconCliente;
  markerCliente=new google.maps.Marker({position:destino,map:map,icon:icono,title:"Cliente"});
  directionsService.route({origin:TIENDA,destination:destino,travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{
    if(status==='OK'){directionsRenderer.setDirections(res); map.fitBounds(res.routes[0].bounds);} else { bounds=new google.maps.LatLngBounds(); bounds.extend(TIENDA); bounds.extend(destino); map.fitBounds(bounds); }
  });
}

function confirmarPedido(){
  let cli={nombre:nombre.value,telefono:telefono.value,direccion:direccion.value,referencia:referencia.value};
  localStorage.setItem('santillos_cliente',JSON.stringify(cli));
  let pedido={cliente:cli,carrito:carrito,total:subtotal,fecha:Date.now()};
  db.ref('pedidos').push(pedido).then(()=>{localStorage.removeItem('santillos_carrito');location.href='gracias.html'});
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=TU_KEY_AQUI&libraries=places&callback=initMap" async defer></script>
</body>
</html>
