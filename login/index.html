<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#1c1c1c;border:1px solid #2a2a2a;width:100%;max-width:360px;border-radius:28px;padding:28px 22px;box-shadow:0 15px 40px rgba(0,0,0,0.6)}
.logo-wrap{width:72px;height:72px;background:#5e0a28;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px;font-weight:900;border:3px solid #2a2a2a}
.login-title{text-align:center;font-size:20px;font-weight:800;margin-bottom:4px}
.login-sub{text-align:center;font-size:11px;color:#777;font-weight:600;margin-bottom:22px;letter-spacing:0.5px}
.input-group{position:relative;margin-bottom:14px}
.input-group i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#777;font-size:14px}
.input-group input{width:100%;background:#232323;border:1.5px solid #2a2a2a;color:#fff;border-radius:16px;padding:14px 14px 14px 40px;font-size:13px;font-weight:600;outline:none}
.input-group input:focus{border-color:#5e0a28}
.btn-login{width:100%;background:#5e0a28;color:#fff;border:none;border-radius:22px;padding:15px;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}
.btn-login:disabled{opacity:0.6}
.error-msg{display:none;background:rgba(255,90,90,0.12);border:1px solid rgba(255,90,90,0.3);color:#ff7a7a;font-size:11px;font-weight:700;padding:10px 12px;border-radius:12px;margin-bottom:14px;text-align:center}
.error-msg.show{display:block}
.footer-txt{text-align:center;margin-top:18px;font-size:10px;color:#555;font-weight:700}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-wrap">S</div>
  <div class="login-title">Santillos Admin</div>
  <div class="login-sub">ACCESO SOLO PARA ADMINISTRADOR</div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="input-group"><i class="fa-solid fa-user"></i><input type="text" id="user" placeholder="Usuario" autocomplete="off"></div>
  <div class="input-group"><i class="fa-solid fa-lock"></i><input type="password" id="pass" placeholder="Contraseña"></div>
  <button class="btn-login" id="btnLogin" onclick="hacerLogin()">Ingresar</button>
  <div class="footer-txt">SANTILLOS • PANEL PRIVADO</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// TODO: PEGA AQUÍ TU CONFIG DE FIREBASE
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.hacerLogin = async function(){
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  const error = document.getElementById('errorMsg');
  const btn = document.getElementById('btnLogin');

  if(!u ||!p){
    error.innerText = 'Completa usuario y contraseña';
    error.classList.add('show'); return;
  }

  btn.innerText = 'Verificando...'; btn.disabled = true; error.classList.remove('show');

  try{
    const q = query(collection(db, "usuarios"), where("usuario", "==", u), where("password", "==", p), where("activo", "==", true));
    const snap = await getDocs(q);

    if(snap.empty){
      error.innerText = 'Usuario o contraseña incorrectos';
      error.classList.add('show');
      btn.innerText = 'Ingresar'; btn.disabled = false;
      return;
    }

    const data = snap.docs[0].data();

    // Verificamos rol
    if(data.rol!== 'administrador'){
      error.innerText = 'No tienes permiso de administrador';
      error.classList.add('show');
      btn.innerText = 'Ingresar'; btn.disabled = false;
      return;
    }

    // Guardamos sesión
    localStorage.setItem('santillos_admin_login', 'true');
    localStorage.setItem('santillos_admin_user', JSON.stringify(data));

    // Lo mandamos al admin.html que vamos a organizar
    window.location.href = '../admin.html';

  }catch(err){
    console.error(err);
    error.innerText = 'Error de conexión a Firebase';
    error.classList.add('show');
    btn.innerText = 'Ingresar'; btn.disabled = false;
  }
}
</script>
</body>
</html>
