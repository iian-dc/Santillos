<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f6f7f9;display:flex;min-height:100vh}
.sidebar{width:260px;background:#5e0a28;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:0.3s;display:flex;flex-direction:column}
.sidebar-header{padding:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo-circle{width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#5e0a28}
.logo-text{color:#fff;font-weight:800;font-size:14px;line-height:1.1}
.logo-text span{display:block;font-size:9px;color:rgba(255,255,255,0.6);font-weight:600}
.sidebar-menu{flex:1;padding:12px 10px;overflow-y:auto}
.menu-title{font-size:9px;color:rgba(255,255,255,0.5);font-weight:800;letter-spacing:1px;margin:14px 10px 6px}
.menu-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;margin-bottom:3px}
.menu-item.active{background:#fff;color:#5e0a28}
.menu-item i{width:18px;font-size:13px}
.badge-notif{margin-left:auto;background:#16a34a;color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:800;display:none}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,0.1)}
.btn-logout{width:100%;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15);padding:10px;border-radius:12px;font-weight:700;font-size:11px;cursor:pointer}
.main{margin-left:260px;flex:1;min-width:0}
.topbar{height:60px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:50}
.btn-menu{display:none;background:#111;color:#fff;border:none;width:36px;height:36px;border-radius:10px}
.topbar-title{font-weight:800;font-size:18px}
.user-badge{background:#111;color:#fff;padding:7px 14px;border-radius:30px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.content{padding:16px}
.section{display:none}.section.active{display:block}
.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:14px}
.pedido-card{background:#fff;border:1px solid #ececec;border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,0.05)}
.pedido-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.pedido-id-pill{background:#fef9e8;border:1px solid #fdecc8;color:#111;padding:6px 14px;border-radius:10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.pedido-top-meta{display:flex;align-items:center;gap:14px;color:#6b7280;font-size:12px;font-weight:600}
.pedido-top-meta span{display:flex;align-items:center;gap:5px}
.crono-pill{padding:7px 12px;border-radius:30px;font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px}
.crono-pill.verde{background:#d6f8e0;color:#0f7a2e}
.crono-pill.amarillo{background:#fef9c3;color:#8a5a00}
.crono-pill.rojo{background:#fee2e2;color:#b42318;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.pedido-middle{display:grid;grid-template-columns:1.2fr 0.9fr 0.9fr;gap:0;margin-top:12px}
.col{padding:0 14px;position:relative;border-right:1px solid #f0f0f0}
.col:last-child{border-right:none}
.col:first-child{padding-left:0}
.arrow-btn{position:absolute;top:0;right:6px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#dc2626;cursor:pointer;font-size:13px;background:transparent;border:none}
.col-name{font-weight:800;font-size:13px;color:#111;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.col-sub{font-size:11.5px;color:#4b5563;display:flex;gap:7px;margin-bottom:4px;line-height:1.3}
.col-total-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.col-total{font-size:22px;font-weight:900;color:#111}
.badge-estado{background:#fff1f2;color:#e11d48;border:1px solid #ffe4e6;padding:5px 10px;border-radius:20px;font-size:9px;font-weight:800;display:flex;align-items:center;gap:5px}
.pedido-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #f0f0f0;flex-wrap:wrap}
.btn-act{border:none;padding:10px 16px;border-radius:30px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;flex:1;justify-content:center;min-width:110px}
.btn-acept{background:#22c55e;color:#fff}
.btn-prep{background:#f59e0b;color:#fff}
.btn-camino{background:#3b82f6;color:#fff}
.btn-entre{background:#15803d;color:#fff}
.btn-cancel{background:#ef4444;color:#fff}
.btn-act.active{outline:2px solid #111;outline-offset:2px}
.overlay-modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.overlay-modal.show{display:flex}
.modal-card{background:#fff;border-radius:20px;width:100%;max-width:360px;overflow:hidden}
.modal-header{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0}
.modal-header h3{font-size:14px;font-weight:800;color:#111;display:flex;align-items:center;gap:8px}
.btn-close{width:28px;height:28px;border-radius:50%;background:#f3f4f6;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#111}
.modal-body{padding:16px 18px}
.modal-line{display:flex;gap:10px;margin-bottom:10px;font-size:12px}
.btn-call{width:100%;background:#111;color:#fff;border:none;padding:12px;border-radius:30px;font-weight:800;font-size:13px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-block{width:100%;padding:12px;border-radius:30px;font-weight:800;font-size:13px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none}
.btn-block.bloquear{background:#111;color:#fff}
.btn-block.desbloquear{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
@media(max-width:900px){
.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.btn-menu{display:flex;align-items:center;justify-content:center}
.pedido-middle{grid-template-columns:1fr;gap:10px}
.col{border-right:none;border-bottom:1px solid #f0f0f0;padding:0 0 10px 0;margin-bottom:2px}
.col:last-child{border-bottom:none}
}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="logo-circle">S</div><div class="logo-text">SANTILLOS<span>PANEL ADMIN</span></div></div>
  <div class="sidebar-menu">
    <div class="menu-title">OPERACIÓN</div>
    <div class="menu-item active" onclick="goTo('pedidos_activos', this)"><i class="fa-solid fa-fire"></i> Pedidos Activos <span id="countVivo" class="badge-notif">0</span></div>
    <div class="menu-item" onclick="goTo('dashboard', this)"><i class="fa-solid fa-chart-simple"></i> Dashboard</div>
    <div class="menu-item" onclick="goTo('historial', this)"><i class="fa-solid fa-clock-rotate-left"></i> Historial</div>
  </div>
  <div class="sidebar-footer"><button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</button></div>
</div>
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-menu" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-title">Pedidos Activos</div>
      <button id="btnActivarSonido" onclick="activarSonido()" style="background:#22c55e;color:#fff;border:none;padding:7px 14px;border-radius:30px;font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px"><i class="fa-solid fa-bell"></i> ACTIVAR SONIDO</button>
    </div>
    <div class="user-badge"><i class="fa-solid fa-user"></i> <span id="userNameTop">admin</span></div>
  </div>
  <div class="content"><div class="section active" id="sec-pedidos_activos"><div id="listaPedidosActivos"></div></div></div>
</div>

<div class="overlay-modal" id="modalCliente" onclick="if(event.target===this)cerrarModales()"><div class="modal-card"><div class="modal-header"><h3><i class="fa-solid fa-user"></i> Datos del Cliente</h3><button class="btn-close" onclick="cerrarModales()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body" id="bodyCliente"></div></div></div>
<div class="overlay-modal" id="modalIP" onclick="if(event.target===this)cerrarModales()"><div class="modal-card"><div class="modal-header"><h3><i class="fa-solid fa-globe"></i> Información IP</h3><button class="btn-close" onclick="cerrarModales()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body" id="bodyIP"></div></div></div>
<div class="overlay-modal" id="modalProd" onclick="if(event.target===this)cerrarModales()"><div class="modal-card"><div class="modal-header"><h3><i class="fa-solid fa-bag-shopping"></i> Productos</h3><button class="btn-close" onclick="cerrarModales()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body" id="bodyProd"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA", authDomain:"santillos-1ac6d.firebaseapp.com", databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com", projectId:"santillos-1ac6d", storageBucket:"santillos-1ac6d.firebasestorage.app", messagingSenderId:"285600299102", appId:"1:285600299102:web:9590597c2b3d8888821ccf" };
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
if(!localStorage.getItem('santillos_admin_login')){window.location.href='./';}
document.getElementById('userNameTop').innerText=localStorage.getItem('santillos_admin_usuario')||'admin';
window.goTo=function(id,el){
  if(id==='pedidos_activos'){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('sec-'+id).classList.add('active');
    document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
    if(el)el.classList.add('active');
    document.getElementById('sidebar').classList.remove('open');
  }else{window.location.href='./'+id+'/';}
}
window.cerrarSesion=function(){localStorage.clear();window.location.href='./';}

let pedidosCache=[];let pedidosTodosCache=[];let ipsBloqueadasCache={};
let idsVistos=new Set(); let primerCarga=true; let sonidoActivado=false;

function obtenerInicioPedido(p){if(p.timestamp)return new Date(p.timestamp);if(p.creadoEn)return new Date(p.creadoEn);if(p.fechaISO)return new Date(p.fechaISO);return new Date();}
function calcularMinutos(p){const ini=obtenerInicioPedido(p);return Math.max(0,Math.floor((new Date()-ini)/60000));}
function estadoIP(ip){if(!ip)return 'sin_ip';const k=ip.replace(/\./g,'_');return ipsBloqueadasCache[k]?'bloqueada':'activa';}

window.cerrarModales=function(){document.querySelectorAll('.overlay-modal').forEach(m=>m.classList.remove('show'));}
window.abrirCliente=function(id){
  const p=pedidosCache.find(x=>x.id===id)||pedidosTodosCache.find(x=>x.id===id);if(!p)return;
  const nombre=p.cliente?.nombre||p.nombre||'Sin nombre'; const dir=p.cliente?.direccion||p.direccion||'Sin dirección'; const tel=p.cliente?.telefono||p.telefono||''; const refTxt=p.referencia||p.cliente?.referencia||'';
  document.getElementById('bodyCliente').innerHTML=`<div class="modal-line"><i class="fa-solid fa-user"></i><div><b>Nombre</b><br><span>${nombre}</span></div></div><div class="modal-line"><i class="fa-solid fa-location-dot"></i><div><b>Dirección</b><br><span>${dir}${refTxt?'<br><small>Ref: '+refTxt+'</small>':''}</span></div></div><div class="modal-line"><i class="fa-solid fa-phone"></i><div><b>Tel</b><br><span>${tel}</span></div></div><button class="btn-call" onclick="window.open('tel:${tel}')"><i class="fa-solid fa-phone"></i> Llamar</button>`;
  document.getElementById('modalCliente').classList.add('show');
}
window.abrirIP=function(id){
  const p=pedidosCache.find(x=>x.id===id)||pedidosTodosCache.find(x=>x.id===id);if(!p)return;
  const ip=p.ip||p.ipCliente||'Sin IP';const ciudad=p.ciudad||p.ciudadIP||'Dolores';const esBloq=estadoIP(p.ip||p.ipCliente||'')==='bloqueada';
  document.getElementById('bodyIP').innerHTML=`<div class="modal-line"><b>IP:</b> <span>${ip}</span></div><div class="modal-line"><b>Ciudad:</b> <span>${ciudad}</span></div><div class="modal-line"><b>Estado:</b> <span style="color:${esBloq?'red':'green'}">${esBloq?'BLOQUEADA':'ACTIVA'}</span></div>${esBloq?`<button class="btn-block desbloquear" onclick="desbloquearIP('${ip}');cerrarModales()">Desbloquear</button>`:`<button class="btn-block bloquear" onclick="bloquearIP('${ip}','${p.id}');cerrarModales()">Bloquear IP</button>`}`;
  document.getElementById('modalIP').classList.add('show');
}
window.abrirProductos=function(id){
  const p=pedidosCache.find(x=>x.id===id)||pedidosTodosCache.find(x=>x.id===id);if(!p)return;
  let lista='';if(Array.isArray(p.productos)){ lista=p.productos.map(pr=>`<div class='modal-line' style='justify-content:space-between'><span>${pr.cantidad||pr.cant||1}x ${pr.nombre||''}</span><b>$${(pr.precio||0)*(pr.cantidad||pr.cant||1)}</b></div>`).join(''); }
  else if(typeof p.productos==='object'&&p.productos!==null){ lista=Object.values(p.productos).map(pr=>`<div class='modal-line' style='justify-content:space-between'><span>${pr.cantidad||pr.cant||1}x ${pr.nombre||''}</span><b>$${(pr.precio||0)*(pr.cantidad||pr.cant||1)}</b></div>`).join(''); }
  document.getElementById('bodyProd').innerHTML=`${lista}<div style="border-top:1px solid #f0f0f0;margin-top:10px;padding-top:10px"><div class="modal-line" style="justify-content:space-between"><span>Total</span><b>$${p.total||0}</b></div></div>`;
  document.getElementById('modalProd').classList.add('show');
}

function renderPedidos(){
  const cont=document.getElementById('listaPedidosActivos');
  if(pedidosCache.length===0){cont.innerHTML='<div class="card" style="text-align:center;color:#999;padding:24px">No hay pedidos activos</div>';return;}
  cont.innerHTML=pedidosCache.map((p)=>{
    const minutos=calcularMinutos(p);
    let cronoClass='verde';if(minutos>=40)cronoClass='rojo';else if(minutos>=20)cronoClass='amarillo';
    const numeroPedido = p.numero || `ST-${String(p.correlativo||0).padStart(4,'0')}`;
    const nombre=p.cliente?.nombre||p.nombre||'Sin nombre'; const telefono=p.cliente?.telefono||p.telefono||''; const direccion=p.cliente?.direccion||p.direccion||'Sin dirección';
    const ipActual=p.ip||p.ipCliente||''; const ciudad=p.ciudad||p.ciudadIP||'Dolores Hidalgo';
    let productosCorto='Sin productos';let cantTxt='';if(Array.isArray(p.productos)&&p.productos.length>0){const pr=p.productos[0];productosCorto=pr.nombre||'';cantTxt=(pr.cantidad||pr.cant||1)+'x '; if(p.productos.length>1) productosCorto+=' +'+(p.productos.length-1)+' más';}else if(typeof p.productos==='object'&&p.productos!==null){const vals=Object.values(p.productos);if(vals.length>0){productosCorto=vals[0].nombre||'';cantTxt=(vals[0].cantidad||vals[0].cant||1)+'x ';}}
    const fechaMostrar=p.fecha||new Date(obtenerInicioPedido(p)).toLocaleDateString();const horaMostrar=p.hora||new Date(obtenerInicioPedido(p)).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true});
    return `<div class="pedido-card"><div class="pedido-top"><div class="pedido-id-pill"><i class="fa-solid fa-hashtag"></i> ${numeroPedido}</div><div class="pedido-top-meta"><span><i class="fa-regular fa-calendar"></i> ${fechaMostrar}</span><span style="width:1px;height:14px;background:#e5e7eb"></span><span><i class="fa-regular fa-clock"></i> ${horaMostrar}</span></div><div class="crono-pill ${cronoClass}"><i class="fa-solid fa-stopwatch"></i> ${minutos} min</div></div><div class="pedido-middle"><div class="col"><button class="arrow-btn" onclick="abrirCliente('${p.id}')"><i class="fa-solid fa-chevron-right"></i></button><div class="col-name"><i class="fa-solid fa-user"></i> ${nombre}</div><div class="col-name"><i class="fa-solid fa-phone"></i> ${telefono}</div><div class="col-name" style="font-weight:400;color:#4b5563"><i class="fa-solid fa-location-dot"></i> ${direccion.slice(0,40)}</div></div><div class="col"><button class="arrow-btn" onclick="abrirIP('${p.id}')"><i class="fa-solid fa-chevron-right"></i></button><div class="col-name"><i class="fa-solid fa-globe"></i> ${ipActual||'IP pendiente'}</div><div class="col-name" style="font-weight:400;color:#4b5563">${ciudad}</div></div><div class="col"><button class="arrow-btn" onclick="abrirProductos('${p.id}')"><i class="fa-solid fa-chevron-right"></i></button><div class="col-name" style="color:#b45309"><i class="fa-solid fa-bag-shopping"></i> Productos</div><div style="font-size:11.5px;color:#4b5563">${cantTxt}${productosCorto}</div><div class="col-total-row"><div class="col-total">$${Number(p.total||0).toLocaleString()}</div><div class="badge-estado">${(p.estado||'pendiente').toUpperCase()}</div></div></div></div><div class="pedido-actions"><button class="btn-act btn-acept ${p.estado==='aceptado'?'active':''}" onclick="cambiarEstado('${p.id}','aceptado')"><i class="fa-solid fa-check"></i> Aceptado</button><button class="btn-act btn-prep ${p.estado==='preparando'?'active':''}" onclick="cambiarEstado('${p.id}','preparando')"><i class="fa-solid fa-stopwatch"></i> Preparando</button><button class="btn-act btn-camino ${p.estado==='en_camino'?'active':''}" onclick="cambiarEstado('${p.id}','en_camino')"><i class="fa-solid fa-motorcycle"></i> En camino</button><button class="btn-act btn-entre ${p.estado==='entregado'?'active':''}" onclick="cambiarEstado('${p.id}','entregado')"><i class="fa-solid fa-box-open"></i> Entregado</button><button class="btn-act btn-cancel ${p.estado==='cancelado'?'active':''}" onclick="cambiarEstado('${p.id}','cancelado')"><i class="fa-solid fa-xmark"></i> Cancelar</button></div></div>`;
  }).join('');
}

window.cambiarEstado=function(id,nuevoEstado){update(ref(db,'pedidos/'+id),{estado:nuevoEstado});}
window.bloquearIP=async function(ip,pedidoId){if(!ip)return;const key=ip.replace(/\./g,'_');await update(ref(db,'ips_bloqueadas/'+key),{ip:ip,fecha:new Date().toLocaleString(),timestamp:Date.now(),pedidoId:pedidoId});}
window.desbloquearIP=async function(ip){const key=ip.replace(/\./g,'_');await remove(ref(db,'ips_bloqueadas/'+key));}

// SONIDO CON WEB AUDIO API (siempre funciona)
let audioCtx=null;
function sonarAlerta(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.8,audioCtx.currentTime); o.start();
    o.frequency.exponentialRampToValueAtTime(440,audioCtx.currentTime+0.4);
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);
    setTimeout(()=>{o.stop();},700);
    // segundo beep
    setTimeout(()=>{
      const o2=audioCtx.createOscillator(); const g2=audioCtx.createGain();
      o2.type='sine'; o2.frequency.value=880; o2.connect(g2); g2.connect(audioCtx.destination);
      g2.gain.setValueAtTime(0.8,audioCtx.currentTime); o2.start();
      o2.frequency.exponentialRampToValueAtTime(440,audioCtx.currentTime+0.4);
      g2.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);
      setTimeout(()=>{o2.stop();},700);
    },300);
  }catch(e){console.log('Audio error',e)}
}

window.activarSonido=function(){
  sonidoActivado=true;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume().then(()=>{
    sonarAlerta();
    document.getElementById('btnActivarSonido').innerHTML='<i class="fa-solid fa-check"></i> SONIDO ACTIVO';
    document.getElementById('btnActivarSonido').style.background='#111';
    localStorage.setItem('santillos_sonido_activo','1');
  });
  if(Notification && Notification.permission!=="granted"){
    Notification.requestPermission();
  }
}
// Auto activar si ya lo activo antes
if(localStorage.getItem('santillos_sonido_activo')==='1'){
  sonidoActivado=true;
  document.addEventListener('click',()=>{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();
  },{once:true});
}

onValue(ref(db,'ips_bloqueadas'),snap=>{ipsBloqueadasCache=snap.val()||{};renderPedidos();});

onValue(ref(db,'pedidos'),snap=>{
  const data=snap.val()||{};
  let todas=Object.entries(data).map(([k,v])=>({id:k,...v}));

  // ORDENAR POR CORRELATIVO ASCENDENTE PARA NUMERACION FIJA
  todas.sort((a,b)=>{
    const ca=a.correlativo||0; const cb=b.correlativo||0;
    if(ca!==0 && cb!==0) return ca - cb;
    if(ca!==0) return -1;
    if(cb!==0) return 1;
    return (a.timestamp||0) - (b.timestamp||0);
  });
  todas.forEach((p,idx)=>{
    if(!p.correlativo){ p.correlativo = idx+1; if(!p.numero) p.numero = `ST-${String(idx+1).padStart(4,'0')}`; }
    if(!p.numero) p.numero = `ST-${String(p.correlativo).padStart(4,'0')}`;
  });

  pedidosTodosCache=todas;
  let activas=todas.filter(p=>p.estado!=='entregado'&&p.estado!=='cancelado');

  // *** AQUI ESTA EL FIX: FIFO - VIEJO ARRIBA, NUEVO ABAJO ***
  activas.sort((a,b)=> (a.correlativo||0) - (b.correlativo||0));

  // SONIDO SI HAY NUEVO
  if(!primerCarga){
    const nuevos=activas.filter(p=>!idsVistos.has(p.id));
    if(nuevos.length>0 && sonidoActivado){
      sonarAlerta();
      if(navigator.vibrate) navigator.vibrate([300,100,300]);
      // scroll abajo para ver el nuevo que llego al final
      setTimeout(()=>{ window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'}); },300);
    }
  }
  idsVistos=new Set(activas.map(p=>p.id));
  primerCarga=false;

  pedidosCache=activas;
  document.getElementById('countVivo').style.display=activas.length>0?'inline-block':'none';
  document.getElementById('countVivo').innerText=activas.length;
  renderPedidos();
});
setInterval(renderPedidos,1000);
</script>
</body>
</html>
