<script>
function showElegant(t,m){document.getElementById("elegantTitle").innerText=t;document.getElementById("elegantText").innerText=m;document.getElementById("elegantOverlay").classList.add("show");}
function cerrarElegant(){document.getElementById("elegantOverlay").classList.remove("show");}
function abrirCarrito(){document.getElementById("cartModal").style.display="flex";document.getElementById("cartOverlay").classList.add("show");renderCart();}
function cerrarCarrito(){document.getElementById("cartModal").style.display="none";document.getElementById("cartOverlay").classList.remove("show");}
function abrirCheckout(){if(Object.keys(carrito).length===0){showElegant("Carrito vacio","Agrega productos primero");return;}cerrarCarrito();document.getElementById("checkoutModal").style.display="block";setTimeout(()=>{initMapa();},300);actualizarResumenFinal();}
function cerrarCheckout(){document.getElementById("checkoutModal").style.display="none";}
function cerrarLogin(){document.getElementById("loginOverlay").classList.remove("show");}
function togglePass(id,btn){let i=document.getElementById(id);if(i.type==="password"){i.type="text";btn.innerHTML='<i class="fas fa-eye-slash"></i>';}else{i.type="password";btn.innerHTML='<i class="fas fa-eye"></i>';}}

function renderCategorias(){let c=document.getElementById("categories");c.innerHTML="";Object.keys(menuData).forEach(cat=>{c.innerHTML+=`<button class="cat-btn ${cat===categoriaActiva?'active':''}" onclick="categoriaActiva='${cat}';renderCategorias();renderProductos()">${cat}</button>`;});}
function renderProductos(){let p=document.getElementById("products");p.innerHTML="";(menuData[categoriaActiva]||[]).forEach((prod,idx)=>{if(prod.disp===false)return;p.innerHTML+=`<div class="product-card"><img src="${prod.img}"><div class="product-info"><div class="product-name">${prod.name}</div><div class="product-desc">${prod.desc}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><div class="product-price">$${prod.price}</div><button onclick="addToCart('${categoriaActiva}',${idx})" style="background:#111;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800"><i class="fas fa-plus"></i> Agregar</button></div></div></div>`;});}
function addToCart(cat,idx){let prod=menuData[cat][idx];let id=cat+"_"+idx;cambiarQty(id,1,prod.name,prod.price,prod.img);}
function cambiarQty(id,delta,nombre,precio,img){if(!carrito[id])carrito[id]={nombre,precio,img,cant:0};carrito[id].cant+=delta;if(carrito[id].cant<=0)delete carrito[id];actualizarBadge();renderCart();}
function eliminar(id){delete carrito[id];actualizarBadge();renderCart();}
function actualizarBadge(){let total=Object.values(carrito).reduce((a,b)=>a+b.cant,0);document.getElementById("cartCount").innerText=total;}
function estaAbiertoAhora(){if(!config.autoHorario)return config.abierto;let dias=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];let ahora=new Date();let dia=dias[ahora.getDay()];let h=config.horario[dia];if(!h||!h.activo)return false;let ahoraMin=ahora.getHours()*60+ahora.getMinutes();let ap=h.apertura.split(":");let ci=h.cierre.split(":");return ahoraMin>=parseInt(ap[0])*60+parseInt(ap[1]) && ahoraMin<=parseInt(ci[0])*60+parseInt(ci[1]);}
function aplicarConfig(){document.getElementById("restNameDisplay").innerText=config.nombre;document.getElementById("headerBg").style.backgroundImage=`url(${config.portada})`;document.getElementById("logoImg").src=config.logo;document.getElementById("loginLogoImg").src=config.logo;document.documentElement.style.setProperty('--theme',config.color);}

// FUNCION CORREGIDA ALGO MAS - PRODUCTOS DISPONIBLES REALES
function obtenerProductosParaAlgoMas(){
let todos=[];
Object.keys(menuData).forEach(cat=>{
menuData[cat].forEach((p,idx)=>{
if(p.disp===false)return;
let id=cat+"_"+idx;
if(carrito[id])return;
todos.push({cat,idx,...p});
});
});
todos.sort(()=>0.5-Math.random());
return todos.slice(0,6);
}
function renderCart(){
let list=document.getElementById("cartList");
let ids=Object.keys(carrito);
if(ids.length===0){list.innerHTML='<div style="text-align:center;padding:20px;color:#777"><i class="fas fa-shopping-cart"></i> Carrito vacio</div>';}
else{
list.innerHTML="";
ids.forEach(id=>{
let it=carrito[id];
list.innerHTML+=`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0"><img src="${it.img}" style="width:50px;height:50px;border-radius:10px;object-fit:cover"><div style="flex:1"><div style="font-weight:800;font-size:12px">${it.nombre} x${it.cant}</div><div style="font-size:11px">$${it.precio*it.cant}</div></div><div style="display:flex;gap:6px;align-items:center"><button onclick="cambiarQty('${id}',-1,'${it.nombre}',${it.precio},'${it.img}')" style="width:28px;height:28px;border-radius:50%;border:1px solid #ddd">-</button><span style="font-size:12px;font-weight:800">${it.cant}</span><button onclick="cambiarQty('${id}',1,'${it.nombre}',${it.precio},'${it.img}')" style="width:28px;height:28px;border-radius:50%;border:1px solid #ddd">+</button><button onclick="eliminar('${id}')" style="border:none;background:none;color:#ff4444"><i class="fas fa-trash"></i></button></div></div>`;
});
}
let addDiv=document.getElementById("addonsScroll");
addDiv.innerHTML="";
obtenerProductosParaAlgoMas().forEach(e=>{
addDiv.innerHTML+=`<div onclick="addToCart('${e.cat}',${e.idx})" style="min-width:90px;background:#fff;border:1px solid #eee;border-radius:12px;padding:8px;text-align:center"><img src="${e.img}" style="width:60px;height:60px;border-radius:10px;object-fit:cover"><div style="font-size:10px;font-weight:800;margin-top:4px">${e.name}</div><div style="font-size:10px;color:#111">$${e.price}</div></div>`;
});
actualizarResumenFinal();
}
</script>
