<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;max-width:500px;margin:0 auto;padding-bottom:160px}
.header-carrito{display:flex;align-items:center;gap:12px;padding:16px;background:#0f0f0f;position:sticky;top:0;z-index:10;border-bottom:1px solid #1c1c1c}
.btn-back{width:42px;height:42px;border-radius:50%;background:#1c1c1c;border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.titulo-carrito{font-size:28px;font-weight:800;flex:1}
.btn-trash{width:42px;height:42px;border-radius:50%;background:#1c1c1c;border:none;color:#fff;font-size:16px;cursor:pointer}
.subtitulo{padding:16px 16px 8px;color:#888;font-size:14px;font-weight:700;letter-spacing:0.5px}
.productos-carrito{padding:12px;display:grid;gap:12px}
.item-carrito{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:18px;display:flex;overflow:hidden;position:relative;padding:12px;gap:12px;align-items:center}
.item-img{width:80px;min-width:80px;height:80px;border-radius:12px;background:#2a2a2a;overflow:hidden;display:flex;align-items:center;justify-content:center}
.item-img img{width:100%;height:100%;object-fit:cover}
.item-info{flex:1}
.item-name{font-weight:700;font-size:15px}
.item-cant{font-size:12px;color:#aaa;margin-top:2px}
.item-price{font-weight:800;font-size:16px;margin-top:6px}
.item-acciones{display:flex;flex-direction:column;gap:8px}
.btn-icon{width:36px;height:36px;border-radius:10px;border:none;background:#252525;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-icon.delete{color:#ff5a5a}
.resumen{margin:16px;background:#1c1c1c;border-radius:18px;padding:16px;border:1px solid #2a2a2a}
.fila-resumen{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:#aaa}
.fila-resumen.total{color:#fff;font-weight:800;font-size:16px;border-top:1px solid #2a2a2a;margin-top:8px;padding-top:12px}
/* BOTON CENTRADO CORREGIDO */
.btn-pedir{width:92%;max-width:468px;background:#5e0a28;color:#fff;border:none;padding:16px;border-radius:25px;font-weight:800;font-size:16px;cursor:pointer;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);margin:0;z-index:101}
.bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:460px;background:#1e1e1e;border:1px solid #2a2a2a;display:flex;justify-content:space-around;align-items:center;padding:14px 8px;z-index:100;border-radius:28px}
.nav-item-rappi{display:flex;flex-direction:column;align-items:center;gap:4px;color:#777;font-size:9px;font-weight:800;background:none;border:none;cursor:pointer;min-width:64px;text-decoration:none}
.nav-item-rappi.active{color:#fff}
.nav-item-rappi i{font-size:20px}
.cart-badge{position:absolute;top:-2px;right:10px;background:#ff2e2e;color:#fff;font-size:9px;font-weight:900;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.nav-wrap{position:relative}
.vacio{text-align:center;padding:40px;color:#666}
.modal-qty{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center}
.modal-qty.show{display:flex}
.modal-box{background:#1e1e1e;border:1px solid #333;border-radius:20px;padding:20px;width:85%;max-width:320px;text-align:center}
.qty-modal-control{display:flex;align-items:center;justify-content:center;gap:20px;margin:20px 0}
.qty-modal-btn{width:44px;height:44px;border-radius:50%;border:none;background:#5e0a28;color:#fff;font-size:22px;font-weight:900;cursor:pointer}
.modal-vaciar{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-vaciar.show{display:flex}
.modal-vaciar-card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:24px;padding:24px;width:92%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.6);animation:popIn 0.25s ease}
@keyframes popIn{0%{transform:scale(0.9);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-vaciar-icon{width:64px;height:64px;background:#2a1a1a;border:1px solid #3a2222;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#ff5a5a;font-size:28px}
.modal-vaciar-title{font-size:18px;font-weight:800;margin-bottom:6px}
.modal-vaciar-sub{font-size:13px;color:#888;margin-bottom:22px;line-height:1.4}
.modal-vaciar-actions{display:flex;gap:12px}
.btn-modal-no{flex:1;background:#22c55e;color:#fff;border:none;padding:13px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-modal-si{flex:1;background:#ef4444;color:#fff;border:none;padding:13px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
</style>
</head>
<body>
<div class="header-carrito">
  <button class="btn-back" onclick="location.href='menu.html'"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="titulo-carrito">Carrito</div>
  <button class="btn-trash" onclick="abrirVaciarModal()"><i class="fa-solid fa-trash"></i></button>
</div>
<div class="subtitulo">Productos seleccionados</div>
<div class="productos-carrito" id="listaCarrito"></div>
<div class="resumen" id="resumen" style="display:none">
  <div class="fila-resumen"><span>Subtotal</span><span id="subtotal">$0</span></div>
  <div class="fila-resumen total"><span>Total</span><span id="total">$0</span></div>
</div>
<button class="btn-pedir" id="btnPedir" style="display:none" onclick="irAPagar()">Hacer pedido</button>

<div class="bottom-nav">
  <a href="menu.html" class="nav-item-rappi"><i class="fa-solid fa-house"></i>INICIO</a>
  <div class="nav-wrap"><a href="carrito.html" class="nav-item-rappi active"><i class="fa-solid fa-bag-shopping"></i>CARRITO</a><div class="cart-badge" id="cartCount">0</div></div>
</div>

<div class="modal-qty" id="modalQty" onclick="cerrarModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div style="font-weight:800" id="modalNombre">Producto</div>
    <div class="qty-modal-control">
      <button class="qty-modal-btn" onclick="cambiarModalQty(-1)">−</button>
      <div id="modalCant" style="font-size:22px;font-weight:800;min-width:30px">1</div>
      <button class="qty-modal-btn" onclick="cambiarModalQty(1)">+</button>
    </div>
    <button style="background:#fff;color:#111;border:none;padding:10px 20px;border-radius:20px;font-weight:800;width:100%" onclick="guardarModalQty()">Guardar</button>
  </div>
</div>

<div class="modal-vaciar" id="modalVaciar" onclick="cerrarVaciarModal()">
  <div class="modal-vaciar-card" onclick="event.stopPropagation()">
    <div class="modal-vaciar-icon"><i class="fa-solid fa-trash-can"></i></div>
    <div class="modal-vaciar-title">¿Deseas vaciar el carrito?</div>
    <div class="modal-vaciar-sub">Se eliminarán todos los productos que agregaste. Esta acción no se puede deshacer.</div>
    <div class="modal-vaciar-actions">
      <button class="btn-modal-no" onclick="cerrarVaciarModal()"><i class="fa-solid fa-xmark"></i> No</button>
      <button class="btn-modal-si" onclick="confirmarVaciar()"><i class="fa-solid fa-check"></i> Sí, vaciar</button>
    </div>
  </div>
</div>

<script>
// ===== DOS FIREBASES - ORGANIZADO =====
const firebaseConfigMenu={
  apiKey:"AIzaSyCvnHeXuZZ-2IOF3Oas09VNYJK_HLLkau8",
  authDomain:"santillos-menu.firebaseapp.com",
  databaseURL:"https://santillos-menu-default-rtdb.firebaseio.com",
  projectId:"santillos-menu",
  storageBucket:"santillos-menu.firebasestorage.app",
  messagingSenderId:"913879229999",
  appId:"1:913879229999:web:bff40819ea0f91d040c8da"
};
const firebaseConfigPedidos={
  apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA",
  authDomain:"santillos-1ac6d.firebaseapp.com",
  databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com",
  projectId:"santillos-1ac6d",
  storageBucket:"santillos-1ac6d.firebasestorage.app",
  messagingSenderId:"285600299102",
  appId:"1:285600299102:web:9590597c2b3d8888821ccf"
};
const appMenu = firebase.initializeApp(firebaseConfigMenu, "menuApp");
const appPedidos = firebase.initializeApp(firebaseConfigPedidos, "pedidosApp");
const dbPedidos = appPedidos.database();

let sessionId = localStorage.getItem('santillos_session_id');
if(!sessionId){
  sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
  localStorage.setItem('santillos_session_id', sessionId);
}

let carrito = {}; let cantidades = {};
let modalId = null; let modalTempCant = 1;

function cargarCarrito(){
  try{
    let c1 = localStorage.getItem('santillos_carrito_v3');
    let c2 = localStorage.getItem('santillos_carrito');
    carrito = JSON.parse(c1 || c2 || '{}');
  }catch(e){ carrito={}; }
  try{
    let q1 = localStorage.getItem('santillos_cantidades_v3');
    let q2 = localStorage.getItem('santillos_cantidades');
    cantidades = JSON.parse(q1 || q2 || '{}');
  }catch(e){ cantidades={}; }
}
cargarCarrito();

function guardarCarrito(){
  localStorage.setItem('santillos_carrito', JSON.stringify(carrito));
  localStorage.setItem('santillos_carrito_v3', JSON.stringify(carrito));
  localStorage.setItem('santillos_cantidades', JSON.stringify(cantidades));
  localStorage.setItem('santillos_cantidades_v3', JSON.stringify(cantidades));
  // Guardar en prepedido en santillos-pedidos
  try{
    if(Object.keys(carrito).length===0){
      dbPedidos.ref('prepedido/'+sessionId).remove();
    } else {
      dbPedidos.ref('prepedido/'+sessionId).set({
        carrito: carrito,
        cantidades: cantidades,
        fecha: new Date().toISOString(),
        totalItems: Object.values(carrito).reduce((s,b)=>s+(b.cant||0),0)
      });
    }
  }catch(e){}
}

function renderCarrito(){
  const cont = document.getElementById('listaCarrito');
  const ids = Object.keys(carrito);
  document.getElementById('cartCount').innerText = Object.values(carrito).reduce((s,b)=>s+(b.cant||0),0);
  if(ids.length===0){
    cont.innerHTML = '<div class="vacio"><i class="fa-solid fa-bag-shopping" style="font-size:40px;margin-bottom:12px"></i><div>Tu carrito está vacío</div><div style="margin-top:8px;font-size:13px"><a href="menu.html" style="color:#5e0a28;text-decoration:none;font-weight:800">Ir al menú</a></div></div>';
    document.getElementById('resumen').style.display='none';
    document.getElementById('btnPedir').style.display='none';
    return;
  }
  let html=''; let subtotal=0;
  ids.forEach(id=>{
    const item = carrito[id];
    const img = item.img || 'https://via.placeholder.com/80x80?text=S';
    const totalItem = (Number(item.precio||0))*(Number(item.cant||0));
    subtotal+=totalItem;
    html+=`<div class="item-carrito">
      <div class="item-img"><img src="${img}" onerror="this.src='https://via.placeholder.com/80x80?text=S'"></div>
      <div class="item-info">
        <div class="item-name">${item.nombre||'Producto'}</div>
        <div class="item-cant">Cantidad: ${item.cant} • $${item.precio} c/u</div>
        <div class="item-price">$${totalItem}</div>
      </div>
      <div class="item-acciones">
        <button class="btn-icon" onclick="editarItem('${id}')"><i class="fa-solid fa-pencil"></i></button>
        <button class="btn-icon delete" onclick="eliminarItem('${id}')"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`;
  });
  cont.innerHTML=html;
  document.getElementById('subtotal').innerText='$'+subtotal;
  document.getElementById('total').innerText='$'+subtotal;
  document.getElementById('resumen').style.display='block';
  document.getElementById('btnPedir').style.display='block';
}

renderCarrito();

// También escucha prepedido en tiempo real por si viene de menu.html
try{
  dbPedidos.ref('prepedido/'+sessionId).on('value', snap=>{
    if(snap.exists()){
      const data = snap.val();
      if(data.carrito){
        // Solo actualiza si local está vacío o diferente
        if(Object.keys(carrito).length===0){
          carrito = data.carrito;
          cantidades = data.cantidades||{};
          guardarCarrito();
          renderCarrito();
        }
      }
    }
  });
}catch(e){}

function editarItem(id){
  modalId=id;
  modalTempCant=carrito[id].cant||1;
  document.getElementById('modalNombre').innerText=carrito[id].nombre||'Producto';
  document.getElementById('modalCant').innerText=modalTempCant;
  document.getElementById('modalQty').classList.add('show');
}
function cambiarModalQty(d){ modalTempCant+=d; if(modalTempCant<1)modalTempCant=1; if(modalTempCant>99)modalTempCant=99; document.getElementById('modalCant').innerText=modalTempCant; }
function guardarModalQty(){
  if(!modalId) return;
  carrito[modalId].cant=modalTempCant;
  cantidades[modalId]=modalTempCant;
  guardarCarrito();
  cerrarModal(); renderCarrito();
}
function cerrarModal(){ document.getElementById('modalQty').classList.remove('show'); modalId=null; }
function eliminarItem(id){ delete carrito[id]; delete cantidades[id]; guardarCarrito(); renderCarrito(); }

function abrirVaciarModal(){
  if(Object.keys(carrito).length===0) return;
  document.getElementById('modalVaciar').classList.add('show');
}
function cerrarVaciarModal(){ document.getElementById('modalVaciar').classList.remove('show'); }
function confirmarVaciar(){
  carrito={}; cantidades={};
  guardarCarrito();
  cerrarVaciarModal();
  renderCarrito();
}
function irAPagar(){ location.href='resumen.html'; }
</script>
</body>
</html>
