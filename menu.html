<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;padding-bottom:100px;max-width:500px;margin:0 auto}
.header-portada{position:relative;height:280px;overflow:hidden;background:#111}
.header-portada img.portada-img{width:100%;height:100%;object-fit:cover;filter:brightness(0.55)}
.header-portada::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 40%, rgba(15,15,15,0.97) 100%)}
.header-content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:20px}
.status-neon{position:absolute;top:14px;right:14px;background:rgba(0,0,0,0.6);border:1.5px solid #22c55e;color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;display:flex;align-items:center;gap:6px;box-shadow:0 0 12px #22c55e;animation:neonZoom 2s infinite ease-in-out;z-index:3}
@keyframes neonZoom{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.logo-circle{width:110px;height:110px;background:#5e0a28;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-circle img{width:100%;height:100%;object-fit:cover}
.nombre-rest{font-size:32px;font-weight:900;margin-top:12px}
.sub-rest{font-size:11px;letter-spacing:3px;color:#ddd;margin-top:4px;font-weight:700}
.categorias{display:flex;gap:10px;overflow-x:auto;padding:16px;background:#0f0f0f;position:sticky;top:0;z-index:10;scrollbar-width:none}
.categorias::-webkit-scrollbar{display:none}
.cat-btn{white-space:nowrap;padding:10px 18px;border-radius:25px;border:1.5px solid #2a2a2a;background:#1c1c1c;color:#fff;font-weight:700;font-size:13px;cursor:pointer;flex:0 0 auto}
.cat-btn.active{background:#fff;color:#111;border-color:#fff}
.productos{padding:12px;display:grid;gap:12px}
.product-card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:18px;display:flex;overflow:hidden;min-height:108px}
.product-img-box{width:110px;min-width:110px;height:110px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.product-img-box img{width:100%;height:100%;object-fit:cover}
.product-info{flex:1;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;position:relative;padding-right:115px}
.product-name{font-weight:700;font-size:14px}
.product-price{font-weight:800;font-size:16px}
.product-bottom{display:flex;align-items:center;margin-top:10px}
.bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:460px;background:#1e1e1e;border:1px solid #2a2a2a;display:flex;justify-content:space-around;align-items:center;padding:14px 8px;z-index:100;border-radius:28px}
.nav-item-rappi{display:flex;flex-direction:column;align-items:center;gap:4px;color:#777;font-size:9px;font-weight:800;background:none;border:none;cursor:pointer;min-width:64px;text-decoration:none}
.nav-item-rappi.active{color:#fff}
.nav-item-rappi i{font-size:20px}
.cart-badge{position:absolute;top:-2px;right:10px;background:#ff2e2e;color:#fff;font-size:9px;font-weight:900;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.nav-wrap{position:relative}
.action-right{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;z-index:5}
.btn-add{width:42px;height:42px;border-radius:50%;border:none;background:#5e0a28;color:#fff;font-weight:900;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-control{display:flex;align-items:center;justify-content:center;background:#2a2a2a;border-radius:24px;padding:4px;gap:8px;min-width:96px}
.qty-btn{width:32px;height:32px;border-radius:50%;border:none;background:#5e0a28;color:#fff;font-weight:900;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-num{width:22px;text-align:center;font-weight:800;font-size:14px}
.img-viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.img-viewer-overlay.show{display:flex}
.img-viewer-card{position:relative;max-width:90vw;max-height:85vh}
.img-viewer-card img{width:100%;max-height:80vh;object-fit:contain;border-radius:16px}
.btn-close-img{position:absolute;top:-10px;right:-10px;background:#fff;color:#111;width:36px;height:36px;border-radius:50%;border:none;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="header-portada"><img class="portada-img" id="portadaImg" src=""><div class="status-neon">● ABIERTO</div><div class="header-content"><div class="logo-circle"><img id="logoImg" src="" style="display:none"><div id="logoTxt">S</div></div><div class="nombre-rest" id="nombreRest">Santillos</div><div class="sub-rest">DOLORES HIDALGO - COMIDA RAPIDA</div></div></div>
<div class="categorias" id="categorias"></div>
<div class="productos" id="productos"></div>
<div class="img-viewer-overlay" id="imgViewer" onclick="cerrarViewer()"><div class="img-viewer-card" onclick="event.stopPropagation()"><button class="btn-close-img" onclick="cerrarViewer()"><i class="fa-solid fa-xmark"></i></button><img id="viewerImg" src=""></div></div>
<div class="bottom-nav"><a href="menu.html" class="nav-item-rappi active"><i class="fa-solid fa-house"></i>INICIO</a><div class="nav-wrap"><a href="carrito.html" class="nav-item-rappi"><i class="fa-solid fa-bag-shopping"></i>CARRITO</a><div class="cart-badge" id="cartCount">0</div></div></div>
<script>
// BASE NUEVA SANTILLOS-MENU
const firebaseConfig={
  apiKey:"AIzaSyCvnHeXuZZ-2IOF3Oas09VNYJK_HLLkau8",
  authDomain:"santillos-menu.firebaseapp.com",
  databaseURL:"https://santillos-menu-default-rtdb.firebaseio.com",
  projectId:"santillos-menu",
  storageBucket:"santillos-menu.firebasestorage.app",
  messagingSenderId:"913879229999",
  appId:"1:913879229999:web:bff40819ea0f91d040c8da"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

if(!localStorage.getItem('santillos_ubicacion_ok')){ window.location.href="index.html"; }

// limpiar cache viejo que estorbaba
localStorage.removeItem('santillos_cache_menu_v2');
localStorage.removeItem('santillos_cache_order_v2');

let menuData=null;
let categoryOrder=[];
let cacheConfig=null;
try{categoryOrder=JSON.parse(localStorage.getItem('santillos_cache_order_v3')||'[]')}catch(e){categoryOrder=[]}
try{cacheConfig=JSON.parse(localStorage.getItem('santillos_cache_config_v3')||'null')}catch(e){}
try{menuData=JSON.parse(localStorage.getItem('santillos_cache_data_v3')||'null')}catch(e){}

let categoriaActiva = categoryOrder[0] || null;

let cantidades = {};
let carrito = {};
try{ cantidades = JSON.parse(localStorage.getItem('santillos_cantidades_v3')||'{}'); }catch(e){ cantidades={}; }
try{ carrito = JSON.parse(localStorage.getItem('santillos_carrito_v3')||'{}'); }catch(e){ carrito={}; }

function actualizarBadge(){
  const total = Object.values(carrito).reduce((s,b)=>s+(b.cant||0),0);
  document.getElementById('cartCount').innerText = total;
}
actualizarBadge();

function aplicarConfig(c){
  if(!c)return;
  if(c.portada) document.getElementById('portadaImg').src=c.portada;
  if(c.logo&&c.logo.length>20){
    document.getElementById('logoImg').src=c.logo;
    document.getElementById('logoImg').style.display='block';
    document.getElementById('logoTxt').style.display='none';
  }
  if(c.nombre) document.getElementById('nombreRest').innerText=c.nombre;
}
if(cacheConfig) aplicarConfig(cacheConfig);

function renderCategorias(){
 const d=document.getElementById('categorias');
 if(!d||!categoryOrder||categoryOrder.length===0) return;
 if(!categoriaActiva) categoriaActiva=categoryOrder[0];
 d.innerHTML='';
 categoryOrder.forEach(c=>{
  if(menuData &&!menuData[c]) return;
  const b=document.createElement('button');
  b.className='cat-btn'+(c===categoriaActiva?' active':'');
  b.innerText=c;
  b.onclick=()=>{ categoriaActiva=c; renderCategorias(); renderProductos(); };
  d.appendChild(b);
 });
}

function renderProductos(){
 const cont=document.getElementById('productos');
 if(!cont||!menuData||!categoriaActiva) return;
 const lista=menuData[categoriaActiva]||[];
 let html='';
 lista.forEach((p)=>{
  if(p.disp===false) return;
  const id = p.idReal;
  const cant = cantidades[id]||0;
  const accion = cant===0
 ? `<button class="btn-add" data-action="add" data-id="${id}">+</button>`
  : `<div class="qty-control"><button class="qty-btn" data-action="sub" data-id="${id}">−</button><div class="qty-num">${cant}</div><button class="qty-btn" data-action="add" data-id="${id}">+</button></div>`;
  html+=`<div class="product-card"><div class="product-img-box" onclick="abrirViewer('${(p.img||'').replace(/'/g,'')}')"><img src="${p.img}" loading="lazy" onerror="this.style.display='none'"></div><div class="product-info"><div class="product-name">${p.name}</div><div class="product-bottom"><div class="product-price">$${p.price}</div></div><div class="action-right">${accion}</div></div></div>`;
 });
 cont.innerHTML=html || `<div style="text-align:center;padding:20px;color:#777">No hay productos en ${categoriaActiva}</div>`;
}
if(menuData && categoryOrder.length>0){ renderCategorias(); renderProductos(); }

function transformarProductosFirebase(data){
  let agrupado = {};
  let cats = new Set();
  Object.entries(data).forEach(([idReal, val])=>{
    const cat = (val.categoria || val.cat || 'Extras').trim();
    if(!agrupado[cat]) agrupado[cat]=[];
    agrupado[cat].push({
      idReal: idReal,
      name: val.nombre || val.name || 'Sin nombre',
      price: Number(val.precio || val.price || 0),
      img: val.imagen || val.img || val.image || '',
      disp: val.disponible!==false
    });
    cats.add(cat);
  });
  return { agrupado, cats: Array.from(cats) };
}

db.ref('config').once('value').then(s=>{
  if(s.val()){
    aplicarConfig(s.val());
    localStorage.setItem('santillos_cache_config_v3', JSON.stringify(s.val()));
  }
});

db.ref('productos').on('value', snap=>{
  if(!snap.exists()){
    document.getElementById('productos').innerHTML='<div style="text-align:center;padding:30px;color:#999">No hay productos en santillos-menu</div>';
    return;
  }
  const res = transformarProductosFirebase(snap.val());
  menuData = res.agrupado;

  let cats = res.cats;
  let ordenPreferido = ["Comidas","Bebidas","Postres","Promociones","Extras"];
  let ordenado = [];
  ordenPreferido.forEach(o=>{ if(cats.includes(o)) ordenado.push(o); });
  cats.forEach(c=>{ if(!ordenado.includes(c)) ordenado.push(c); });
  categoryOrder = ordenado;

  localStorage.setItem('santillos_cache_order_v3', JSON.stringify(categoryOrder));
  localStorage.setItem('santillos_cache_data_v3', JSON.stringify(menuData));

  if(!categoriaActiva ||!menuData[categoriaActiva]) categoriaActiva=categoryOrder[0];
  renderCategorias();
  renderProductos();
});

// CLICK CORREGIDO - AHORA SI SUMA
document.getElementById('productos').addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const idReal = btn.dataset.id;
  const delta = btn.dataset.action==='add'?1:-1;
  if(!idReal ||!menuData) return;

  let p = null;
  for(let cat in menuData){
    let found = menuData[cat].find(x=>x.idReal===idReal);
    if(found){ p=found; break; }
  }
  if(!p) return;

  let a = cantidades[idReal]||0;
  a+=delta;
  if(a<0) a=0;
  if(a>99) a=99;

  if(a===0){
    delete carrito[idReal];
    delete cantidades[idReal];
  } else {
    cantidades[idReal]=a;
    carrito[idReal]={nombre:p.name, precio:p.price, cant:a, idReal:p.idReal, img:p.img};
  }

  actualizarBadge();
  localStorage.setItem('santillos_carrito_v3',JSON.stringify(carrito));
  localStorage.setItem('santillos_cantidades_v3',JSON.stringify(cantidades));
  // para compatibilidad con tu carrito.html actual
  localStorage.setItem('santillos_carrito',JSON.stringify(carrito));
  localStorage.setItem('santillos_cantidades',JSON.stringify(cantidades));

  const card = btn.closest('.product-card');
  const actionDiv = card? card.querySelector('.action-right') : null;
  if(!actionDiv) return;
  if(a===0){
    actionDiv.innerHTML=`<button class="btn-add" data-action="add" data-id="${idReal}">+</button>`;
  }else{
    const num = actionDiv.querySelector('.qty-num');
    if(num){ num.innerText=a; }
    else{
      actionDiv.innerHTML=`<div class="qty-control"><button class="qty-btn" data-action="sub" data-id="${idReal}">−</button><div class="qty-num">${a}</div><button class="qty-btn" data-action="add" data-id="${idReal}">+</button></div>`;
    }
  }
});

function abrirViewer(src){ if(!src) return; document.getElementById('viewerImg').src=src; document.getElementById('imgViewer').classList.add('show'); }
function cerrarViewer(){ document.getElementById('imgViewer').classList.remove('show'); }
</script>
</body>
</html>
