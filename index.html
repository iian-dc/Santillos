};
let menuData=defaultMenu;
let categoriaActiva=Object.keys(menuData)[0];

let restauranteCoords={lat:21.1556,lng:-100.9348};

  abierto:true, whatsapp:'573242827963', nombre:'SANTILLOS',

<script>
function togglePass(id,btn){const inp=document.getElementById(id); if(inp.type==="password"){inp.type="text";btn.innerText="🙈"}else{inp.type="password";btn.innerText="👁️"}}
function showElegant(t,c){document.getElementById("elegantTitle").innerText=t;document.getElementById("elegantText").innerText=c;document.getElementById("elegantOverlay").classList.add("show")}
function cerrarElegant(){document.getElementById("elegantOverlay").classList.remove("show")}
function renderCategorias(){const d=document.getElementById("categories"); if(!d)return; d.innerHTML=""; Object.keys(menuData).forEach(c=>{const b=document.createElement("button"); b.className="cat-btn"+(c===categoriaActiva?" active":""); b.innerText=c; b.onclick=()=>{categoriaActiva=c; renderCategorias(); renderProductos();}; d.appendChild(b);});}
function renderProductos(){const d=document.getElementById("products"); if(!d)return; d.innerHTML=""; if(!menuData[categoriaActiva]){categoriaActiva=Object.keys(menuData)[0]; if(!categoriaActiva)return;} menuData[categoriaActiva].forEach((p,i)=>{if(p.disp===false)return; const id=categoriaActiva+"_"+i; if(cantidades[id]===undefined)cantidades[id]=0; d.innerHTML+=`<div class="product-card"><img class="product-img" id="img_${id}" src="${p.img}"><div class="product-info"><div class="product-name">${p.name}</div><div class="product-desc">${p.desc}</div><div class="product-bottom"><div class="product-price">$${p.price}</div><div class="qty-control"><button class="qty-btn" onclick="cambiarQty('${id}',-1,'${p.name}',${p.price},'${p.img}')">−</button><div class="qty-num" id="qty_${id}">${cantidades[id]}</div><button class="qty-btn" onclick="cambiarQtyWithAnim('${id}',1,'${p.name}',${p.price},'${p.img}')">+</button></div></div></div></div>`;});}
function animarAlCarrito(id){const img=document.getElementById("img_"+id); const cart=document.getElementById("cartCount"); if(!img||!cart)return; const r1=img.getBoundingClientRect(); const r2=cart.getBoundingClientRect(); const fly=img.cloneNode(); fly.className="fly-img"; fly.style.left=r1.left+"px"; fly.style.top=r1.top+"px"; document.body.appendChild(fly); setTimeout(()=>{fly.style.left=r2.left+"px"; fly.style.top=r2.top+"px"; fly.style.width="20px"; fly.style.height="20px"; fly.style.opacity="0.5";},30); setTimeout(()=>{fly.remove();},800);}
function cambiarQty(id,delta,nombre,precio,img){let a=cantidades[id]||0; a+=delta; if(a<0)a=0; cantidades[id]=a; const el=document.getElementById("qty_"+id); if(el)el.innerText=a; if(a===0)delete carrito[id]; else carrito[id]={nombre,precio,img,cant:a}; actualizarBadge(); renderCart(); actualizarResumenFinal();}
function cambiarQtyWithAnim(id,delta,nombre,precio,img){animarAlCarrito(id); cambiarQty(id,delta,nombre,precio,img);}
function actualizarBadge(){document.getElementById("cartCount").innerText=Object.values(carrito).reduce((a,b)=>a+b.cant,0);}
function aplicarConfig(){const logo=document.getElementById("logoImg"); if(logo)logo.src=config.logo; const bg=document.getElementById("headerBg"); if(bg)bg.style.backgroundImage=`url('${config.portada}')`; const rn=document.getElementById("restNameDisplay"); if(rn)rn.innerHTML=config.nombre; document.documentElement.style.setProperty('--theme',config.color);}
function handleImg(input){const file=input.files[0]; if(!file)return; const r=new FileReader(); r.onload=function(e){tempProdImg=e.target.result; document.getElementById("prevProd").src=tempProdImg; document.getElementById("prevProd").style.display="block";}; r.readAsDataURL(file);}
</script>
<!-- FIN PARTE 4 -->

<script>
function calcularPrecioEnvio(km){if(km<=0)return 0; const base=parseFloat(config.envioBase)||35; const porKm=parseFloat(config.envioKm)||5; const bloque=parseFloat(config.envioBloque)||0.75; if(km<=1)return base; let extra=km-1; let bloques=Math.ceil(extra/bloque); return base+(bloques*porKm);}
function renderCart(){const list=document.getElementById("cartList"); if(!list)return; const ids=Object.keys(carrito); if(ids.length===0){list.innerHTML='<div style="text-align:center;padding:20px;color:#777">Carrito vacío</div>';}else{list.innerHTML=""; ids.forEach(id=>{const it=carrito[id]; list.innerHTML+=`<div style="display:flex;gap:8px;align-items:center;background:#fff;padding:8px;border-radius:10px;margin-bottom:6px"><img src="${it.img}" style="width:40px;height:40px;border-radius:8px;object-fit:cover"><div style="flex:1"><div style="font-weight:800;font-size:13px">${it.nombre} x${it.cant}</div><div style="font-size:11px">$${it.precio*it.cant}</div></div><button onclick="eliminar('${id}')" style="border:none;background:#111;color:#fff;padding:6px 8px;border-radius:8px">🗑️</button></div>`;});} actualizarResumenFinal();}
function eliminar(id){delete carrito[id]; cantidades[id]=0; const el=document.getElementById("qty_"+id); if(el)el.innerText=0; actualizarBadge(); renderCart();}
function actualizarResumenFinal(){let sub=Object.values(carrito).reduce((a,b)=>a+b.precio*b.cant,0); let tot=sub+envioActual; const d=document.getElementById("resumenFinal"); if(d)d.innerHTML=`Subtotal: $${sub}<br>Envío: $${envioActual.toFixed(0)} (${distanciaKm.toFixed(2)} km)<br><b>Total: $${tot}</b>`;}
function actualizarInfoMapa(){const d=document.getElementById("infoMapa"); if(d)d.innerText=`Distancia: ${distanciaKm.toFixed(2)} km - Envío: $${envioActual.toFixed(0)}`;}
function initMap(){if(mapa){setTimeout(()=>{mapa.invalidateSize();},200); return;} mapa=L.map('map',{zoomControl:false}).setView([restauranteCoords.lat,restauranteCoords.lng],14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa); markerRest=L.marker([restauranteCoords.lat,restauranteCoords.lng]).addTo(mapa);}
function trazarRutaReal(cLat,cLng){const url=`https://router.project-osrm.org/route/v1/driving/${restauranteCoords.lng},${restauranteCoords.lat};${cLng},${cLat}?overview=full&geometries=geojson`; fetch(url).then(r=>r.json()).then(data=>{if(data.routes&&data.routes.length>0){const ruta=data.routes[0]; distanciaKm=ruta.distance/1000; envioActual=calcularPrecioEnvio(distanciaKm); if(routeLayer)mapa.removeLayer(routeLayer); if(markerCliente)mapa.removeLayer(markerCliente); markerCliente=L.marker([cLat,cLng]).addTo(mapa); const coords=ruta.geometry.coordinates.map(c=>[c[1],c[0]]); routeLayer=L.polyline(coords,{color:'#ff0000',weight:6,opacity:0.9}).addTo(mapa); mapa.fitBounds(routeLayer.getBounds(),{padding:[50,50]}); actualizarInfoMapa(); actualizarResumenFinal();}});}
function buscarDireccion(){const dir=document.getElementById("cliDir").value.trim(); if(dir.length<6)return; clearTimeout(debounceTimer); debounceTimer=setTimeout(()=>{fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dir)}&limit=1`).then(r=>r.json()).then(d=>{if(d.length>0){trazarRutaReal(parseFloat(d[0].lat),parseFloat(d[0].lon));}});},900);}
function abrirCarrito(){document.getElementById("cartModal").classList.add("show"); renderCart();}
function cerrarCarrito(){document.getElementById("cartModal").classList.remove("show");}
function abrirCheckout(){if(Object.keys(carrito).length===0){showElegant("Carrito vacío","Agrega productos"); return;} cerrarCarrito(); document.getElementById("checkoutModal").classList.add("show"); setTimeout(()=>{initMap();},300);}
function cerrarCheckout(){document.getElementById("checkoutModal").classList.remove("show");}
function enviarPedido(){const nombre=document.getElementById("cliNombre").value; const tel=document.getElementById("cliTel").value; const dir=document.getElementById("cliDir").value; let sub=Object.values(carrito).reduce((a,b)=>a+b.precio*b.cant,0); let tot=sub+envioActual; let texto=`*PEDIDO SANTILLOS*%0ACliente: ${nombre}%0ATel: ${tel}%0ADir: ${dir}%0A`; Object.values(carrito).forEach(p=>{texto+=`${p.nombre} x${p.cant} - $${p.precio*p.cant}%0A`}); texto+=`Envío: $${envioActual} (${distanciaKm.toFixed(2)}km)%0ATotal: $${tot}`; window.open(`https://wa.me/${config.whatsapp}?text=${texto}`,'_blank');}
</script>

<script>
function switchTab(t){document.querySelectorAll('.admin-tab').forEach(e=>e.classList.remove('active')); const tab=document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)); if(tab)tab.classList.add('active'); document.getElementById('adminProductos').style.display=t==='prod'?'block':'none'; document.getElementById('adminAjustes').style.display=t==='ajust'?'block':'none'; document.getElementById('adminPedidos').style.display=t==='ped'?'block':'none';}
function cerrarAdmin(){document.getElementById("adminModal").classList.remove("show");}
function cerrarSesion(){isLogged=false; cerrarAdmin();}
function cerrarLogin(){document.getElementById("loginOverlay").classList.remove("show");}
function hacerLogin(){const u=document.getElementById("loginUser").value.trim(); const p=document.getElementById("loginPass").value.trim(); if(u===adminCred.user&&p===adminCred.pass){isLogged=true; document.getElementById("loginOverlay").classList.remove("show"); document.getElementById("adminModal").classList.add("show"); cargarAdmin();}else{showElegant("Error","Usuario o pass mal");}}
function cargarAdmin(){const sel=document.getElementById("catSelect"); if(sel){sel.innerHTML='<option value="">-- Categorías --</option>'; Object.keys(menuData).forEach(c=>{sel.innerHTML+=`<option value="${c}">${c}</option>`});} renderListaAdmin(); const w=document.getElementById("ajWhatsapp"); if(w)w.value=config.whatsapp; const n=document.getElementById("ajNombre"); if(n)n.value=config.nombre; const d=document.getElementById("ajDirRest"); if(d)d.value=config.direccionRest; const eb=document.getElementById("ajEnvioBase"); if(eb)eb.value=config.envioBase; const ek=document.getElementById("ajEnvioKm"); if(ek)ek.value=config.envioKm; const ca=document.getElementById("coordsActual"); if(ca)ca.innerText=restauranteCoords.lat.toFixed(5)+", "+restauranteCoords.lng.toFixed(5);}
function renderListaAdmin(){const div=document.getElementById("listaProductosAdmin"); if(!div)return; div.innerHTML=""; Object.keys(menuData).forEach(cat=>{div.innerHTML+=`<div style="font-weight:900;font-size:12px;margin:14px 0 6px">${cat.toUpperCase()}</div>`; menuData[cat].forEach((p,idx)=>{div.innerHTML+=`<div class="product-admin-item"><img src="${p.img}"><div style="flex:1"><div style="font-weight:800;font-size:13px">${p.name}</div><div style="font-size:11px">$${p.price}</div></div><button onclick="borrarProd('${cat}',${idx})" style="background:#111;color:#fff;border:none;padding:6px 8px;border-radius:8px">🗑️</button></div>`;});});}
function guardarProducto(){const cat=document.getElementById("prodCat").value.trim(); const name=document.getElementById("prodName").value.trim(); const desc=document.getElementById("prodDesc").value.trim(); const price=parseFloat(document.getElementById("prodPrice").value); let imgFinal=tempProdImg; if(!cat||!name||!price||!imgFinal){showElegant("Faltan datos","Completa todo"); return;} if(!menuData[cat])menuData[cat]=[]; menuData[cat].push({name,desc,price,img:imgFinal,disp:true}); db.ref('menu').set(menuData); limpiarFormProd(); showElegant("Guardado","En santillos-1ac6d");}
function borrarProd(cat,idx){if(!confirm("¿Borrar?"))return; menuData[cat].splice(idx,1); if(menuData[cat].length===0)delete menuData[cat]; db.ref('menu').set(menuData);}
function limpiarFormProd(){document.getElementById("prodCat").value=""; document.getElementById("prodName").value=""; document.getElementById("prodDesc").value=""; document.getElementById("prodPrice").value=""; tempProdImg=""; const f=document.getElementById("fileProd"); if(f)f.value=""; const pr=document.getElementById("prevProd"); if(pr)pr.style.display="none";}
function guardarAjustes(){config.whatsapp=document.getElementById("ajWhatsapp").value.trim()||config.whatsapp; config.nombre=document.getElementById("ajNombre").value.trim()||config.nombre; config.direccionRest=document.getElementById("ajDirRest").value.trim()||config.direccionRest; config.envioBase=parseFloat(document.getElementById("ajEnvioBase").value)||config.envioBase; config.envioKm=parseFloat(document.getElementById("ajEnvioKm").value)||config.envioKm; db.ref('config').set(config); showElegant("Guardado","Ajustes en la nube");}
function actualizarDirRest(){const dir=document.getElementById("ajDirRest").value.trim(); if(dir.length<6){showElegant("Falta dir","Escribe dir completa"); return;} fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dir)}&limit=1`).then(r=>r.json()).then(d=>{if(d.length>0){restauranteCoords={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)}; db.ref('coords').set(restauranteCoords); document.getElementById("coordsActual").innerText=restauranteCoords.lat.toFixed(5)+", "+restauranteCoords.lng.toFixed(5); showElegant("OK","Ubicación actualizada");}});}

// INICIO FIX - carga datos SANTILLOS-1AC6D
db.ref('menu').on('value',snap=>{
  if(snap.val()){ menuData=snap.val(); }
  else{ menuData=defaultMenu; db.ref('menu').set(menuData); }
  categoriaActiva=Object.keys(menuData)[0];
  renderCategorias();
  renderProductos();
  renderListaAdmin();
});
db.ref('config').on('value',snap=>{ if(snap.val()) config=snap.val(); aplicarConfig(); });
db.ref('coords').on('value',snap=>{ if(snap.val()) restauranteCoords=snap.val(); });
db.ref('admin').on('value',snap=>{ if(snap.val()) adminCred=snap.val(); });

document.getElementById("restNameDisplay").addEventListener("dblclick",()=>{document.getElementById("loginOverlay").classList.add("show");});

// Render inicial para que no quede blanco
renderCategorias();
renderProductos();
aplicarConfig();
</script>
</body>
