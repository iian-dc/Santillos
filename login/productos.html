<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos - Santillos Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;max-width:900px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222;margin-bottom:16px;position:sticky;top:0;background:#0f0f0f;z-index:10}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#5e0a28;color:#fff}
.btn-dark{background:#1c1c1c;color:#fff;border:1px solid #333}
.btn-sm{padding:6px 10px;font-size:12px}
.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;padding:16px;margin-bottom:16px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:6px 0}
label{font-size:11px;color:#aaa;font-weight:700;margin-top:10px;display:block;letter-spacing:0.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{width:100%;height:160px;background:#111;border-radius:12px;margin:8px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px dashed #333}
.preview img{width:100%;height:100%;object-fit:cover}
.progress{height:6px;background:#222;border-radius:10px;overflow:hidden;margin:8px 0;display:none}
.progress-bar{height:100%;background:#5e0a28;width:0%;transition:width 0.3s}
.status{font-size:11px;margin:4px 0}
.categoria-bloque{margin-bottom:24px;border:1px solid #222;border-radius:16px;overflow:hidden}
.cat-head{display:flex;align-items:center;justify-content:space-between;background:#1a1a1a;padding:12px 16px;border-bottom:1px solid #222}
.cat-head h3{color:#fff;font-size:16px}
.product-row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #1a1a1a;background:#111}
.product-row:last-child{border:none}
.product-row img.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#222;flex-shrink:0}
.prod-fields{flex:1;display:grid;gap:6px}
.prod-fields input{margin:0;padding:8px;font-size:13px}
.prod-actions{display:flex;flex-direction:column;gap:6px}
.badge{font-size:10px;background:#222;padding:3px 8px;border-radius:20px;color:#aaa}
.badge-link{color:#22c55e;word-break:break-all;font-size:9px}
</style>
</head>
<body>

<div class="header">
  <div>
    <h2 style="font-size:20px">Santillos - Productos</h2>
    <div style="font-size:11px;color:#777">Ruta: login/productos.html • Edición en tiempo real</div>
  </div>
  <button class="btn btn-dark" onclick="location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> Panel</button>
</div>

<div class="card">
  <h3 style="margin-bottom:8px">Crear nuevo producto</h3>
  <div class="grid2">
    <div>
      <label>Categoría</label>
      <div style="display:flex;gap:6px">
        <select id="catSelect" style="flex:1"></select>
        <button class="btn btn-dark btn-sm" onclick="nuevaCategoria()">+ Nueva</button>
      </div>
    </div>
    <div>
      <label>Precio</label>
      <input id="prodPrice" type="number" placeholder="180">
    </div>
  </div>
  <label>Nombre</label>
  <input id="prodName" placeholder="Ej: Combo Triple">
  <label>Foto (elige desde tu celular - se sube con link)</label>
  <input type="file" id="fileInput" accept="image/*">
  <div class="progress" id="progressBox"><div class="progress-bar" id="progressBar"></div></div>
  <div class="status" id="status"></div>
  <div class="preview" id="preview"><span style="color:#555">Preview</span></div>
  <input type="hidden" id="prodImgUrl">
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn btn-primary" style="flex:1" id="btnGuardar" onclick="guardarNuevo()"><i class="fa-solid fa-plus"></i> Guardar</button>
    <button class="btn btn-dark" style="display:none" id="btnCancelar" onclick="resetForm()">Cancelar</button>
  </div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3>Todos los productos en Firebase</h3>
    <div class="badge" id="totalCount">0 productos</div>
  </div>
  <div id="contenedorProductos"></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA",authDomain:"santillos-1ac6d.firebaseapp.com",databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com",projectId:"santillos-1ac6d",storageBucket:"santillos-1ac6d.firebasestorage.app",messagingSenderId:"285600299102",appId:"1:285600299102:web:9590597c2b3d8888821ccf"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const storage=firebase.storage();

let categoryOrder=[]; let menuData={}; let editMode=null;

db.ref('categoryOrder').on('value', s=>{
  categoryOrder=s.val()||[];
  renderCatSelect();
  renderLista();
});
db.ref('menu').on('value', s=>{
  menuData=s.val()||{};
  if(categoryOrder.length===0 && Object.keys(menuData).length>0){
    categoryOrder=Object.keys(menuData);
  }
  renderCatSelect();
  renderLista();
});

function renderCatSelect(){
  const sel=document.getElementById('catSelect');
  const current=sel.value;
  sel.innerHTML='';
  categoryOrder.forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);
  });
  if(current) sel.value=current;
  if(categoryOrder.length===0){
    const o=document.createElement('option'); o.textContent='Crea una categoría'; sel.appendChild(o);
  }
}
function nuevaCategoria(){
  const n=prompt('Nombre categoría:'); if(!n) return;
  if(!categoryOrder.includes(n)){
    categoryOrder.push(n);
    db.ref('categoryOrder').set(categoryOrder);
  }
}

// SUBIR FOTO A STORAGE Y OBTENER LINK
let uploadedFileUrl='';
document.getElementById('fileInput').addEventListener('change', async function(e){
  const file=e.target.files[0]; if(!file) return;
  const cat=document.getElementById('catSelect').value || 'general';
  const status=document.getElementById('status');
  const pBox=document.getElementById('progressBox');
  const pBar=document.getElementById('progressBar');
  pBox.style.display='block'; status.style.color='#fff'; status.innerText='Subiendo a Firebase Storage...';
  try{
    const safeName=file.name.replace(/[^a-zA-Z0-9.]/g,'_');
    const ref=storage.ref().child(`productos/${cat}/${Date.now()}_${safeName}`);
    const task=ref.put(file);
    task.on('state_changed', snap=>{
      const pct=Math.round((snap.bytesTransferred/snap.totalBytes)*100);
      pBar.style.width=pct+'%'; status.innerText=`Subiendo ${pct}%`;
    }, err=>{
      status.innerText='Error: '+err.message; status.style.color='#ff5a5a';
    }, async ()=>{
      const url=await task.snapshot.ref.getDownloadURL();
      uploadedFileUrl=url;
      document.getElementById('prodImgUrl').value=url;
      document.getElementById('preview').innerHTML=`<img src="${url}">`;
      status.innerText='✅ Listo - Link: '+url.substring(0,40)+'...'; status.style.color='#22c55e';
      pBox.style.display='none';
    });
    // preview local
    const reader=new FileReader();
    reader.onload=ev=>{ document.getElementById('preview').innerHTML=`<img src="${ev.target.result}" style="opacity:0.6">`; }
    reader.readAsDataURL(file);
  }catch(err){ status.innerText='Error '+err.message; }
});

function guardarNuevo(){
  const cat=document.getElementById('catSelect').value;
  const name=document.getElementById('prodName').value.trim();
  const price=parseInt(document.getElementById('prodPrice').value);
  const img=document.getElementById('prodImgUrl').value;
  if(!cat||!name||!price){ alert('Falta categoría, nombre o precio'); return; }
  if(!img){ alert('Sube una foto primero'); return; }
  const lista=menuData[cat]||[];
  const idx=lista.length;
  db.ref(`menu/${cat}/${idx}`).set({name, price, img, disp:true}).then(()=>{
    alert('Producto guardado con link'); resetForm();
  });
}
function resetForm(){
  document.getElementById('prodName').value=''; document.getElementById('prodPrice').value='';
  document.getElementById('fileInput').value=''; document.getElementById('prodImgUrl').value='';
  document.getElementById('preview').innerHTML='<span style="color:#555">Preview</span>';
  document.getElementById('status').innerText=''; document.getElementById('progressBox').style.display='none';
  editMode=null;
}

// LISTA EDITABLE EN TIEMPO REAL
function renderLista(){
  const cont=document.getElementById('contenedorProductos');
  let total=0; Object.values(menuData).forEach(a=> total+= (a||[]).filter(Boolean).length );
  document.getElementById('totalCount').innerText=total+' productos';
  let html='';
  if(categoryOrder.length===0){ cont.innerHTML='<div style="color:#777;text-align:center;padding:20px">No hay categorías</div>'; return; }
  categoryOrder.forEach(cat=>{
    const lista=menuData[cat]||[];
    const filtrada=lista.map((p,i)=>({p,i})).filter(x=>x.p);
    if(filtrada.length===0) return;
    html+=`<div class="categoria-bloque"><div class="cat-head"><h3>${cat}</h3><div style="display:flex;gap:6px"><button class="btn btn-dark btn-sm" onclick="renombrarCat('${cat}')"><i class="fa-solid fa-pen"></i></button><button class="btn btn-dark btn-sm" style="color:#ff5a5a" onclick="borrarCat('${cat}')"><i class="fa-solid fa-trash"></i></button></div></div>`;
    filtrada.forEach(({p,i})=>{
      html+=`<div class="product-row" id="row-${cat}-${i}">
        <img class="thumb" src="${p.img}" onerror="this.src='https://via.placeholder.com/64'">
        <div class="prod-fields">
          <input id="name-${cat}-${i}" value="${(p.name||'').replace(/"/g,'&quot;')}" placeholder="Nombre" onblur="guardarEdicion('${cat}',${i})">
          <div style="display:flex;gap:6px">
            <input id="price-${cat}-${i}" type="number" value="${p.price||0}" style="flex:1" onblur="guardarEdicion('${cat}',${i})">
            <label style="flex:1;margin:0"><input type="file" accept="image/*" style="display:none" onchange="cambiarFoto('${cat}',${i}, this)"><span class="btn btn-dark btn-sm" style="display:flex;width:100%;justify-content:center"><i class="fa-solid fa-image"></i> Cambiar foto</span></label>
          </div>
          <div class="badge-link">${p.img? p.img.substring(0,60)+'...' : 'sin link'}</div>
        </div>
        <div class="prod-actions">
          <button class="btn btn-dark btn-sm" onclick="toggleDisp('${cat}',${i})">${p.disp===false?'👁️‍🗨️':'👁️'}</button>
          <button class="btn btn-dark btn-sm" style="color:#ff5a5a" onclick="eliminarProd('${cat}',${i})"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  cont.innerHTML=html||'<div style="color:#777;text-align:center;padding:20px">No hay productos</div>';
}

function guardarEdicion(cat,i){
  const nameEl=document.getElementById(`name-${cat}-${i}`);
  const priceEl=document.getElementById(`price-${cat}-${i}`);
  if(!nameEl||!priceEl) return;
  const p=menuData[cat][i]; if(!p) return;
  const newName=nameEl.value.trim(); const newPrice=parseInt(priceEl.value);
  if(newName!==p.name || newPrice!==p.price){
    db.ref(`menu/${cat}/${i}`).update({name:newName, price:newPrice});
  }
}
async function cambiarFoto(cat,i, input){
  const file=input.files[0]; if(!file) return;
  const row=document.getElementById(`row-${cat}-${i}`);
  if(row) row.style.opacity='0.5';
  try{
    const ref=storage.ref().child(`productos/${cat}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`);
    const task=await ref.put(file);
    const url=await task.ref.getDownloadURL();
    await db.ref(`menu/${cat}/${i}`).update({img:url});
    if(row) row.style.opacity='1';
  }catch(e){ alert('Error subiendo: '+e.message); if(row) row.style.opacity='1'; }
}
function toggleDisp(cat,i){
  const p=menuData[cat][i]; if(!p) return;
  db.ref(`menu/${cat}/${i}`).update({disp: p.disp===false? true:false});
}
function eliminarProd(cat,i){
  if(!confirm('¿Eliminar este producto?')) return;
  db.ref(`menu/${cat}/${i}`).remove().then(()=>{
    db.ref(`menu/${cat}`).once('value').then(s=>{
      const val=s.val()||[]; const filtered=val.filter(Boolean);
      db.ref(`menu/${cat}`).set(filtered);
    });
  });
}
function renombrarCat(oldName){
  const nuevo=prompt('Nuevo nombre:', oldName); if(!nuevo||nuevo===oldName) return;
  db.ref(`menu/${oldName}`).once('value').then(s=>{
    const data=s.val();
    if(data){ db.ref(`menu/${nuevo}`).set(data).then(()=>{ db.ref(`menu/${oldName}`).remove(); }); }
  });
  const idx=categoryOrder.indexOf(oldName);
  if(idx>=0){ categoryOrder[idx]=nuevo; db.ref('categoryOrder').set(categoryOrder); }
}
function borrarCat(cat){
  if(!confirm(`¿Borrar categoría completa ${cat} y sus productos?`)) return;
  db.ref(`menu/${cat}`).remove();
  categoryOrder=categoryOrder.filter(c=>c!==cat);
  db.ref('categoryOrder').set(categoryOrder);
}
</script>
</body>
</html>
