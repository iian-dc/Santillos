<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido Confirmado - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;max-width:500px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;font-weight:800;margin-bottom:16px}
.card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:18px;padding:16px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid #2a2a2a;padding-bottom:10px}
.client-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;background:#1a2f1a;color:#22c55e;border:1px solid #22c55e}
.badge.preparando{background:#2a2a1a;color:#eab308;border-color:#eab308}
.badge.camino{background:#1a2535;color:#3b82f6;border-color:#3b82f6}
.badge.entregado{background:#1a2f1a;color:#22c55e;border-color:#22c55e}
.row{display:flex;justify-content:space-between;margin:6px 0;font-size:13px}
.row span:first-child{color:#999}
.row.total span{font-weight:800;font-size:15px;color:#fff}
.row.total span:last-child{font-size:16px}
.envio-free{color:#22c55e!important;font-weight:800}
.direccion{margin-top:10px;font-size:12px;color:#aaa;display:flex;gap:6px;align-items:flex-start}
.direccion i{color:#22c55e;margin-top:2px}
.productos{margin-top:12px;border-top:1px solid #2a2a2a;padding-top:10px}
.prod{font-size:11px;color:#ccc;margin:3px 0;display:flex;justify-content:space-between}

.timeline-title{font-size:14px;font-weight:800;margin-bottom:14px}
.step{display:flex;gap:12px;margin-bottom:18px;opacity:0.4;transition:all 0.3s}
.step.active{opacity:1}
.step-icon{width:42px;height:42px;border-radius:50%;background:#2a2a2a;border:1px solid #3a3a3a;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all 0.3s}
.step.active .step-icon{background:#22c55e;color:#fff;border-color:#22c55e;box-shadow:0 0 15px rgba(34,197,94,0.4)}
.step-info b{font-size:13px;display:block}
.step-info span{font-size:11px;color:#888}

.btns{display:flex;gap:12px;margin-top:16px}
.btn{flex:1;padding:14px;border-radius:16px;border:none;font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn-gray{background:#2a2a2a;color:#fff;border:1px solid #333}
.btn-purple{background:#5e0a28;color:#fff}
</style>
</head>
<body>
<h1>Seguimiento de tu pedido</h1>

<div class="card" id="cardResumen">
  <div class="card-head">
    <div class="client-name" id="nombreCliente">#Cargando...</div>
    <div class="badge" id="badgeEstado">PENDIENTE</div>
  </div>
  <div class="row"><span>Subtotal</span><span id="subtotal">--</span></div>
  <div class="row"><span>Envío</span><span id="envio" class="envio-free">--</span></div>
  <div class="row total"><span>Total</span><span id="total">--</span></div>
  <div class="direccion"><i class="fa-solid fa-location-dot"></i><span id="direccionTxt">--</span></div>
  <div class="productos" id="listaProductos"></div>
</div>

<div class="card">
  <div class="timeline-title">Estado en tiempo real</div>
  
  <div class="step active" id="stepRecibido">
    <div class="step-icon"><i class="fa-solid fa-file-lines"></i></div>
    <div class="step-info"><b>Pedido Recibido</b><span>Hemos recibido tu orden</span></div>
  </div>
  <div class="step" id="stepPreparando">
    <div class="step-icon"><i class="fa-solid fa-fire-burner"></i></div>
    <div class="step-info"><b>Preparando</b><span>La cocina está preparando tu pedido</span></div>
  </div>
  <div class="step" id="stepCamino">
    <div class="step-icon"><i class="fa-solid fa-motorcycle"></i></div>
    <div class="step-info"><b>En camino</b><span>Tu pedido va hacia ti</span></div>
  </div>
  <div class="step" id="stepEntregado">
    <div class="step-icon"><i class="fa-solid fa-house"></i></div>
    <div class="step-info"><b>Entregado</b><span>¡Disfruta tu pedido!</span></div>
  </div>
</div>

<div class="btns">
  <a href="menu.html" class="btn btn-gray"><i class="fa-solid fa-rotate"></i> Nuevo pedido</a>
  <a href="tel:+5210000000000" class="btn btn-purple"><i class="fa-solid fa-phone"></i> Llamar restaurante</a>
</div>

<script>
const firebaseConfigPedidos={
  apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA",
  authDomain:"santillos-1ac6d.firebaseapp.com",
  databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com",
  projectId:"santillos-1ac6d",
  storageBucket:"santillos-1ac6d.firebasestorage.app",
  messagingSenderId:"285600299102",
  appId:"1:285600299102:web:9590597c2b3d8888821ccf"
};
firebase.initializeApp(firebaseConfigPedidos);
const db=firebase.database();

// Obtener ID del pedido
let pedidoId = localStorage.getItem('santillos_ultimo_pedido_id');
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('id')) pedidoId = urlParams.get('id');

let pedidoLocal = null;
try{ pedidoLocal = JSON.parse(localStorage.getItem('santillos_ultimo_pedido')||'null'); }catch(e){}

function pintarPedido(data){
  if(!data) return;
  document.getElementById('nombreCliente').innerText = '#'+(data.cliente?.nombre || 'CLIENTE').toUpperCase();
  document.getElementById('subtotal').innerText = '$'+(data.subtotal||0);
  document.getElementById('total').innerText = '$'+(data.total||0);
  
  if(Number(data.envio||0)===0){
    document.getElementById('envio').innerText='GRATIS';
    document.getElementById('envio').className='envio-free';
  }else{
    document.getElementById('envio').innerText='$'+data.envio;
    document.getElementById('envio').className='';
  }
  
  document.getElementById('direccionTxt').innerText = (data.cliente?.direccion||'') + (data.cliente?.referencia ? ' - '+data.cliente.referencia : '');
  
  // Productos
  let html='';
  if(data.productos){
    Object.values(data.productos).forEach(p=>{
      html+=`<div class="prod"><span>${p.nombre} x${p.cant}</span><span>$${Number(p.precio||0)*Number(p.cant||0)}</span></div>`;
    });
  }
  document.getElementById('listaProductos').innerHTML=html;
  
  actualizarEstado(data.estado||'nuevo');
}

function actualizarEstado(estado){
  const badge=document.getElementById('badgeEstado');
  estado=(estado||'nuevo').toLowerCase();
  
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('stepRecibido').classList.add('active');
  badge.innerText='PENDIENTE';
  badge.className='badge';

  if(estado==='nuevo' || estado==='pendiente' || estado==='recibido'){
    badge.innerText='PENDIENTE';
  }
  if(estado==='preparando'){
    document.getElementById('stepPreparando').classList.add('active');
    badge.innerText='PREPARANDO'; badge.className='badge preparando';
  }
  if(estado==='en_camino' || estado==='camino' || estado==='en camino'){
    document.getElementById('stepPreparando').classList.add('active');
    document.getElementById('stepCamino').classList.add('active');
    badge.innerText='EN CAMINO'; badge.className='badge camino';
  }
  if(estado==='entregado'){
    document.getElementById('stepPreparando').classList.add('active');
    document.getElementById('stepCamino').classList.add('active');
    document.getElementById('stepEntregado').classList.add('active');
    badge.innerText='ENTREGADO'; badge.className='badge entregado';
  }
}

if(pedidoId){
  // Tiempo real con admin
  db.ref('pedidos/'+pedidoId).on('value', snap=>{
    if(snap.exists()){
      pintarPedido(snap.val());
    } else if(pedidoLocal){
      pintarPedido(pedidoLocal);
    }
  });
} else if(pedidoLocal){
  pintarPedido(pedidoLocal);
} else {
  document.getElementById('nombreCliente').innerText='#CLIENTE';
}
</script>
</body>
</html>
