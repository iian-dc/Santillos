<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carrito - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;padding-bottom:110px;max-width:500px;margin:0 auto;min-height:100vh}
.header-cart{padding:18px 16px;display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;position:sticky;top:0;z-index:10;border-bottom:1px solid #1e1e1e}
.header-cart h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.header-cart a{color:#fff;text-decoration:none;width:36px;height:36px;background:#1c1c1c;border-radius:50%;display:flex;align-items:center;justify-content:center}
.titulo-seccion{padding:16px 16px 8px;font-size:13px;font-weight:700;color:#999;letter-spacing:0.5px}
.lista-carrito{padding:0 12px;display:grid;gap:8px}
.cart-item{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;display:flex;overflow:hidden;padding:8px;gap:10px;align-items:center;min-height:76px}
.cart-img{width:62px;min-width:62px;height:62px;border-radius:12px;overflow:hidden;background:#111}
.cart-img img{width:100%;height:100%;object-fit:cover}
.cart-info{flex:1;display:flex;flex-direction:column;gap:2px}
.cart-name{font-weight:700;font-size:13px;line-height:1.2}
.cart-desc{font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.cart-price{font-weight:800;font-size:13px;margin-top:2px}
.cart-actions{display:flex;flex-direction:column;gap:6px}
.btn-icon{width:34px;height:34px;border-radius:10px;border:1.5px solid #2a2a2a;background:#232323;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.btn-icon.delete{color:#ff5a5a}
.resumen{margin:12px 12px;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;padding:14px 16px;display:grid;gap:0}
.resumen-row.total{font-size:16px;font-weight:800;color:#fff;display:flex;justify-content:space-between}
.btn-pago{margin:14px 12px;width:calc(100% - 24px);background:#5e0a28;color:#fff;border:none;border-radius:24px;padding:16px;font-weight:800;font-size:15px;cursor:pointer}
.vacio{padding:60px 20px;text-align:center;color:#777}
.vacio i{font-size:48px;margin-bottom:16px;display:block}
.vacio a{color:#fff;background:#5e0a28;padding:10px 18px;border-radius:20px;text-decoration:none;font-weight:700;display:inline-block;margin-top:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-card{background:#1c1c1c;border:1px solid #2a2a2a;width:100%;max-width:360px;border-radius:24px;padding:20px;position:relative;animation:pop 0.25s ease}
@keyframes pop{0%{transform:scale(0.9);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:#2a2a2a;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-img{width:140px;height:140px;border-radius:20px;overflow:hidden;margin:10px auto 16px;background:#111}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-name{text-align:center;font-weight:800;font-size:18px}
.modal-price{text-align:center;color:#aaa;font-size:13px;margin-top:4px;margin-bottom:18px}
.qty-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0 20px}
.qty-row span{font-size:13px;font-weight:700;color:#bbb}
.qty-control-modal{display:flex;align-items:center;gap:10px;background:#232323;border-radius:22px;padding:4px}
.qty-btn-modal{width:36px;height:36px;border-radius:50%;border:none;background:#5e0a28;color:#fff;font-weight:900;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-num-modal{width:28px;text-align:center;font-weight:800;font-size:16px}
.modal-btns{display:flex;gap:10px}
.btn-cancel{flex:1;background:transparent;border:1.5px solid #3a3a3a;color:#fff;border-radius:22px;padding:12px;font-weight:700;cursor:pointer}
.btn-save{flex:1;background:#5e0a28;border:none;color:#fff;border-radius:22px;padding:12px;font-weight:800;cursor:pointer}
.bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:460px;background:#1e1e1e;border:1px solid #2a2a2a;display:flex;justify-content:space-around;align-items:center;padding:10px 8px;z-index:100;border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.nav-item-rappi{display:flex;flex-direction:column;align-items:center;gap:4px;color:#777;font-size:9px;font-weight:800;background:none;border:none;cursor:pointer;min-width:64px;text-decoration:none}
.nav-item-rappi.active{color:#fff}
.nav-item-rappi i{font-size:18px}
.nav-center-rappi{display:flex;flex-direction:column;align-items:center;text-decoration:none}
.nav-center-circle{width:58px;height:58px;background:#5e0a28;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #2a2a2a;overflow:hidden;margin-top:-32px}
.nav-center-circle img{width:100%;height:100%;object-fit:cover}
.nav-center-label{font-size:9px;font-weight:800;color:#fff;margin-top:5px}
.cart-badge{position:absolute;top:-2px;right:10px;background:#ff2e2e;color:#fff;font-size:9px;font-weight:900;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.nav-wrap{position:relative}
</style>
</head>
<body>

<div class="header-cart">
  <h1><a href="menu.html"><i class="fa-solid fa-chevron-left"></i></a> Carrito</h1>
  <a href="#" onclick="vaciarCarrito()"><i class="fa-solid fa-trash"></i></a>
</div>

<div class="titulo-seccion">Productos seleccionados</div>
<div class="lista-carrito" id="listaCarrito"></div>

<div class="resumen" id="resumenBox">
  <div class="resumen-row total"><span>Subtotal</span><span id="totalTxt">$0.00</span></div>
</div>

<button class="btn-pago" id="btnPago" onclick="irAPagar()">Continuar al pago</button>

<div class="modal-overlay" id="modalEditar" onclick="cerrarModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
    <div class="modal-img"><img id="modalImg" src=""></div>
    <div class="modal-name" id="modalName">Producto</div>
    <div class="modal-price" id="modalPrice">$0</div>
    <div class="qty-row">
      <span>Cantidad</span>
      <div class="qty-control-modal">
        <button class="qty-btn-modal" onclick="cambiarModalQty(-1)">−</button>
        <div class="qty-num-modal" id="modalQty">1</div>
        <button class="qty-btn-modal" onclick="cambiarModalQty(1)">+</button>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarEdicion()">Guardar</button>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <a href="menu.html" class="nav-item-rappi"><i class="fa-solid fa-house"></i>INICIO</a>
  <a href="admin.html" class="nav-center-rappi"><div class="nav-center-circle"><img id="adminLogoImg" src=""></div><div class="nav-center-label">ADMIN</div></a>
  <div class="nav-wrap"><a href="carrito.html" class="nav-item-rappi active"><i class="fa-solid fa-bag-shopping"></i>CARRITO</a><div class="cart-badge" id="cartCount">0</div></div>
</div>

<script>
let carrito = {}; let cantidades = {};
try{ carrito = JSON.parse(localStorage.getItem('santillos_carrito')||'{}'); }catch(e){}
try{ cantidades = JSON.parse(localStorage.getItem('santillos_cantidades')||'{}'); }catch(e){}
let cacheConfig=null;
try{ cacheConfig=JSON.parse(localStorage.getItem('santillos_cache_config')); if(cacheConfig&&cacheConfig.logo){ document.getElementById('adminLogoImg').src=cacheConfig.logo; } }catch(e){}

let editId = null; let editTempQty = 1;

function renderCarrito(){
  const lista = document.getElementById('listaCarrito');
  const keys = Object.keys(carrito);
  if(keys.length===0){
    lista.innerHTML = `<div class="vacio"><i class="fa-solid fa-bag-shopping"></i>Tu carrito está vacío<div><a href="menu.html">Ir al menú</a></div></div>`;
    document.getElementById('resumenBox').style.display='none';
    document.getElementById('btnPago').style.display='none';
    document.getElementById('cartCount').innerText='0';
    return;
  }
  document.getElementById('resumenBox').style.display='grid';
  document.getElementById('btnPago').style.display='block';
  let html=''; let subtotal=0; let totalItems=0;
  keys.forEach(id=>{
    const p = carrito[id];
    const totalP = p.precio * p.cant;
    subtotal+=totalP; totalItems+=p.cant;
    html+=`
      <div class="cart-item">
        <div class="cart-img"><img src="${p.img}" loading="lazy"></div>
        <div class="cart-info">
          <div class="cart-name">${p.nombre}</div>
          <div class="cart-desc">Cantidad: ${p.cant} • $${p.precio} c/u</div>
          <div class="cart-price">$${totalP}</div>
        </div>
        <div class="cart-actions">
          <button class="btn-icon" onclick="abrirEditar('${id}')"><i class="fa-solid fa-pencil"></i></button>
          <button class="btn-icon delete" onclick="eliminarItem('${id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    `;
  });
  lista.innerHTML=html;
  document.getElementById('totalTxt').innerText='$'+subtotal.toFixed(2);
  document.getElementById('cartCount').innerText=totalItems;
}

function abrirEditar(id){
  const p = carrito[id]; if(!p) return;
  editId = id; editTempQty = p.cant;
  document.getElementById('modalImg').src = p.img;
  document.getElementById('modalName').innerText = p.nombre;
  document.getElementById('modalPrice').innerText = '$'+p.precio;
  document.getElementById('modalQty').innerText = editTempQty;
  document.getElementById('modalEditar').classList.add('show');
}
function cerrarModal(){ document.getElementById('modalEditar').classList.remove('show'); editId=null; }
function cambiarModalQty(d){
  editTempQty+=d; if(editTempQty<1) editTempQty=1; if(editTempQty>20) editTempQty=20;
  document.getElementById('modalQty').innerText=editTempQty;
}
function guardarEdicion(){
  if(!editId) return;
  carrito[editId].cant = editTempQty;
  cantidades[editId] = editTempQty;
  localStorage.setItem('santillos_carrito', JSON.stringify(carrito));
  localStorage.setItem('santillos_cantidades', JSON.stringify(cantidades));
  cerrarModal();
  renderCarrito();
}
function eliminarItem(id){
  delete carrito[id]; delete cantidades[id];
  localStorage.setItem('santillos_carrito', JSON.stringify(carrito));
  localStorage.setItem('santillos_cantidades', JSON.stringify(cantidades));
  renderCarrito();
}
function vaciarCarrito(){
  if(!confirm('¿Vaciar carrito?')) return;
  carrito={}; cantidades={};
  localStorage.setItem('santillos_carrito','{}');
  localStorage.setItem('santillos_cantidades','{}');
  renderCarrito();
}
function irAPagar(){
  window.location.href="resumen.html";
}
renderCarrito();
</script>
</body>
</html>
