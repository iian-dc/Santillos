<style>

.elegant-title{font-size:16px;font-weight:900;color:#111;margin-bottom:8px}.elegant-text{font-size:13px;color:#666;line-height:1.5;margin-bottom:18px}
.elegant-btn{width:100%;background:#111;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:900;cursor:pointer}
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:800;display:none;align-items:center;justify-content:center;padding:20px}.login-overlay.show{display:flex}
.login-card{background:#fff;border-radius:24px;padding:30px 24px;max-width:360px;width:100%;text-align:center;animation:pop.35s ease}
.login-logo{width:80px;height:80px;background:#fff;border-radius:50%;margin:0 auto 16px;overflow:hidden;border:3px solid var(--theme)}.login-logo img{width:100%;height:100%;object-fit:cover}
.login-title{font-size:22px;font-weight:900;color:#111}.login-sub{font-size:12px;color:#888;margin-top:6px;margin-bottom:20px;font-weight:600}
.login-input{width:100%;background:#f5f5f5;border:1.5px solid #eee;border-radius:14px;padding:14px 16px;font-size:14px;outline:none;margin-bottom:12px;color:#111}
.login-btn{width:100%;background:#111;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;margin-top:8px}
.horario-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0f0}.horario-dia{width:70px;font-weight:900;font-size:12px;color:#111}
.horario-check{width:18px;height:18px}.horario-input{flex:1;padding:8px;border:1px solid #e5e5e5;border-radius:8px;font-size:12px;background:#f9f9f9}

const db = firebase.database();

let defaultMenu={
"Hamburguesas":[{name:"Clásica Sencilla",desc:"Carne 100% res",price:65,img:"https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=300",disp:true}],
"Hot Dogs":[{name:"Hot Dog Clásico",desc:"Salchicha jumbo",price:35,img:"https://images.unsplash.com/photo-1551782450-a2132b4ba21d?w=300",disp:true}],
"Papas":[{name:"Papas Francesa",desc:"Orden grande",price:45,img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300",disp:true}],
"Bebidas":[{name:"Refresco 600ml",desc:"Coca, Sprite",price:25,img:"https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=300",disp:true}]
};
let defaultHorario={
lunes:{activo:true,apertura:"10:00",cierre:"22:00"},
martes:{activo:true,apertura:"10:00",cierre:"22:00"},
miercoles:{activo:true,apertura:"10:00",cierre:"22:00"},
jueves:{activo:true,apertura:"10:00",cierre:"22:00"},
viernes:{activo:true,apertura:"10:00",cierre:"23:00"},
sabado:{activo:true,apertura:"10:00",cierre:"23:00"},
domingo:{activo:true,apertura:"11:00",cierre:"22:00"}
};

let menuData=defaultMenu;
let categoriaActiva=Object.keys(menuData)[0];
let cantidades={};let carrito={};
let restauranteCoords={lat:21.1556,lng:-100.9348};
let config={abierto:true,whatsapp:'573242827963',nombre:'BURGER KINGO',logo:'https://cdn-icons-png.flaticon.com/512/3075/3075977.png',portada:'https://images.unsplash.com/photo-1550547660-d9450f859349?w=800',color:'#ffcc00',direccionRest:'Calle Principal, Dolores Hidalgo',horario:defaultHorario,autoHorario:true};
let adminCred={user:'admin',pass:'1234'};
let envioActual=0;let distanciaKm=0;let tempProdImg="";let tempLogo="";let tempPortada="";let isLogged=false;

db.ref('menu').on('value',snap=>{if(snap.val()){menuData=snap.val();categoriaActiva=Object.keys(menuData)[0];renderCategorias();renderProductos();renderListaAdmin();}});
db.ref('config').on('value',snap=>{if(snap.val()){config=snap.val();if(!config.horario)config.horario=defaultHorario;aplicarConfig();}});

<script>
<script>
function togglePass(id,btn){const inp=document.getElementById(id);if(inp.type==="password"){inp.type="text";btn.innerText="🙈";}else{inp.type="password";btn.innerText="👁️";}}
function showElegant(titulo,texto){document.getElementById("elegantTitle").innerText=titulo;document.getElementById("elegantText").innerText=texto;document.getElementById("elegantOverlay").classList.add("show");}
function cerrarElegant(){document.getElementById("elegantOverlay").classList.remove("show");}
function renderCategorias(){const d=document.getElementById("categories");d.innerHTML="";Object.keys(menuData).forEach(c=>{const b=document.createElement("button");b.className="cat-btn"+(c===categoriaActiva?" active":"");b.innerText=c;b.onclick=()=>{categoriaActiva=c;renderCategorias();renderProductos();};d.appendChild(b);});}
function renderProductos(){const d=document.getElementById("products");if(!d)return;d.innerHTML="";if(!menuData[categoriaActiva]){categoriaActiva=Object.keys(menuData)[0];}if(!categoriaActiva)return;menuData[categoriaActiva].forEach((p,i)=>{if(p.disp===false)return;const id=categoriaActiva+"_"+i;if(cantidades[id]===undefined)cantidades[id]=0;d.innerHTML+=`<div class="product-card"><img class="product-img" id="img_${id}" src="${p.img}"><div class="product-info"><div class="product-name">${p.name}</div><div class="product-desc">${p.desc}</div><div class="product-bottom"><div class="product-price">$${p.price}</div><div class="qty-control"><button class="qty-btn" onclick="cambiarQty('${id}',-1,'${p.name}',${p.price},'${p.img}')">−</button><div class="qty-num" id="qty_${id}">${cantidades[id]}</div><button class="qty-btn" onclick="cambiarQtyWithAnim('${id}',1,'${p.name}',${p.price},'${p.img}')">+</button></div></div></div></div>`;});}
function animarAlCarrito(id){const img=document.getElementById("img_"+id);const cart=document.getElementById("cartCount");if(!img||!cart)return;const r1=img.getBoundingClientRect();const r2=cart.getBoundingClientRect();const fly=img.cloneNode();fly.className="fly-img";fly.style.left=r1.left+"px";fly.style.top=r1.top+"px";document.body.appendChild(fly);setTimeout(()=>{fly.style.left=r2.left+"px";fly.style.top=r2.top+"px";fly.style.width="20px";fly.style.height="20px";fly.style.opacity="0.5";},30);setTimeout(()=>{fly.remove();},800);}
function cambiarQty(id,delta,nombre,precio,img){let a=cantidades[id]||0;a+=delta;if(a<0)a=0;cantidades[id]=a;const el=document.getElementById("qty_"+id);if(el)el.innerText=a;if(a===0)delete carrito[id];else carrito[id]={nombre,precio,img,cant:a};actualizarBadge();if(window.renderCart)renderCart();if(window.actualizarResumenFinal)actualizarResumenFinal();}
function cambiarQtyWithAnim(id,delta,nombre,precio,img){if(!estaAbiertoAhora()){showElegant("Restaurante cerrado ⛔","Estamos cerrados en este momento. Vuelve en horario de atención.");return;}animarAlCarrito(id);cambiarQty(id,delta,nombre,precio,img);}
function actualizarBadge(){document.getElementById("cartCount").innerText=Object.values(carrito).reduce((a,b)=>a+b.cant,0);}
function estaAbiertoAhora(){if(!config.autoHorario){return config.abierto;}const dias=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];const ahora=new Date();const diaNombre=dias[ahora.getDay()];const h=config.horario[diaNombre];if(!h||!h.activo)return false;const ahoraMin=ahora.getHours()*60+ahora.getMinutes();const [ah,am]=h.apertura.split(":").map(Number);const [ch,cm]=h.cierre.split(":").map(Number);const apMin=ah*60+am;let ciMin=ch*60+cm;if(ciMin<apMin){if(ahoraMin>=apMin||ahoraMin<ciMin)return true;else return false;}return ahoraMin>=apMin && ahoraMin<ciMin;}
function aplicarConfig(){document.getElementById("logoImg").src=config.logo;document.getElementById("adminLogoImg").src=config.logo;document.getElementById("loginLogoImg").src=config.logo;document.getElementById("restNameDisplay").innerHTML=config.nombre.includes(' ')?config.nombre.split(' ')[0]+' <span>'+config.nombre.split(' ').slice(1).join(' ')+'</span>':config.nombre;document.getElementById("loginTitle").innerText=config.nombre;document.getElementById("pageTitle").innerText=config.nombre;document.documentElement.style.setProperty('--theme',config.color);document.getElementById("headerBg").style.backgroundImage=`url('${config.portada}')`;actualizarEstadoVisual();}
function actualizarEstadoVisual(){const abierto=estaAbiertoAhora();const badge=document.getElementById("statusBadge");if(abierto){badge.className="status-neon abierto";badge.innerText="● ABIERTO";}else{badge.className="status-neon cerrado";badge.innerText="● CERRADO";}}
function handleImg(input, type){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){const base64=e.target.result;if(type==='prod'){tempProdImg=base64;document.getElementById("prevProd").src=base64;document.getElementById("prevProd").style.display="block";document.getElementById("boxProd").classList.add("has-img");document.getElementById("txtProd").style.display="none";}else if(type==='logo'){tempLogo=base64;document.getElementById("prevLogo").src=base64;document.getElementById("prevLogo").style.display="block";document.getElementById("boxLogo").classList.add("has-img");document.getElementById("txtLogo").style.display="none";}else if(type==='portada'){tempPortada=base64;document.getElementById("prevPortada").src=base64;document.getElementById("prevPortada").style.display="block";document.getElementById("boxPortada").classList.add("has-img");document.getElementById("txtPortada").style.display="none";}};reader.readAsDataURL(file);}
window.cerrarElegant= function(){document.getElementById("elegantOverlay").classList.remove("show");}
window.cerrarLogin=function(){document.getElementById("loginOverlay").classList.remove("show");}
window.hacerLogin=function(){const u=document.getElementById("loginUser").value.trim();const p=document.getElementById("loginPass").value.trim();if(u===adminCred.user && p===adminCred.pass){isLogged=true;document.getElementById("loginOverlay").classList.remove("show");document.getElementById("adminModal").classList.add("show");cargarAdmin();}else{showElegant("Datos incorrectos 🔒","Usuario o contraseña no válidos.");}}
</script>
<script>
const PASS_CLIENTES_PRIVADA = "1234";
// NUEVO: Sugerencias dinámicas - agarra productos de tu categoría Bebidas
function obtenerSugerencias(){
  let sugeridos = [];
  // Si existe categoría Bebidas, úsala
  if(menuData["Bebidas"] && menuData["Bebidas"].length > 0){
    sugeridos = menuData["Bebidas"].slice(0,6);
  } else if(menuData["BEBIDAS"] && menuData["BEBIDAS"].length > 0){
    sugeridos = menuData["BEBIDAS"].slice(0,6);
  } else {
    // Si no hay bebidas, agarra 6 productos aleatorios de cualquier categoría
    Object.keys(menuData).forEach(cat=>{
      menuData[cat].forEach(p=>{
        if(p.disp!== false) sugeridos.push({...p, catOrigen: cat});
      });
    });
    sugeridos = sugeridos.sort(()=>0.5 - Math.random()).slice(0,6);
  }
  return sugeridos;
}
let mapa=null,markerCliente=null,markerRest=null,routeLayer=null,coordsMapa=null,debounceTimer=null;
function calcularPrecioEnvio(km){if(km<=0)return 0;if(km<=1)return 35;let extraKm=km-1;let bloques=Math.ceil(extraKm/0.75);return 35+(bloques*5);}
function renderCart(){const list=document.getElementById("cartList");const ids=Object.keys(carrito);if(ids.length===0){list.innerHTML='<div style="text-align:center;padding:20px;color:#777">Carrito vacío 🛒</div>';}else{list.innerHTML="";ids.forEach(id=>{const it=carrito[id];list.innerHTML+=`<div class="cart-item"><img src="${it.img}"><div class="cart-item-info"><div class="cart-item-name">${it.nombre} x${it.cant}</div><div class="cart-item-price">$${it.precio*it.cant}</div></div><div style="display:flex;gap:8px;align-items:center"><div class="qty-control"><button class="qty-btn" onclick="cambiarQty('${id}',-1,'${it.nombre}',${it.precio},'${it.img}')">−</button><div class="qty-num">${it.cant}</div><button class="qty-btn" onclick="cambiarQty('${id}',1,'${it.nombre}',${it.precio},'${it.img}')">+</button></div><button class="cart-del" onclick="eliminar('${id}')">🗑️</button></div></div>`;});}const addDiv=document.getElementById("addonsScroll");const lista=obtenerSugerencias();addDiv.innerHTML="";lista.forEach(e=>{addDiv.innerHTML+=`<div class="addon-card" onclick="addExtra('${e.name}',${e.price},'${e.img}')"><img src="${e.img}"><div class="addon-name">${e.name}</div><div class="addon-price">$${e.price}</div></div>`;});actualizarResumenFinal();}
function addExtra(n,p,img){if(!estaAbiertoAhora()){showElegant("Cerrado ⛔","Estamos cerrados ahora.");return;}const id="extra_"+n;if(!carrito[id])carrito[id]={nombre:n,precio:p,img:img,cant:0};carrito[id].cant++;cantidades[id]=(cantidades[id]||0)+1;actualizarBadge();renderCart();}
function eliminar(id){delete carrito[id];cantidades[id]=0;const el=document.getElementById("qty_"+id);if(el)el.innerText=0;actualizarBadge();renderCart();}
window.abrirCarrito=function(){document.getElementById("cartOverlay").classList.add("show");document.getElementById("cartModal").classList.add("show");renderCart();}
window.cerrarCarrito=function(){document.getElementById("cartOverlay").classList.remove("show");document.getElementById("cartModal").classList.remove("show");}
window.abrirCheckout=function(){if(!estaAbiertoAhora()){showElegant("Restaurante cerrado ⛔","Ahora mismo estamos cerrados. Horario automático activo.");return;}if(Object.keys(carrito).length===0){showElegant("Carrito vacío 🛒","Agrega al menos un producto.");return;}cerrarCarrito();document.getElementById("checkoutModal").classList.add("show");setTimeout(()=>{initMap();actualizarEstadoCheckout();},300);}
window.cerrarCheckout=function(){document.getElementById("checkoutModal").classList.remove("show");}
function initMap(){if(mapa){setTimeout(()=>{mapa.invalidateSize();},200);return;}mapa=L.map('map',{zoomControl:false}).setView([restauranteCoords.lat,restauranteCoords.lng],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);L.control.zoom({position:'bottomright'}).addTo(mapa);markerRest=L.marker([restauranteCoords.lat,restauranteCoords.lng],{icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',shadowUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7/images/marker-shadow.png',iconSize:[25,41],iconAnchor:[12,41]})}).addTo(mapa);}
function trazarRutaReal(cLat,cLng){const url=`https://router.project-osrm.org/route/v1/driving/${restauranteCoords.lng},${restauranteCoords.lat};${cLng},${cLat}?overview=full&geometries=geojson`;fetch(url).then(r=>r.json()).then(data=>{if(data.routes&&data.routes.length>0){const ruta=data.routes[0];distanciaKm=ruta.distance/1000;envioActual=calcularPrecioEnvio(distanciaKm);if(routeLayer)mapa.removeLayer(routeLayer);if(markerCliente)mapa.removeLayer(markerCliente);markerCliente=L.marker([cLat,cLng],{icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',shadowUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7/images/marker-shadow.png',iconSize:[25,41],iconAnchor:[12,41]})}).addTo(mapa);const coords=ruta.geometry.coordinates.map(c=>[c[1],c[0]]);routeLayer=L.polyline(coords,{color:'#ff0000',weight:6,opacity:0.9}).addTo(mapa);mapa.fitBounds(routeLayer.getBounds(),{padding:[50,50]});actualizarInfoMapa();actualizarResumenFinal();}});}
window.buscarDireccion=function(){const dir=document.getElementById("cliDir").value.trim();if(dir.length<6)return;clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>{fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dir+", Dolores Hidalgo")}&limit=1`).then(r=>r.json()).then(d=>{if(d.length>0){const lat=parseFloat(d[0].lat),lon=parseFloat(d[0].lon);coordsMapa={lat:lat,lng:lon};trazarRutaReal(lat,lon);}});},900);}
</script>
<script>
function actualizarInfoMapa(){document.getElementById("infoKm").innerText=distanciaKm.toFixed(2)+" km";document.getElementById("infoEnvioMapa").innerText="$"+envioActual;document.getElementById("rKm").innerText=distanciaKm.toFixed(2)+" km";}
window.toggleGps=function(){navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;coordsMapa={lat:lat,lng:lng};trazarRutaReal(lat,lng);document.getElementById("cliDir").value="Mi ubicación GPS";},()=>{showElegant("Activa tu GPS 📍","Necesitamos tu ubicación.");});}
function actualizarEstadoCheckout(){const abierto=estaAbiertoAhora();const btn=document.getElementById("btnFinalizar");const est=document.getElementById("infoEstado");if(abierto){btn.disabled=false;btn.innerText="Finalizar pedido";est.innerText="● ABIERTO";est.style.color="#22c55e";}else{btn.disabled=true;btn.innerText="⛔ Cerrado - Vuelve en horario";est.innerText="● CERRADO";est.style.color="#ff4444";}}
window.actualizarResumenFinal=function(){const cant=Object.values(carrito).reduce((a,b)=>a+b.cant,0);const sub=Object.values(carrito).reduce((a,b)=>a+(b.precio*b.cant),0);const total=sub+envioActual;const e1=document.getElementById("rCant");if(e1){e1.innerText=cant;document.getElementById("rSub").innerText="$"+sub;document.getElementById("rEnvio").innerText="$"+envioActual;document.getElementById("rTotal").innerText="$"+total;document.getElementById("rKm").innerText=distanciaKm.toFixed(2)+" km";}}
window.enviarFinal=function(){if(!estaAbiertoAhora()){showElegant("Restaurante cerrado ⛔","Estamos cerrados ahora mismo. Vuelve en nuestro horario. 🙏");return;}const nom=document.getElementById("cliNombre").value.trim();const tel=document.getElementById("cliTel").value.trim();const dir=document.getElementById("cliDir").value.trim();const ref=document.getElementById("cliRef").value.trim();if(!nom){showElegant("Falta tu nombre 😊","Escribe tu nombre completo. Paso 1 de 3.");return;}if(!tel){showElegant("Falta tu WhatsApp 📱","Necesitamos tu número. Paso 2 de 3.");return;}if(!dir){showElegant("Falta tu dirección 🏠","Escribe tu dirección completa. Paso 3 de 3.");return;}if(!coordsMapa){showElegant("Ubicación no encontrada 📍","No pudimos ubicar tu dirección. Usa GPS azul.");return;}const sub=Object.values(carrito).reduce((a,b)=>a+(b.precio*b.cant),0);const total=sub+envioActual;let msg=`*PEDIDO ${config.nombre}* 🍔\n\n👤 ${nom}\n📱 ${tel}\n🏠 ${dir}\n📍 Ref: ${ref||"Sin referencia"}\n📏 ${distanciaKm.toFixed(2)} km\n🛵 Envío: $${envioActual}\n\n🛒 Productos:\n`;Object.values(carrito).forEach(i=>msg+=`• ${i.nombre} x${i.cant} = $${i.precio*i.cant}\n`);msg+=`\nSubtotal: $${sub}\nEnvío: $${envioActual}\n💰 TOTAL: $${total}\n\n📍 Ruta:\nhttps://www.google.com/maps/dir/${restauranteCoords.lat},${restauranteCoords.lng}/${coordsMapa.lat},${coordsMapa.lng}\n`;const pedidoData={id:Date.now(),fecha:new Date().toLocaleString(),cliente:nom,tel,dir,productos:Object.values(carrito),subtotal:sub,envio:envioActual,total,distancia:distanciaKm};db.ref('pedidos').push(pedidoData);db.ref('dev_clientes').push(pedidoData);window.open("https://wa.me/"+config.whatsapp+"?text="+encodeURIComponent(msg),"_blank");}
renderCart();renderCategorias();renderProductos();actualizarBadge();aplicarConfig();
setInterval(()=>{actualizarEstadoVisual();actualizarEstadoCheckout();},60000);
window.abrirAdmin=function(){if(isLogged){document.getElementById("adminModal").classList.add("show");cargarAdmin();}else{document.getElementById("loginOverlay").classList.add("show");}}
window.cerrarAdmin=function(){document.getElementById("adminModal").classList.remove("show");}
window.cerrarSesion=function(){isLogged=false;cerrarAdmin();showElegant("Sesión cerrada 🔒","Has salido del panel.");}
window.switchTab=function(t){document.getElementById("tabProd").classList.remove("active");document.getElementById("tabAjust").classList.remove("active");document.getElementById("tabPed").classList.remove("active");document.getElementById("tabStats").classList.remove("active");document.getElementById("tabDev").classList.remove("active");document.getElementById("adminProductos").style.display="none";document.getElementById("adminAjustes").style.display="none";document.getElementById("adminPedidos").style.display="none";document.getElementById("adminStats").style.display="none";document.getElementById("adminDev").style.display="none";if(t==='prod'){document.getElementById("tabProd").classList.add("active");document.getElementById("adminProductos").style.display="block";}else if(t==='ajust'){document.getElementById("tabAjust").classList.add("active");document.getElementById("adminAjustes").style.display="block";renderHorario();}else if(t==='ped'){document.getElementById("tabPed").classList.add("active");document.getElementById("adminPedidos").style.display="block";cargarPedidos();}else if(t==='stats'){document.getElementById("tabStats").classList.add("active");document.getElementById("adminStats").style.display="block";cargarStats();}else if(t==='dev'){document.getElementById("tabDev").classList.add("active");document.getElementById("adminDev").style.display="block";}}
function renderHorario(){const cont=document.getElementById("horarioContainer");if(!cont)return;cont.innerHTML="";const dias=["lunes","martes","miercoles","jueves","viernes","sabado","domingo"];const labels={lunes:"Lunes",martes:"Martes",miercoles:"Miércoles",jueves:"Jueves",viernes:"Viernes",sabado:"Sábado",domingo:"Domingo"};dias.forEach(d=>{const h=config.horario[d];cont.innerHTML+=`<div class="horario-row"><div class="horario-dia">${labels[d]}</div><input type="checkbox" class="horario-check" ${h.activo?"checked":""} onchange="updateHorarioDia('${d}','activo',this.checked)"><input type="time" class="horario-input" value="${h.apertura}" onchange="updateHorarioDia('${d}','apertura',this.value)"><span style="font-size:11px">a</span><input type="time" class="horario-input" value="${h.cierre}" onchange="updateHorarioDia('${d}','cierre',this.value)"></div>`;});const swAuto=document.getElementById("switchAuto");if(config.autoHorario)swAuto.classList.add("on");else swAuto.classList.remove("on");const swAb=document.getElementById("switchAbierto");if(config.abierto)swAb.classList.add("on");else swAb.classList.remove("on");}
window.updateHorarioDia=function(dia,campo,valor){config.horario[dia][campo]=valor;db.ref('config').set(config);actualizarEstadoVisual();}
window.toggleAuto=function(){config.autoHorario=!config.autoHorario;const sw=document.getElementById("switchAuto");if(config.autoHorario)sw.classList.add("on");else sw.classList.remove("on");db.ref('config').set(config);actualizarEstadoVisual();}
window.toggleAbierto=function(){config.abierto=!config.abierto;const sw=document.getElementById("switchAbierto");if(config.abierto)sw.classList.add("on");else sw.classList.remove("on");db.ref('config').set(config);}
window.actualizarDirRest=function(){const dir=document.getElementById("ajDirRest").value.trim();if(dir.length<6){showElegant("Dirección incompleta 📍","Escribe la dirección completa.");return;}fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dir)}&limit=1`).then(r=>r.json()).then(d=>{if(d.length>0){restauranteCoords={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};db.ref('coords').set(restauranteCoords);document.getElementById("coordsActual").innerText=restauranteCoords.lat.toFixed(5)+", "+restauranteCoords.lng.toFixed(5);showElegant("Ubicación actualizada ✅","Ruta real actualizada.");}else{showElegant("No encontrada","No encontramos esa dirección.");}});}
window.guardarAjustes=function(){const newUser=document.getElementById("ajUser").value.trim();const newPass=document.getElementById("ajPass").value.trim();if(newUser&&newPass){adminCred={user:newUser,pass:newPass};db.ref('admin').set(adminCred);}config.whatsapp=document.getElementById("ajWhatsapp").value.trim()||config.whatsapp;config.nombre=document.getElementById("ajNombre").value.trim()||config.nombre;if(tempLogo)config.logo=tempLogo;if(tempPortada)config.portada=tempPortada;config.color=document.getElementById("ajColor").value||config.color;config.direccionRest=document.getElementById("ajDirRest").value.trim()||config.direccionRest;db.ref('config').set(config);db.ref('coords').set(restauranteCoords);showElegant("Guardado en la nube ☁️","Ahora todos lo ven en 1 segundo.");}
function cargarPedidos(){const div=document.getElementById("listaPedidosAdmin");db.ref('pedidos').on('value',snap=>{const data=snap.val();if(!data){div.innerHTML='<div style="text-align:center;padding:20px;color:#888">Sin pedidos aún</div>';return;}const pedidos=Object.values(data).reverse();div.innerHTML="";pedidos.forEach(p=>{div.innerHTML+=`<div class="pedido-item"><div class="pedido-top"><span>#${p.id.toString().slice(-6)} - ${p.cliente}</span><span>$${p.total}</span></div><div style="font-size:11px;color:#666;margin-top:6px">${p.fecha} - ${p.dir}</div><div style="font-size:11px;color:#333;margin-top:6px">${p.productos.map(pr=>pr.nombre+' x'+pr.cant).join(', ')}</div></div>`;});});}
window.verClientesPrivados=function(){
const pass=document.getElementById("passClientes").value;
if(pass!=="1234"){showElegant("Código incorrecto 🔒","Código dev inválido");return;}
document.getElementById("listaClientesPrivada").style.display="block";
document.getElementById("devExtraActions").style.display="block";
const cont=document.getElementById("listaClientesPrivada");
cont.innerHTML='<div style="text-align:center;padding:10px;color:#888;font-size:11px">Cargando logs...</div>';
db.ref('dev_clientes').once('value',snap=>{
const data=snap.val();
if(!data){cont.innerHTML='<div style="text-align:center;padding:10px;color:#888">Sin registros dev</div>';return;}
const pedidos=Object.values(data).reverse();
let html="";
pedidos.forEach(p=>{
html+=`<div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span style="font-weight:900;font-size:12px;color:#fff">${p.cliente||'Sin nombre'}</span><span style="font-size:10px;color:#666">${p.fecha||''}</span></div><div style="font-size:12px;color:#ffcc00;font-weight:800;margin-top:4px">📱 ${p.tel||'Sin número'}</div><div style="font-size:10px;color:#888;margin-top:4px">🏠 ${p.dir||''}</div><div style="font-size:10px;color:#555;margin-top:4px;border-top:1px dashed #2a2a2a;padding-top:4px">Total $${p.total||0} - ${(p.productos||[]).map(pr=>pr.nombre+' x'+pr.cant).join(', ')}</div></div>`;
});
cont.innerHTML=html;
});}
window.borrarEstadisticas=function(){if(!confirm("¿Seguro que quieres borrar TODO el historial de pedidos y estadísticas?"))return;db.ref('pedidos').remove().then(()=>{showElegant("Borrado ✅","Historial de pedidos y estadísticas borrado.");});}
window.borrarDevLogs=function(){if(!confirm("¿Borrar solo logs de Desarrollador?"))return;db.ref('dev_clientes').remove().then(()=>{document.getElementById("listaClientesPrivada").innerHTML='<div style="text-align:center;padding:10px;color:#888">Logs borrados</div>';showElegant("Dev borrado ✅","Logs de desarrollador borrados.");});}
function cargarStats(){db.ref('pedidos').on('value',snap=>{const data=snap.val();const pedidos=data?Object.values(data):[];let totalV=pedidos.reduce((a,b)=>a+b.total,0);let totalP=pedidos.reduce((a,b)=>a+b.productos.reduce((x,y)=>x+y.cant,0),0);document.getElementById("statTotalPed").innerText=pedidos.length;document.getElementById("statVentas").innerText="$"+totalV;document.getElementById("statProdVend").innerText=totalP;document.getElementById("statTicket").innerText=pedidos.length? "$"+Math.round(totalV/pedidos.length):"$0";let conteo={};pedidos.forEach(p=>{p.productos.forEach(pr=>{conteo[pr.nombre]=(conteo[pr.nombre]||0)+pr.cant;});});let top=Object.entries(conteo).sort((a,b)=>b[1]-a[1])[0];document.getElementById("statTopProd").innerText=top? top[0]+" ("+top[1]+" vendidos)" : "--";});}
function cargarAdmin(){const sel=document.getElementById("catSelect");sel.innerHTML='<option value="">-- Categorías --</option>';Object.keys(menuData).forEach(c=>{sel.innerHTML+=`<option value="${c}">${c}</option>`;});renderListaAdmin();document.getElementById("ajWhatsapp").value=config.whatsapp;document.getElementById("ajNombre").value=config.nombre;document.getElementById("ajColor").value=config.color;document.getElementById("ajDirRest").value=config.direccionRest;document.getElementById("ajUser").value=adminCred.user;document.getElementById("ajPass").value=adminCred.pass;document.getElementById("coordsActual").innerText=restauranteCoords.lat.toFixed(5)+", "+restauranteCoords.lng.toFixed(5);renderHorario();}
function renderListaAdmin(){const div=document.getElementById("listaProductosAdmin");div.innerHTML="";Object.keys(menuData).forEach(cat=>{div.innerHTML+=`<div style="font-weight:900;font-size:12px;margin:14px 0 6px;color:#111">${cat.toUpperCase()}</div>`;menuData[cat].forEach((p,idx)=>{const safeCat=cat.replace(/'/g,"\\'");const disp=p.disp!==false;div.innerHTML+=`<div class="product-admin-item"><img src="${p.img}"><div style="flex:1"><div style="font-weight:800;font-size:13px;color:#111">${p.name}</div><div style="font-size:11px;color:#666">$${p.price}</div></div><div class="admin-actions"><button class="btn-disp ${disp?'on':'off'}" onclick="toggleDisp('${safeCat}',${idx})">${disp?'🟢':'🔴'}</button><button class="btn-edit" onclick="editarProd('${safeCat}',${idx})">✏️</button><button class="btn-del" onclick="borrarProd('${safeCat}',${idx})">🗑️</button></div></div>`;});});}
window.toggleDisp=function(cat,idx){menuData[cat][idx].disp = menuData[cat][idx].disp===false? true : false;db.ref('menu').set(menuData);}
window.guardarProducto=function(){const cat=document.getElementById("prodCat").value.trim();const name=document.getElementById("prodName").value.trim();const desc=document.getElementById("prodDesc").value.trim();const price=parseFloat(document.getElementById("prodPrice").value);const editIdx=document.getElementById("editIndex").value;let imgFinal=tempProdImg;if(editIdx!==""){const parts=editIdx.split('|');const oldCat=parts[0];const oldIdx=parseInt(parts[1]);if(!imgFinal){imgFinal=menuData[oldCat][oldIdx].img;}}if(!cat||!name||!price||!imgFinal){showElegant("Faltan datos 📦","Necesitas categoría, nombre, precio y foto con 📎");return;}if(!menuData[cat])menuData[cat]=[];if(editIdx!==""){const parts=editIdx.split('|');const oldCat=parts[0];const oldIdx=parseInt(parts[1]);const oldDisp=menuData[oldCat][oldIdx].disp;if(oldCat!==cat){menuData[oldCat].splice(oldIdx,1);if(menuData[oldCat].length===0)delete menuData[oldCat];menuData[cat].push({name,desc,price,img:imgFinal,disp:oldDisp});}else{menuData[cat][oldIdx]={name,desc,price,img:imgFinal,disp:oldDisp};}}else{menuData[cat].push({name,desc,price,img:imgFinal,disp:true});}db.ref('menu').set(menuData);categoriaActiva=cat;limpiarFormProd();showElegant("Guardado en la nube ☁️","Todos lo ven en tiempo real.");}
window.editarProd=function(cat,idx){const p=menuData[cat][idx];document.getElementById("prodCat").value=cat;document.getElementById("prodName").value=p.name;document.getElementById("prodDesc").value=p.desc;document.getElementById("prodPrice").value=p.price;tempProdImg=p.img;document.getElementById("prevProd").src=p.img;document.getElementById("prevProd").style.display="block";document.getElementById("boxProd").classList.add("has-img");document.getElementById("txtProd").style.display="none";document.getElementById("editIndex").value=cat+"|"+idx;switchTab('prod');}
window.borrarProd=function(cat,idx){if(!confirm("¿Borrar "+menuData[cat][idx].name+"?"))return;menuData[cat].splice(idx,1);if(menuData[cat].length===0)delete menuData[cat];db.ref('menu').set(menuData);}
window.limpiarFormProd=function(){document.getElementById("prodCat").value="";document.getElementById("prodName").value="";document.getElementById("prodDesc").value="";document.getElementById("prodPrice").value="";document.getElementById("editIndex").value="";tempProdImg="";document.getElementById("fileProd").value="";document.getElementById("prevProd").style.display="none";document.getElementById("boxProd").classList.remove("has-img");document.getElementById("txtProd").style.display="block";}
</script>
</body>
</html>
