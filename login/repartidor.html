<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panel Repartidor - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f7f3f6;color:#222;min-height:100vh;margin:0 auto}
.topbar{background:#5c0f2a;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:10px}
.logo-area{line-height:1}
.logo-area h1{color:#fff;font-size:28px;font-weight:900;letter-spacing:-1px;display:flex;align-items:center}
.logo-area h1 span{position:relative}
.logo-area h1 span::after{content:'';width:10px;height:10px;background:#ffc300;border-radius:50%;position:absolute;top:-2px;right:-12px}
.logo-area p{color:#fff;font-size:10px;font-weight:400;margin-top:0px;margin-left:2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.online-pill{border:1.5px solid rgba(255,255,255,0.4);border-radius:30px;padding:6px 12px;display:flex;align-items:center;gap:6px;color:#fff;font-size:12px;font-weight:600}
.online-pill .dot{width:14px;height:14px;background:#22c55e;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px rgba(34,197,94,0.2)}
.btn-logout{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:7px 14px;border-radius:30px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.wrap{padding:12px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){ .wrap{grid-template-columns:1fr 1fr; padding:18px} }
@media(min-width:1100px){ .wrap{grid-template-columns:1fr 1fr 1fr} }
.card{background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 3px 14px rgba(0,0,0,0.06);border:1px solid #f0e6ec;transition:all 0.3s;height:fit-content}
.card.nuevo{border:2px solid #00ff88;box-shadow:0 0 0 4px rgba(0,255,136,0.15),0 6px 18px rgba(0,0,0,0.08);animation:neon 1.2s infinite}
@keyframes neon{0%,100%{box-shadow:0 0 0 4px rgba(0,255,136,0.15)}50%{box-shadow:0 0 0 7px rgba(0,255,136,0.25)}}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pedido-badge{background:#5c0f2a;color:#fff;border-radius:30px;padding:6px 12px;font-weight:700;font-size:12px}
.meta-head{display:flex;align-items:center;gap:8px;color:#5c0f2a;font-size:11px;font-weight:600}
.sep{width:1px;height:14px;background:#ddd}
.client-box{background:#faf6f8;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:10px;position:relative}
.client-icon{width:40px;height:40px;background:#5c0f2a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.client-info{flex:1;min-width:0}
.client-info small{color:#5c0f2a;font-size:10px;font-weight:600}
.client-info b{font-size:13px;color:#111;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-info span{font-size:11px;color:#555;display:flex;align-items:center;gap:4px;margin-top:1px}
.btn-call{width:38px;height:38px;border-radius:50%;background:#22c55e;color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;box-shadow:0 2px 8px rgba(34,197,94,0.3)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px}
.section-title h3{color:#5c0f2a;font-size:13px;font-weight:800}
.count-pill{background:#faf6f8;border-radius:20px;padding:4px 10px;font-size:10px;color:#5c0f2a;font-weight:600;display:flex;align-items:center;gap:4px}
.prod-list{display:flex;flex-direction:column}
.prod-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1e8ef}
.prod-item:last-child{border:none}
.prod-img{width:44px;height:38px;border-radius:10px;object-fit:cover;background:#eee}
.prod-name{flex:1;font-size:12px;font-weight:500;color:#1e2a4a}
.prod-qty{font-size:11px;color:#666}
.info-grid{background:#faf6f8;border-radius:14px;display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 4px;margin:10px 0}
.info-col{display:flex;flex-direction:column;gap:1px;padding:0 6px;border-right:1px solid #ece0e8}
.info-col:last-child{border:none}
.info-col .icon{width:24px;height:24px;background:#5c0f2a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;margin-bottom:3px}
.info-col small{font-size:9px;color:#333;font-weight:500;line-height:1.1}
.info-col b{font-size:12px;font-weight:800;color:#5c0f2a;line-height:1.1}
.addr-box{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.addr-icon{color:#5c0f2a;font-size:18px;margin-top:2px}
.addr-text{flex:1}
.addr-text b{color:#5c0f2a;font-size:11px}
.addr-text p{font-size:10.5px;color:#6b7280;line-height:1.3;margin-top:1px}
.map-link{color:#5c0f2a;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap;margin-top:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.actions.full{grid-template-columns:1fr 1fr 1fr}
.btn{border:none;border-radius:12px;padding:10px 6px;font-weight:800;font-size:10.5px;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;line-height:1.1;text-align:center}
.btn i{font-size:14px}
.btn-green{background:#22c55e;color:#fff;box-shadow:0 3px 10px rgba(34,197,94,0.3)}
.btn-yellow{background:#ffc300;color:#111}
.btn-vino{background:#5c0f2a;color:#fff}
.btn-outline{background:#fff;border:1.5px solid #5c0f2a;color:#5c0f2a}
.collapsed-hint{font-size:10px;color:#888;text-align:center;margin-top:6px}
.empty{background:#fff;border-radius:18px;padding:30px 18px;text-align:center;color:#999;font-size:12px;grid-column:1/-1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:9999;display:none;align-items:center;justify-content:center;padding:14px}
.modal-overlay.show{display:flex}
.modal-card{background:#fff;border-radius:18px;width:100%;max-width:380px;max-height:85vh;overflow-y:auto}
.modal-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:1}
.modal-head h3{font-size:13px;font-weight:800;color:#5c0f2a}
.btn-close{width:26px;height:26px;border-radius:50%;background:#f3f4f6;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-body{padding:12px 14px}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(5px);z-index:10000;display:none;align-items:center;justify-content:center;padding:16px}
.confirm-overlay.show{display:flex}
.confirm-card{background:#fff;border-radius:20px;width:100%;max-width:340px;padding:20px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2);animation:pop 0.3s ease}
@keyframes pop{0%{transform:scale(0.85);opacity:0}100%{transform:scale(1);opacity:1}}
.confirm-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px}
.confirm-icon.yellow{background:#fef3c7;color:#d97706}
.confirm-icon.green{background:#dcfce7;color:#16a34a}
.confirm-icon.vino{background:#fce7f3;color:#5c0f2a}
.confirm-card h3{font-size:15px;font-weight:800;color:#111;margin-bottom:4px}
.confirm-card p{font-size:12px;color:#666;margin-bottom:14px;line-height:1.4}
.confirm-actions{display:flex;gap:8px}
.btn-confirm{flex:1;padding:12px;border-radius:12px;border:none;font-weight:800;font-size:12px;cursor:pointer}
.btn-confirm.cancel{background:#f3f4f6;color:#333}
.btn-confirm.yes-yellow{background:#ffc300;color:#111}
.btn-confirm.yes-green{background:#22c55e;color:#fff}
.btn-confirm.yes-vino{background:#5c0f2a;color:#fff}
.toast-overlay{position:fixed;inset:0;z-index:10001;display:none;align-items:center;justify-content:center;pointer-events:none}
.toast-overlay.show{display:flex}
.toast-card{background:#1e1e1e;color:#fff;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:220px;box-shadow:0 20px 60px rgba(0,0,0,0.4);animation:pop 0.3s ease;border:1px solid #2a2a2a}
.toast-card i{font-size:28px;color:#22c55e}
.toast-card b{font-size:14px;font-weight:800}
.toast-card span{font-size:11px;color:#aaa}
.motivo-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.motivo-btn{width:100%;text-align:left;padding:12px 12px;border-radius:12px;border:1.5px solid #f0e6ec;background:#faf6f8;font-size:12px;font-weight:600;color:#333;cursor:pointer;display:flex;align-items:center;gap:10px}
.motivo-btn.active{border-color:#5c0f2a;background:#5c0f2a;color:#fff}
.motivo-btn i{font-size:14px}
.input-otro{width:100%;margin-top:8px;padding:10px 12px;border-radius:12px;border:1.5px solid #ddd;font-size:12px;display:none}
.input-otro.show{display:block}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left"><div class="logo-area"><h1><span>Santillos</span></h1><p>Panel del repartidor</p></div></div>
  <div class="topbar-right"><div class="online-pill"><span class="dot"></span> En línea</div><button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Cerrar</button></div>
</div>

<div class="wrap" id="lista"></div>

<div class="modal-overlay" id="modalDetalles" onclick="if(event.target===this)cerrarModal()"><div class="modal-card"><div class="modal-head"><h3><i class="fa-solid fa-utensils"></i> Detalles</h3><button class="btn-close" onclick="cerrarModal()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body" id="bodyDetalles"></div></div></div>

<div class="confirm-overlay" id="overlayConfirm"><div class="confirm-card" id="cardConfirm"></div></div>
<div class="toast-overlay" id="overlayToast"><div class="toast-card" id="cardToast"></div></div>

<div class="confirm-overlay" id="overlayMotivos">
  <div class="confirm-card" style="max-width:360px;text-align:left">
    <div style="text-align:center"><div class="confirm-icon vino"><i class="fa-solid fa-ban"></i></div><h3>¿Por qué se cancela?</h3><p>Selecciona motivo para guardar en historial</p></div>
    <div class="motivo-list" id="listaMotivos">
      <button class="motivo-btn" data-motivo="Cliente no salió"><i class="fa-solid fa-person-walking"></i> Cliente no salió</button>
      <button class="motivo-btn" data-motivo="No respondió / Tel apagado"><i class="fa-solid fa-phone-slash"></i> No respondió</button>
      <button class="motivo-btn" data-motivo="Dirección incorrecta"><i class="fa-solid fa-location-dot"></i> Dirección incorrecta</button>
      <button class="motivo-btn" data-motivo="Cliente canceló en sitio"><i class="fa-solid fa-hand"></i> Cliente canceló en sitio</button>
      <button class="motivo-btn" data-motivo="Producto dañado"><i class="fa-solid fa-box-open"></i> Producto dañado</button>
      <button class="motivo-btn" data-motivo="Ubicación no segura"><i class="fa-solid fa-triangle-exclamation"></i> Ubicación no segura</button>
      <button class="motivo-btn" data-motivo="Otro"><i class="fa-solid fa-pen"></i> Otro motivo</button>
    </div>
    <input type="text" id="inputOtroMotivo" class="input-otro" placeholder="Escribe motivo...">
    <div class="confirm-actions" style="margin-top:14px"><button class="btn-confirm cancel" onclick="cerrarMotivos()">Cancelar</button><button class="btn-confirm yes-vino" onclick="confirmarCancelacionConMotivo()">Guardar en historial</button></div>
  </div>
</div>

<script>
const configPedidos={
  apiKey: "AIzaSyC0Y1TKsFWX-byB6ws_m2ldJ0P7Gs8k4N4",
  authDomain: "santillos-pedidos.firebaseapp.com",
  databaseURL: "https://santillos-pedidos-default-rtdb.firebaseio.com",
  projectId: "santillos-pedidos"
};
const configRepartidor={
  apiKey: "AIzaSyDQ0SPfwvP_T06wcEXla2UW_SP8CcGYbjI",
  authDomain: "santillos-repartidor.firebaseapp.com",
  databaseURL: "https://santillos-repartidor-default-rtdb.firebaseio.com",
  projectId: "santillos-repartidor"
};
const configHistorial={
  apiKey: "AIzaSyAXXnmGShWhXPKYDgL3RC-zu5ZU9SQzl_Q",
  authDomain: "santillos-historial.firebaseapp.com",
  databaseURL: "https://santillos-historial-default-rtdb.firebaseio.com",
  projectId: "santillos-historial",
  storageBucket: "santillos-historial.firebasestorage.app",
  messagingSenderId: "339742337344",
  appId: "1:339742337344:web:0bd3676108866ef505f2a5"
};

const appPedidos = firebase.initializeApp(configPedidos, "pedidos");
const appRepartidor = firebase.initializeApp(configRepartidor, "repartidor");
const appHistorial = firebase.initializeApp(configHistorial, "historial");

const dbPedidos = appPedidos.database();
const dbRepartidor = appRepartidor.database();
const dbHistorial = appHistorial.database();

let cache=[]; let idsVistos=new Set(); let primer=true; let nuevos=new Set(); let expandidos=new Set();
let cancelIdActual=null; let motivoSeleccionado=''; let ipCliente='';

async function obtenerIP(){
  try{ let r=await fetch('https://api.ipify.org?format=json'); let d=await r.json(); return d.ip||''; }catch(e){ return 'sin-ip'; }
}
obtenerIP().then(ip=>ipCliente=ip);

function init(){
  dbRepartidor.ref('pedidos_en_camino').on('value', snap=>{
    let data=snap.val()||{};
    let lista=Object.entries(data).map(([k,v])=>({firebaseId:k, ...v}));
    lista.sort((a,b)=>(a.correlativo||0)-(b.correlativo||0));
    if(!primer){
      let diff=lista.filter(x=>!idsVistos.has(x.firebaseId));
      if(diff.length){ diff.forEach(d=>{ nuevos.add(d.firebaseId); setTimeout(()=>{ nuevos.delete(d.firebaseId); render(); },10000)}); sonar(); }
    }
    idsVistos=new Set(lista.map(x=>x.firebaseId)); primer=false; cache=lista; render();
  });
}
init();

let ctx=null; function sonar(){ try{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); const t=ctx.currentTime; [0,0.3].forEach((d,i)=>{ const o=ctx.createOscillator(); const g=ctx.createGain(); o.frequency.setValueAtTime(i?1200:900, t+d); o.frequency.exponentialRampToValueAtTime(i?900:700, t+d+0.3); g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(0.9,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.01,t+d+0.5); o.connect(g); g.connect(ctx.destination); o.start(t+d); o.stop(t+d+0.6); }); if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){} }
function timeAgo(ts){ if(!ts) return 'Ahora'; let diff=Math.floor((Date.now()-ts)/60000); if(diff<1) return 'Ahora'; if(diff<60) return `Hace ${diff} min`; return `Hace ${Math.floor(diff/60)} h`; }

function mostrarConfirm(tipo, onConfirm){
  const overlay=document.getElementById('overlayConfirm');
  const card=document.getElementById('cardConfirm');
  let html='';
  if(tipo==='en_camino'){
    html=`<div class="confirm-icon yellow"><i class="fa-solid fa-motorcycle"></i></div><h3>¿Marcar en camino?</h3><p>Cliente verá que va en camino</p><div class="confirm-actions"><button class="btn-confirm cancel" onclick="cerrarConfirm()">Cancelar</button><button class="btn-confirm yes-yellow" id="btnYes">Sí, en camino</button></div>`;
  }else if(tipo==='entregado'){
    html=`<div class="confirm-icon green"><i class="fa-solid fa-check"></i></div><h3>¿Confirmar entrega?</h3><p>Se guardará en historial</p><div class="confirm-actions"><button class="btn-confirm cancel" onclick="cerrarConfirm()">Cancelar</button><button class="btn-confirm yes-green" id="btnYes">Sí, entregado</button></div>`;
  }
  card.innerHTML=html; overlay.classList.add('show');
  document.getElementById('btnYes').onclick=()=>{ cerrarConfirm(); onConfirm(); };
}
window.cerrarConfirm=function(){ document.getElementById('overlayConfirm').classList.remove('show'); }
function mostrarToast(tipo){
  const overlay=document.getElementById('overlayToast');
  const card=document.getElementById('cardToast');
  let html='';
  if(tipo==='en_camino'){ html=`<i class="fa-solid fa-motorcycle" style="color:#ffc300"></i><b>¡En camino!</b><span>Notificado</span>`; }
  else if(tipo==='entregado'){ html=`<i class="fa-solid fa-circle-check"></i><b>¡Entregado!</b><span>Guardado en historial</span>`; }
  else if(tipo==='cancelado'){ html=`<i class="fa-solid fa-ban" style="color:#ef4444"></i><b>Cancelado</b><span>Guardado con motivo</span>`; }
  card.innerHTML=html; overlay.classList.add('show');
  setTimeout(()=>{ overlay.classList.remove('show'); },2400);
}

window.abrirMotivos=function(id){
  cancelIdActual=id; motivoSeleccionado='';
  document.querySelectorAll('.motivo-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('inputOtroMotivo').classList.remove('show'); document.getElementById('inputOtroMotivo').value='';
  document.getElementById('overlayMotivos').classList.add('show');
}
window.cerrarMotivos=function(){ document.getElementById('overlayMotivos').classList.remove('show'); cancelIdActual=null; }
document.addEventListener('click', (e)=>{
  if(e.target.closest('.motivo-btn')){
    document.querySelectorAll('.motivo-btn').forEach(b=>b.classList.remove('active'));
    e.target.closest('.motivo-btn').classList.add('active');
    motivoSeleccionado=e.target.closest('.motivo-btn').dataset.motivo;
    if(motivoSeleccionado==='Otro'){ document.getElementById('inputOtroMotivo').classList.add('show'); }
    else{ document.getElementById('inputOtroMotivo').classList.remove('show'); }
  }
});

window.confirmarCancelacionConMotivo=async function(){
  if(!motivoSeleccionado){ alert('Selecciona motivo'); return; }
  let motivoFinal=motivoSeleccionado;
  if(motivoSeleccionado==='Otro'){
    let txt=document.getElementById('inputOtroMotivo').value.trim();
    if(!txt){ alert('Escribe motivo'); return; }
    motivoFinal=txt;
  }
  let id=cancelIdActual;
  let pedido=cache.find(x=>x.firebaseId===id);
  if(!pedido) return;
  cerrarMotivos();
  cache=cache.filter(x=>x.firebaseId!==id); expandidos.delete(id); nuevos.delete(id); render();
  let ip = ipCliente || pedido.ip || 'sin-ip';
  try{ ip = await obtenerIP() || ip; }catch(e){}
  let dataHistorial={
    firebaseId: id,
    numero: pedido.numero||'',
    correlativo: pedido.correlativo||0,
    total: pedido.total||0,
    productos: pedido.productos||{},
    cliente: pedido.cliente||{},
    direccion: pedido.direccion||pedido.cliente?.direccion||'',
    estado:'cancelado',
    motivoCancelacion: motivoFinal,
    fechaCancelacion: Date.now(),
    timestamp: Date.now(),
    ipCliente: ip,
    telefono: pedido.cliente?.telefono || pedido.telefono || '',
    nombreCliente: pedido.cliente?.nombre || '',
    repartidor: localStorage.getItem('santillos_rep_user')||'repa',
    bloqueado:false
  };
  try{
    console.log('Guardando cancelado en historial...', dataHistorial);
    await dbHistorial.ref('historial_cancelados/'+id).set(dataHistorial);
    await dbHistorial.ref('historial_general/'+id).set({...dataHistorial, tipo:'cancelado'});
    await dbHistorial.ref('ips_registro/'+(dataHistorial.telefono||id)).set({
      ip: ip,
      telefono: dataHistorial.telefono,
      ultimoMotivo: motivoFinal,
      fecha: Date.now(),
      estado:'cancelado',
      pedidoId: id,
      bloqueado:false,
      nombreCliente: dataHistorial.nombreCliente
    });
    await dbRepartidor.ref('pedidos_en_camino/'+id).remove();
    await dbPedidos.ref('pedidos/'+id).update({estado:'cancelado', motivoCancelacion:motivoFinal});
    mostrarToast('cancelado');
    console.log('CANCELADO GUARDADO OK');
  }catch(e){ console.error(e); alert('Error historial: '+e.message); }
}

window.cerrarSesion=function(){
  const overlay=document.getElementById('overlayConfirm');
  const card=document.getElementById('cardConfirm');
  card.innerHTML=`<div class="confirm-icon vino"><i class="fa-solid fa-right-from-bracket"></i></div><h3>¿Cerrar sesión?</h3><p>Volverás al login</p><div class="confirm-actions"><button class="btn-confirm cancel" onclick="cerrarConfirm()">Cancelar</button><button class="btn-confirm yes-vino" id="btnYes2">Sí, cerrar</button></div>`;
  overlay.classList.add('show');
  document.getElementById('btnYes2').onclick=()=>{ localStorage.clear(); window.location.href='login'; };
}
window.cerrarModal=function(){ document.getElementById('modalDetalles').classList.remove('show'); }
window.verDetalles=function(id){
  const p=cache.find(x=>x.firebaseId===id); if(!p) return;
  const productos = p.productos ? (Array.isArray(p.productos)?p.productos:Object.values(p.productos)) : [];
  let html = productos.map(pr=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:12px"><span>${pr.cant||pr.cantidad||1}x ${pr.nombre}</span><b>$${Number(pr.precio||0)*Number(pr.cant||pr.cantidad||1)}</b></div>`).join('') || '<div style="font-size:12px;color:#888">Sin productos</div>';
  html+=`<div style="margin-top:10px;padding-top:8px;border-top:1px solid #eee;display:flex;justify-content:space-between;font-weight:800;font-size:13px"><span>Total</span><span>$${p.total||0}</span></div><div style="margin-top:12px;font-size:11px;color:#666"><b>Cliente:</b> ${p.cliente?.nombre||''}<br><b>Dir:</b> ${p.cliente?.direccion||p.direccion||''}</div>`;
  document.getElementById('bodyDetalles').innerHTML=html; document.getElementById('modalDetalles').classList.add('show');
}
window.toggleExpand=function(id){ if(expandidos.has(id)) expandidos.delete(id); else expandidos.add(id); render(); }

function render(){
  const c=document.getElementById('lista');
  if(cache.length===0){ c.innerHTML=`<div class="empty"><i class="fa-solid fa-motorcycle" style="font-size:28px;margin-bottom:8px;display:block;color:#5c0f2a"></i>No tienes pedidos<br><small>Cuando admin ponga Está listo te llega aquí</small></div>`; return; }
  c.innerHTML=cache.map(p=>{
    const numero = p.numero || `ST-${String(p.correlativo||0).padStart(4,'0')}`;
    const idShort = numero.replace('ST-','');
    const cliente = p.cliente || {};
    const nombre = cliente.nombre || p.nombre || 'Cliente';
    const tel = cliente.telefono || p.telefono || '';
    const dir = cliente.direccion || p.direccion || '';
    const productos = p.productos ? (Array.isArray(p.productos)?p.productos:Object.values(p.productos)) : [];
    const valorServicio = p.valorServicio || 45;
    const distancia = p.distancia || '2.8 km';
    const tiempo = p.tiempoLlegada || '9 min';
    const hace = timeAgo(p.timestamp || p.creadoEn || p.listoEn);
    const esNuevo = nuevos.has(p.firebaseId);
    const expandido = expandidos.has(p.firebaseId);
    if(!expandido){
      return `<div class="card ${esNuevo?'nuevo':''}"><div class="card-head"><div class="pedido-badge">Pedido #${idShort}</div><div class="meta-head"><span><i class="fa-regular fa-clock"></i> ${hace}</span><div class="sep"></div><span><i class="fa-solid fa-location-dot"></i> ${distancia}</span></div></div><div class="client-box"><div class="client-icon"><i class="fa-solid fa-user"></i></div><div class="client-info"><small>Cliente</small><b>${nombre}</b><span><i class="fa-solid fa-phone"></i> ${tel}</span></div><button class="btn-call" onclick="window.open('tel:${tel}')"><i class="fa-solid fa-phone"></i></button></div><div class="actions"><button class="btn btn-outline" onclick="verDetalles('${p.firebaseId}')"><i class="fa-solid fa-eye"></i> Detalles</button><button class="btn btn-green" onclick="toggleExpand('${p.firebaseId}')"><i class="fa-solid fa-hand"></i> Lo tengo</button></div></div>`;
    }
    let prodHtml = productos.map(pr=>`<div class="prod-item"><img class="prod-img" src="${pr.img||pr.imagen||'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=200'}"><div class="prod-name">${pr.nombre}</div><div class="prod-qty">x${pr.cant||pr.cantidad||1}</div></div>`).join('');
    return `<div class="card ${esNuevo?'nuevo':''}"><div class="card-head"><div class="pedido-badge">Pedido #${idShort}</div><div class="meta-head"><span><i class="fa-regular fa-clock"></i> ${hace}</span><div class="sep"></div><span><i class="fa-solid fa-location-dot"></i> ${distancia}</span></div></div><div class="client-box"><div class="client-icon"><i class="fa-solid fa-user"></i></div><div class="client-info"><small>Cliente</small><b>${nombre}</b><span><i class="fa-solid fa-phone"></i> ${tel}</span></div><button class="btn-call" onclick="window.open('tel:${tel}')"><i class="fa-solid fa-phone"></i></button></div><div class="section-title"><h3>Productos</h3><div class="count-pill"><i class="fa-solid fa-utensils"></i> ${productos.length} prod</div></div><div class="prod-list">${prodHtml}</div><div class="info-grid"><div class="info-col"><div class="icon"><i class="fa-solid fa-dollar-sign"></i></div><small>Valor servicio</small><b>$${valorServicio}</b></div><div class="info-col"><div class="icon"><i class="fa-regular fa-clock"></i></div><small>Llegada</small><b>${tiempo}</b></div><div class="info-col"><div class="icon"><i class="fa-solid fa-route"></i></div><small>Distancia</small><b>${distancia}</b></div></div><div class="addr-box"><i class="fa-solid fa-location-dot addr-icon"></i><div class="addr-text"><b>Dirección</b><p>${dir}</p></div><div class="map-link" onclick="abrirMapa('${dir}', ${cliente.lat||''}, ${cliente.lng||''})"><i class="fa-solid fa-map"></i> Mapa</div></div><div class="actions full"><button class="btn btn-yellow" onclick="cambiarEstado('${p.firebaseId}','en_camino')"><i class="fa-solid fa-motorcycle"></i> En camino</button><button class="btn btn-vino" onclick="cambiarEstado('${p.firebaseId}','entregado')"><i class="fa-solid fa-check"></i> Entregado</button><button class="btn btn-outline" onclick="cambiarEstado('${p.firebaseId}','cancelado')"><i class="fa-solid fa-ban"></i> Cancelar</button></div></div>`;
  }).join('');
}

window.abrirMapa=function(dir, lat, lng){ if(lat && lng) window.open(`https://www.google.com/maps?q=${lat},${lng}`,'_blank'); else window.open(`https://www.google.com/maps/search/${encodeURIComponent(dir)}`,'_blank'); }

window.cambiarEstado=function(id, estado){
  if(estado==='cancelado'){ abrirMotivos(id); return; }
  mostrarConfirm(estado, async ()=>{
    let pedido=cache.find(x=>x.firebaseId===id);
    if(!pedido){ alert('Pedido no encontrado'); return; }
    if(estado==='entregado'){
      let cacheBackup=[...cache];
      cache=cache.filter(x=>x.firebaseId!==id); expandidos.delete(id); render();
      let ip = ipCliente;
      try{ ip = await obtenerIP() || ip; }catch(e){}
      let dataHistorial={
        firebaseId: id,
        numero: pedido.numero||`ST-${pedido.correlativo||0}`,
        correlativo: pedido.correlativo||0,
        total: pedido.total||0,
        productos: pedido.productos||{},
        cliente: pedido.cliente||{},
        direccion: pedido.direccion||pedido.cliente?.direccion||'',
        estado:'entregado',
        fechaEntrega: Date.now(),
        timestamp: Date.now(),
        ipCliente: ip,
        telefono: pedido.cliente?.telefono||pedido.telefono||'',
        nombreCliente: pedido.cliente?.nombre||'',
        repartidor: localStorage.getItem('santillos_rep_user')||'repa'
      };
      try{
        console.log('Guardando entregado...', dataHistorial);
        await dbHistorial.ref('historial_entregados/'+id).set(dataHistorial);
        await dbHistorial.ref('historial_general/'+id).set({...dataHistorial, tipo:'entregado'});
        await dbRepartidor.ref('pedidos_en_camino/'+id).remove();
        await dbPedidos.ref('pedidos/'+id).set(null);
        mostrarToast('entregado');
        console.log('ENTREGADO OK');
      }catch(e){
        console.error(e);
        cache=cacheBackup; render();
        alert('Error guardando en historial: '+e.message+'\nVerifica reglas de santillos-historial');
      }
    }else if(estado==='en_camino'){
      try{
        await dbRepartidor.ref('pedidos_en_camino/'+id).update({estado, actualizadoEn: Date.now()});
        await dbPedidos.ref('pedidos/'+id).update({estado});
        mostrarToast('en_camino');
      }catch(e){ alert(e.message); }
    }
  });
}
</script>
</body>
</html>
