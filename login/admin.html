<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f6f7f9;display:flex;min-height:100vh}
.sidebar{width:260px;background:#5e0a28;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:0.3s;display:flex;flex-direction:column}
.sidebar-header{padding:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo-circle{width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#5e0a28}
.logo-text{color:#fff;font-weight:800;font-size:14px;line-height:1.1}
.logo-text span{display:block;font-size:9px;color:rgba(255,255,255,0.6);font-weight:600}
.sidebar-menu{flex:1;padding:12px 10px;overflow-y:auto}
.menu-title{font-size:9px;color:rgba(255,255,255,0.5);font-weight:800;letter-spacing:1px;margin:14px 10px 6px}
.menu-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;margin-bottom:3px}
.menu-item.active{background:#fff;color:#5e0a28}
.menu-item i{width:18px;font-size:13px}
.badge-notif{margin-left:auto;background:#16a34a;color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:800;display:none}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,0.1)}
.btn-logout{width:100%;background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15);padding:10px;border-radius:12px;font-weight:700;font-size:11px;cursor:pointer}
.main{margin-left:260px;flex:1;min-width:0}
.topbar{height:60px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:50}
.btn-menu{display:none;background:#111;color:#fff;border:none;width:36px;height:36px;border-radius:10px}
.topbar-title{font-weight:800;font-size:18px}
.user-badge{background:#111;color:#fff;padding:7px 14px;border-radius:30px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.content{padding:16px}
.section{display:none}.section.active{display:block}
.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:14px}
.pedido-card{background:#fff;border:1px solid #ececec;border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,0.05);transition:all 0.3s}
.pedido-card.nuevo{border:2.5px solid #00ff88!important;box-shadow:0 0 0 4px rgba(0,255,136,0.2), 0 0 20px rgba(0,255,136,0.4), 0 4px 18px rgba(0,0,0,0.05)!important;animation:neonPulse 1.2s infinite}
@keyframes neonPulse{0%{box-shadow:0 0 0 4px rgba(0,255,136,0.2),0 0 20px rgba(0,255,136,0.4)}50%{box-shadow:0 0 0 7px rgba(0,255,136,0.3),0 0 30px rgba(0,255,136,0.6)}100%{box-shadow:0 0 0 4px rgba(0,255,136,0.2),0 0 20px rgba(0,255,136,0.4)}}
.pedido-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.pedido-id-pill{background:#fef9e8;border:1px solid #fdecc8;color:#111;padding:6px 14px;border-radius:10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.pedido-top-meta{display:flex;align-items:center;gap:14px;color:#6b7280;font-size:12px;font-weight:600}
.crono-pill{padding:7px 12px;border-radius:30px;font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px}
.crono-pill.verde{background:#d6f8e0;color:#0f7a2e}
.crono-pill.amarillo{background:#fef9c3;color:#8a5a00}
.crono-pill.rojo{background:#fee2e2;color:#b42318;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.pedido-middle{display:grid;grid-template-columns:1.2fr 0.9fr 0.9fr;gap:0;margin-top:12px}
.col{padding:0 14px;position:relative;border-right:1px solid #f0f0f0}
.col:last-child{border-right:none}
.col:first-child{padding-left:0}
.arrow-btn{position:absolute;top:0;right:6px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#dc2626;cursor:pointer;font-size:13px;background:transparent;border:none}
.col-name{font-weight:800;font-size:13px;color:#111;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.badge-estado{background:#fff1f2;color:#e11d48;border:1px solid #ffe4e6;padding:5px 10px;border-radius:20px;font-size:9px;font-weight:800;display:flex;align-items:center;gap:5px}
.pedido-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #f0f0f0;flex-wrap:wrap}
.btn-act{border:none;padding:10px 16px;border-radius:30px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;flex:1;justify-content:center;min-width:110px}
.btn-acept{background:#22c55e;color:#fff}
.btn-prep{background:#f59e0b;color:#fff}
.btn-camino{background:#3b82f6;color:#fff}
.btn-entre{background:#15803d;color:#fff}
.btn-cancel{background:#ef4444;color:#fff}
.btn-act.active{outline:2px solid #111;outline-offset:2px}
.overlay-modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.overlay-modal.show{display:flex}
.modal-card{background:#fff;border-radius:20px;width:100%;max-width:360px;overflow:hidden}
.modal-header{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0}
.modal-header h3{font-size:14px;font-weight:800;color:#111}
.btn-close{width:28px;height:28px;border-radius:50%;background:#f3f4f6;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-body{padding:16px 18px}
.modal-line{display:flex;gap:10px;margin-bottom:10px;font-size:12px}
.btn-call{width:100%;background:#111;color:#fff;border:none;padding:12px;border-radius:30px;font-weight:800;font-size:13px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-block{width:100%;padding:12px;border-radius:30px;font-weight:800;font-size:13px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none}
.btn-block.bloquear{background:#111;color:#fff}
.btn-block.desbloquear{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
@media(max-width:900px){
.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.btn-menu{display:flex;align-items:center;justify-content:center}
.pedido-middle{grid-template-columns:1fr;gap:10px}
.col{border-right:none;border-bottom:1px solid #f0f0f0;padding:0 0 10px 0}
.col:last-child{border-bottom:none}
}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="logo-circle">S</div><div class="logo-text">SANTILLOS<span>PANEL ADMIN</span></div></div>
  <div class="sidebar-menu">
    <div class="menu-title">OPERACIÓN</div>
    <div class="menu-item active" onclick="goTo('pedidos_activos', this)"><i class="fa-solid fa-fire"></i> Pedidos Activos <span id="countVivo" class="badge-notif">0</span></div>
    <div class="menu-item" onclick="goTo('dashboard', this)"><i class="fa-solid fa-chart-simple"></i> Dashboard</div>
    <div class="menu-item" onclick="goTo('historial', this)"><i class="fa-solid fa-clock-rotate-left"></i> Historial</div>
  </div>
  <div class="sidebar-footer"><button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button></div>
</div>
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px"><button class="btn-menu" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button><div class="topbar-title">Pedidos Activos <span style="font-size:10px;color:#00c851;font-weight:700;margin-left:6px"><i class="fa-solid fa-volume-high"></i> SONIDO ACTIVO</span></div></div>
    <div class="user-badge"><i class="fa-solid fa-user"></i> <span id="userNameTop">admin</span></div>
  </div>
  <div class="content"><div class="section active" id="sec-pedidos_activos"><div id="listaPedidosActivos"></div></div></div>
</div>

<div class="overlay-modal" id="modalCliente" onclick="if(event.target===this)cerrarModales()"><div class="modal-card"><div class="modal-header"><h3>Datos Cliente</h3><button class="btn-close" onclick="cerrarModales()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body" id="bodyCliente"></div></div></div>
<div class="overlay-modal" id="modalIP" onclick="if(event.target===this)cerrarModales()"><div class="modal-card"><div class="modal-header"><h3>Info IP</h3><button class="btn-close" onclick="cerrarModales()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body" id="bodyIP"></div></div></div>
<div class="overlay-modal" id="modalProd" onclick="if(event.target===this)cerrarModales()"><div class="modal-card"><div class="modal-header"><h3>Productos</h3><button class="btn-close" onclick="cerrarModales()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body" id="bodyProd"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA", authDomain:"santillos-1ac6d.firebaseapp.com", databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com", projectId:"santillos-1ac6d", storageBucket:"santillos-1ac6d.firebasestorage.app", messagingSenderId:"285600299102", appId:"1:285600299102:web:9590597c2b3d8888821ccf" };
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
if(!localStorage.getItem('santillos_admin_login')){window.location.href='./';}
document.getElementById('userNameTop').innerText=localStorage.getItem('santillos_admin_usuario')||'admin';
window.goTo=function(id,el){ if(id==='pedidos_activos'){ document.querySelectorAll('.section').forEach(s=>s.classList.remove('active')); document.getElementById('sec-'+id).classList.add('active'); document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active')); if(el)el.classList.add('active'); document.getElementById('sidebar').classList.remove('open'); }else{window.location.href='./'+id+'/';} }
window.cerrarSesion=function(){localStorage.clear();window.location.href='./';}

let pedidosCache=[];let pedidosTodosCache=[];let ipsBloqueadasCache={};
let idsVistos=new Set(); let primerCarga=true; let nuevosIds=new Set();

function obtenerInicioPedido(p){return new Date(p.timestamp||p.creadoEn||p.fechaISO||Date.now());}
function calcularMinutos(p){return Math.max(0,Math.floor((new Date()-obtenerInicioPedido(p))/60000));}
function estadoIP(ip){if(!ip)return 'sin_ip';return ipsBloqueadasCache[ip.replace(/\./g,'_')]?'bloqueada':'activa';}
window.cerrarModales=function(){document.querySelectorAll('.overlay-modal').forEach(m=>m.classList.remove('show'));}
window.abrirCliente=function(id){ const p=pedidosCache.find(x=>x.id===id)||pedidosTodosCache.find(x=>x.id===id);if(!p)return; document.getElementById('bodyCliente').innerHTML=`<div class="modal-line"><b>${p.cliente?.nombre||p.nombre}</b></div><div class="modal-line">${p.cliente?.direccion||p.direccion}</div><div class="modal-line">${p.cliente?.telefono||p.telefono}</div><button class="btn-call" onclick="window.open('tel:${p.telefono||p.cliente?.telefono}')">Llamar</button>`; document.getElementById('modalCliente').classList.add('show'); }
window.abrirIP=function(id){ const p=pedidosCache.find(x=>x.id===id)||pedidosTodosCache.find(x=>x.id===id);if(!p)return; const ip=p.ip||p.ipCliente||'Sin IP'; document.getElementById('bodyIP').innerHTML=`<div class="modal-line">IP: ${ip}</div><div class="modal-line">${p.ciudad||''}</div><button class="btn-block bloquear" onclick="bloquearIP('${ip}','${p.id}');cerrarModales()">Bloquear IP</button>`; document.getElementById('modalIP').classList.add('show'); }
window.abrirProductos=function(id){ const p=pedidosCache.find(x=>x.id===id)||pedidosTodosCache.find(x=>x.id===id);if(!p)return; let lista='';if(Array.isArray(p.productos)) lista=p.productos.map(pr=>`${pr.cant||pr.cantidad}x ${pr.nombre}`).join('<br>'); document.getElementById('bodyProd').innerHTML=lista+`<br><b>Total $${p.total}</b>`; document.getElementById('modalProd').classList.add('show'); }

function renderPedidos(){
  const cont=document.getElementById('listaPedidosActivos');
  if(pedidosCache.length===0){cont.innerHTML='<div class="card" style="text-align:center;color:#999;padding:24px">No hay pedidos activos</div>';return;}
  cont.innerHTML=pedidosCache.map((p)=>{
    const minutos=calcularMinutos(p);
    let cronoClass='verde';if(minutos>=40)cronoClass='rojo';else if(minutos>=20)cronoClass='amarillo';
    const numeroPedido = p.numero || `ST-${String(p.correlativo||0).padStart(4,'0')}`;
    const nombre=p.cliente?.nombre||p.nombre||'Sin nombre'; const telefono=p.cliente?.telefono||p.telefono||''; const direccion=p.cliente?.direccion||p.direccion||'';
    const ipActual=p.ip||p.ipCliente||''; const ciudad=p.ciudad||'';
    let productosCorto='';if(Array.isArray(p.productos)&&p.productos[0]) productosCorto=p.productos[0].nombre;
    const esNuevo=nuevosIds.has(p.id);
    return `<div class="pedido-card ${esNuevo?'nuevo':''}" id="pedido-${p.id}"><div class="pedido-top"><div class="pedido-id-pill"><i class="fa-solid fa-hashtag"></i> ${numeroPedido}</div><div class="pedido-top-meta"><span>${p.fecha||''}</span><span><i class="fa-regular fa-clock"></i> ${p.hora||''}</span></div><div class="crono-pill ${cronoClass}"><i class="fa-solid fa-stopwatch"></i> ${minutos} min</div></div><div class="pedido-middle"><div class="col"><button class="arrow-btn" onclick="abrirCliente('${p.id}')"><i class="fa-solid fa-chevron-right"></i></button><div class="col-name"><i class="fa-solid fa-user"></i> ${nombre}</div><div style="font-size:11.5px;color:#4b5563"><i class="fa-solid fa-phone"></i> ${telefono}</div><div style="font-size:11.5px;color:#4b5563"><i class="fa-solid fa-location-dot"></i> ${direccion.slice(0,40)}</div></div><div class="col"><button class="arrow-btn" onclick="abrirIP('${p.id}')"><i class="fa-solid fa-chevron-right"></i></button><div class="col-name"><i class="fa-solid fa-globe"></i> ${ipActual}</div><div style="font-size:11.5px;color:#4b5563">${ciudad}</div></div><div class="col"><button class="arrow-btn" onclick="abrirProductos('${p.id}')"><i class="fa-solid fa-chevron-right"></i></button><div class="col-name" style="color:#b45309"><i class="fa-solid fa-bag-shopping"></i> Productos</div><div style="font-size:11.5px">${productosCorto}</div><div class="col-total-row"><div class="col-total">$${Number(p.total||0).toLocaleString()}</div><div class="badge-estado">${(p.estado||'pendiente').toUpperCase()}</div></div></div></div><div class="pedido-actions"><button class="btn-act btn-acept ${p.estado==='aceptado'?'active':''}" onclick="cambiarEstado('${p.id}','aceptado')">Aceptado</button><button class="btn-act btn-prep ${p.estado==='preparando'?'active':''}" onclick="cambiarEstado('${p.id}','preparando')">Preparando</button><button class="btn-act btn-camino ${p.estado==='en_camino'?'active':''}" onclick="cambiarEstado('${p.id}','en_camino')">En camino</button><button class="btn-act btn-entre ${p.estado==='entregado'?'active':''}" onclick="cambiarEstado('${p.id}','entregado')">Entregado</button><button class="btn-act btn-cancel ${p.estado==='cancelado'?'active':''}" onclick="cambiarEstado('${p.id}','cancelado')">Cancelar</button></div></div>`;
  }).join('');
}

window.cambiarEstado=function(id,nuevoEstado){update(ref(db,'pedidos/'+id),{estado:nuevoEstado});}
window.bloquearIP=async function(ip,pedidoId){const key=ip.replace(/\./g,'_');await update(ref(db,'ips_bloqueadas/'+key),{ip:ip,fecha:new Date().toLocaleString(),timestamp:Date.now(),pedidoId:pedidoId});}
window.desbloquearIP=async function(ip){const key=ip.replace(/\./g,'_');await remove(ref(db,'ips_bloqueadas/'+key));}

// --- SONIDO TIPO RAPPI SIEMPRE ACTIVO ---
let audioCtx=null;
function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function sonarRappi(){
  try{
    initAudio();
    const now=audioCtx.currentTime;
    // sonido Rappi: ding dong alto
    [0,0.35].forEach((delay,i)=>{
      const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(i===0?950:1200, now+delay);
      o.frequency.exponentialRampToValueAtTime(i===0?700:900, now+delay+0.3);
      g.gain.setValueAtTime(0, now+delay);
      g.gain.linearRampToValueAtTime(0.9, now+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.01, now+delay+0.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now+delay); o.stop(now+delay+0.6);
    });
    // vibración
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
  }catch(e){}
}
// intentar activar solo al cargar, sin necesidad de boton
document.addEventListener('click', initAudio, {once:false});
document.addEventListener('keydown', initAudio, {once:false});
window.addEventListener('load', ()=>{ setTimeout(()=>{ initAudio(); },500); });

onValue(ref(db,'ips_bloqueadas'),snap=>{ipsBloqueadasCache=snap.val()||{};renderPedidos();});

onValue(ref(db,'pedidos'),snap=>{
  const data=snap.val()||{};
  let todas=Object.entries(data).map(([k,v])=>({id:k,...v}));
  todas.sort((a,b)=>{
    const ca=a.correlativo||0; const cb=b.correlativo||0;
    if(ca && cb) return ca-cb;
    if(ca) return -1;
    if(cb) return 1;
    return (a.timestamp||0)-(b.timestamp||0);
  });
  todas.forEach((p,idx)=>{ if(!p.correlativo){p.correlativo=idx+1; if(!p.numero) p.numero=`ST-${String(idx+1).padStart(4,'0')}`;} if(!p.numero) p.numero=`ST-${String(p.correlativo).padStart(4,'0')}`; });
  pedidosTodosCache=todas;
  let activas=todas.filter(p=>p.estado!=='entregado'&&p.estado!=='cancelado');
  // FIFO: primero arriba, nuevo al final abajo
  activas.sort((a,b)=>(a.correlativo||0)-(b.correlativo||0));

  if(!primerCarga){
    const nuevos=activas.filter(p=>!idsVistos.has(p.id));
    if(nuevos.length>0){
      nuevos.forEach(n=>{
        nuevosIds.add(n.id);
        // quitar borde verde neon despues de 12 seg
        setTimeout(()=>{ nuevosIds.delete(n.id); renderPedidos(); },12000);
      });
      sonarRappi();
      // NO HACEMOS SCROLL - se queda donde estas
    }
  }
  idsVistos=new Set(activas.map(p=>p.id));
  primerCarga=false;
  pedidosCache=activas;
  document.getElementById('countVivo').style.display=activas.length>0?'inline-block':'none';
  document.getElementById('countVivo').innerText=activas.length;
  renderPedidos();
});
setInterval(renderPedidos,1000);
</script>
</body>
</html>
