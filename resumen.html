<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finalizar compra - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;max-width:500px;margin:0 auto;padding-bottom:24px}
.header{padding:18px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#0f0f0f;z-index:10;border-bottom:1px solid #1e1e1e}
.header a{width:36px;height:36px;background:#1c1c1c;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.header h1{font-size:20px;font-weight:800}
.free-card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;margin:10px 12px;padding:12px}
.free-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.free-top b{font-size:12px}.free-top span{font-size:11px;color:#22c55e;font-weight:800}
.free-bar{width:100%;height:8px;background:#2a2a2a;border-radius:20px;overflow:hidden}
.free-fill{height:100%;background:linear-gradient(90deg,#22c55e,#10d8a2);border-radius:20px;transition:width 0.5s}
.free-sub{font-size:10px;color:#aaa;margin-top:6px}
.map-box{width:100%;height:240px;border-radius:14px;overflow:hidden;margin-top:10px;border:1px solid #2a2a2a}
#map{width:100%;height:100%}
.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;margin:10px 12px;padding:12px}
.card-title{font-size:13px;font-weight:800;margin-bottom:10px}
.input-wrap{position:relative;margin-bottom:8px}
.input-field{background:#232323;border:1.5px solid #333;border-radius:12px;padding:10px 40px 10px 12px;display:flex;gap:8px;align-items:center;transition:all 0.2s}
.input-field.error{border-color:#ff3b3b!important;animation:shake 0.35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.input-field i{color:#777;font-size:14px;min-width:18px;text-align:center}
.input-field input{flex:1;background:transparent;border:none;color:#fff;font-size:12px;outline:none;width:100%}
.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:#aaa;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:11px;z-index:2}
.clear-btn.show{display:flex}
.error-msg{font-size:10px;color:#ff3b3b;margin:4px 0 2px 4px;display:none}.error-msg.show{display:block}
.resumen-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.total-card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:18px;margin:10px 12px;padding:14px}
.total-row{display:flex;justify-content:space-between;margin-bottom:6px}
.total-row span{font-size:12px;color:#999}.total-row.final span{font-size:17px;font-weight:800;color:#fff}
.envio-free{color:#22c55e!important;font-weight:800}
.btn-confirm{width:100%;background:#5e0a28;color:#fff;border:none;border-radius:16px;padding:14px;font-weight:800;font-size:14px;cursor:pointer;margin-top:8px;transition:all 0.2s}
.btn-confirm.shake{animation:shake 0.35s;border:1.5px solid #ff3b3b;background:#7a0a33}
.pac-container{background:#fff!important;border-radius:12px!important;margin-top:6px;box-shadow:0 4px 20px rgba(0,0,0,0.3)!important}
.pac-item{padding:10px 12px!important;font-size:11px!important}
.overlay-ip{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.overlay-ip.show{display:flex}
.card-bloqueo{background:#fff;border-radius:28px;padding:32px 24px;width:100%;max-width:360px;text-align:center}
.icon-x{width:80px;height:80px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:#ef4444;font-size:38px}
.card-bloqueo h2{font-size:20px;font-weight:800;color:#111;margin-bottom:10px}
.card-bloqueo p{font-size:13px;color:#666;line-height:1.5;margin-bottom:22px}
.btn-soporte{width:100%;background:#111;color:#fff;border:none;padding:14px;border-radius:30px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
</style>
</head>
<body>
<div class="header"><a href="carrito.html"><i class="fa-solid fa-chevron-left"></i></a><h1>Finalizar compra</h1></div>
<div class="free-card">
  <div class="free-top"><b id="freeTxt"></b><span id="freePct"></span></div>
  <div class="free-bar"><div class="free-fill" id="freeFill"></div></div>
  <div class="free-sub" id="freeSub"></div>
  <div class="map-box"><div id="map"></div></div>
</div>
<div class="card">
  <div class="card-title">Detalles de entrega</div>
  <div class="input-wrap" id="wrapDir">
    <div class="input-field" id="fieldDir"><i class="fa-solid fa-location-dot"></i><input type="text" id="direccion" placeholder="Escribe tu dirección..."></div>
    <button class="clear-btn" id="clearDir"><i class="fa-solid fa-xmark"></i></button>
    <div class="error-msg" id="errDir">Falta llenar dirección</div>
  </div>
  <div class="input-wrap" id="wrapRef">
    <div class="input-field"><i class="fa-solid fa-house"></i><input type="text" id="referencia" placeholder="Referencia - Casa azul, portón negro"></div>
    <button class="clear-btn" id="clearRef"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="input-wrap" id="wrapTel">
    <div class="input-field" id="fieldTel"><i class="fa-solid fa-phone"></i><input type="tel" id="telefono" placeholder="Teléfono"></div>
    <button class="clear-btn" id="clearTel"><i class="fa-solid fa-xmark"></i></button>
    <div class="error-msg" id="errTel">Falta llenar teléfono</div>
  </div>
  <div class="input-wrap" id="wrapNom">
    <div class="input-field" id="fieldNom"><i class="fa-solid fa-user"></i><input type="text" id="nombre" placeholder="Nombre"></div>
    <button class="clear-btn" id="clearNom"><i class="fa-solid fa-xmark"></i></button>
    <div class="error-msg" id="errNom">Falta llenar nombre</div>
  </div>
</div>
<div class="card">
  <div class="card-title">Resumen del pedido</div>
  <div id="listaResumen"></div>
  <div style="border-top:1px solid #2a2a2a;margin-top:8px;padding-top:8px">
    <div class="total-row"><span>Subtotal</span><span id="subtotalTxt"></span></div>
    <div class="total-row"><span>Envío</span><span id="envioTxt" class="envio-free">Ingresa dirección</span></div>
    <div class="total-row"><span>Distancia</span><span id="distanciaTxt">--</span></div>
  </div>
</div>
<div class="total-card">
  <div class="total-row final"><span>Total</span><span id="totalFinal"></span></div>
  <button class="btn-confirm" id="btnConfirm" onclick="confirmarPedido()">Confirmar pedido</button>
</div>

<div class="overlay-ip" id="overlayIPBloqueadaCheckout">
  <div class="card-bloqueo">
    <div class="icon-x"><i class="fa-solid fa-xmark"></i></div>
    <h2>Pedido no disponible</h2>
    <p>Por motivos de seguridad, no podemos recibir tu pedido en este momento.</p>
    <button class="btn-soporte" onclick="contactarSoporte()"><i class="fa-brands fa-whatsapp"></i> Escribir a soporte técnico</button>
  </div>
</div>

<script>
// ===== DOS FIREBASES =====
const firebaseConfigMenu={
  apiKey:"AIzaSyCvnHeXuZZ-2IOF3Oas09VNYJK_HLLkau8",
  authDomain:"santillos-menu.firebaseapp.com",
  databaseURL:"https://santillos-menu-default-rtdb.firebaseio.com",
  projectId:"santillos-menu",
  storageBucket:"santillos-menu.firebasestorage.app",
  messagingSenderId:"913879229999",
  appId:"1:913879229999:web:bff40819ea0f91d040c8da"
};
const firebaseConfigPedidos={
  apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA",
  authDomain:"santillos-1ac6d.firebaseapp.com",
  databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com",
  projectId:"santillos-1ac6d",
  storageBucket:"santillos-1ac6d.firebasestorage.app",
  messagingSenderId:"285600299102",
  appId:"1:285600299102:web:9590597c2b3d8888821ccf"
};
const appMenu = firebase.initializeApp(firebaseConfigMenu, "menuApp");
const appPedidos = firebase.initializeApp(firebaseConfigPedidos, "pedidosApp");
const dbPedidos = appPedidos.database();

const META=200; const PRECIO_KM=12; const TIENDA={lat:21.1560,lng:-100.9340};

let sessionId = localStorage.getItem('santillos_session_id');
if(!sessionId){
  sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
  localStorage.setItem('santillos_session_id', sessionId);
}

let carrito={};
try{
  let v3 = localStorage.getItem('santillos_carrito_v3');
  let v1 = localStorage.getItem('santillos_carrito');
  carrito = JSON.parse(v3 || v1 || '{}');
}catch(e){ carrito={}; }

if(Object.keys(carrito).length===0){
  // Intenta cargar del prepedido en santillos-pedidos
  dbPedidos.ref('prepedido/'+sessionId+'/carrito').once('value').then(snap=>{
    if(snap.exists()){
      carrito = snap.val();
      localStorage.setItem('santillos_carrito_v3', JSON.stringify(carrito));
      iniciarResumen();
    } else {
      location.href="carrito.html";
    }
  });
} else {
  iniciarResumen();
}

let subtotal=0;
function iniciarResumen(){
  if(Object.keys(carrito).length===0){ location.href="carrito.html"; return; }
  let html='';
  subtotal=0;
  Object.values(carrito).forEach(p=>{
    let t=Number(p.precio||0)*Number(p.cant||0);
    subtotal+=t;
    let img = p.img || 'https://via.placeholder.com/80';
    html+=`<div class="resumen-item"><img src="${img}" style="width:38px;height:38px;border-radius:8px;object-fit:cover" onerror="this.src='https://via.placeholder.com/38'"><div style="flex:1"><div style="font-size:11px;font-weight:700">${p.nombre} x${p.cant}</div></div><div style="font-size:11px;font-weight:800">$${t}</div></div>`;
  });
  document.getElementById('listaResumen').innerHTML=html;
  document.getElementById('subtotalTxt').innerText='$'+subtotal;
  actualizarTotales();
}

let distanciaKm=0; let costoEnvio=0; let latCliente=null; let lngCliente=null;
let ipClienteFinal="desconocida"; let ciudadIPFinal="";
fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(async d=>{
  ipClienteFinal=d.ip;
  try{ const geo=await fetch(`https://ipapi.co/${d.ip}/json/`).then(r=>r.json()); ciudadIPFinal=(geo.city||"")+(geo.region?", "+geo.region:""); }catch(e){}
  // verificar IP bloqueada en santillos-pedidos
  try{
    const b = await dbPedidos.ref('ips_bloqueadas/'+d.ip.replace(/\./g,'_')).once('value');
    if(b.exists()){ document.getElementById('overlayIPBloqueadaCheckout').classList.add('show'); }
  }catch(e){}
}).catch(()=>{});

function actualizarTotales(){
  let pct=Math.min(100,Math.round(subtotal/META*100));
  document.getElementById('freeFill').style.width=pct+'%';
  document.getElementById('freePct').innerText=pct+'%';
  let f=META-subtotal;
  if(pct>=100){
    document.getElementById('freeTxt').innerText='¡Tienes envio gratis!';
    document.getElementById('freeSub').innerText='Tu pedido supera $'+META;
    document.getElementById('envioTxt').innerText='GRATIS';
    document.getElementById('envioTxt').className='envio-free';
    costoEnvio=0;
  }else{
    document.getElementById('freeTxt').innerText='Te faltan $'+f+' para envío gratis';
    document.getElementById('freeSub').innerText='Cuando completes $'+f+' más, tu envío será gratis';
    if(distanciaKm>0){
      costoEnvio=Math.ceil(distanciaKm*PRECIO_KM);
      document.getElementById('envioTxt').innerText='$'+costoEnvio+' ($'+PRECIO_KM+'/km)';
      document.getElementById('envioTxt').className='';
    }else{
      document.getElementById('envioTxt').innerText='Ingresa dirección para calcular';
      costoEnvio=0;
    }
  }
  document.getElementById('totalFinal').innerText='$'+(subtotal+costoEnvio);
}

try{
  let cli=JSON.parse(localStorage.getItem('santillos_cliente')||'{}');
  if(cli.nombre) document.getElementById('nombre').value=cli.nombre;
  if(cli.telefono) document.getElementById('telefono').value=cli.telefono;
  if(cli.direccion) document.getElementById('direccion').value=cli.direccion;
  if(cli.referencia) document.getElementById('referencia').value=cli.referencia;
  if(cli.lat) latCliente=cli.lat;
  if(cli.lng) lngCliente=cli.lng;
}catch(e){}

function setupClear(inputId, clearId){
  const input=document.getElementById(inputId); const btn=document.getElementById(clearId);
  const toggle=()=>{ if(input.value.length>0) btn.classList.add('show'); else btn.classList.remove('show'); };
  input.addEventListener('input',()=>{toggle(); const mapErr={direccion:['fieldDir','errDir'],telefono:['fieldTel','errTel'],nombre:['fieldNom','errNom']}; if(mapErr[inputId]){document.getElementById(mapErr[inputId][0]).classList.remove('error');document.getElementById(mapErr[inputId][1]).classList.remove('show');} guardarCliente(); });
  input.addEventListener('focus',toggle); setTimeout(toggle,300);
  btn.addEventListener('click',()=>{ input.value='';btn.classList.remove('show');input.focus(); if(inputId==='direccion'){ if(window.markerCliente){markerCliente.setMap(null);} if(directionsRenderer){directionsRenderer.setDirections({routes:[]});} distanciaKm=0; latCliente=null; lngCliente=null; document.getElementById('distanciaTxt').innerText='--'; actualizarTotales(); guardarCliente(); } });
}
setupClear('direccion','clearDir'); setupClear('referencia','clearRef'); setupClear('telefono','clearTel'); setupClear('nombre','clearNom');

function guardarCliente(){
  try{
    localStorage.setItem('santillos_cliente', JSON.stringify({
      nombre: document.getElementById('nombre').value,
      telefono: document.getElementById('telefono').value,
      direccion: document.getElementById('direccion').value,
      referencia: document.getElementById('referencia').value,
      lat: latCliente,
      lng: lngCliente
    }));
  }catch(e){}
}
document.getElementById('nombre').addEventListener('input',guardarCliente);
document.getElementById('telefono').addEventListener('input',guardarCliente);
document.getElementById('referencia').addEventListener('input',guardarCliente);

let map, markerTienda, markerCliente, directionsService, directionsRenderer, autocomplete, geocoder;

function calcularRuta(destinoLatLng){
  if(!destinoLatLng) return;
  directionsService.route({
    origin: TIENDA,
    destination: destinoLatLng,
    travelMode: google.maps.TravelMode.DRIVING
  }, (result, status)=>{
    if(status==='OK'){
      directionsRenderer.setDirections(result);
      const leg=result.routes[0].legs[0];
      distanciaKm=leg.distance.value/1000;
      document.getElementById('distanciaTxt').innerText=leg.distance.text+' ('+Math.round(leg.duration.value/60)+' min)';
      actualizarTotales();
      guardarCliente();
    }
  });
}

function initMap(){
  map=new google.maps.Map(document.getElementById("map"),{center:TIENDA,zoom:13,disableDefaultUI:false,zoomControl:false,mapTypeControl:false});
  geocoder=new google.maps.Geocoder();
  directionsService=new google.maps.DirectionsService();
  directionsRenderer=new google.maps.DirectionsRenderer({map:map,suppressMarkers:true,polylineOptions:{strokeColor:"#5e0a28",strokeWeight:4,strokeOpacity:0.9}});
  const iconRestaurante={url:"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><circle cx="20" cy="20" r="18" fill="#5e0a28" stroke="white" stroke-width="2"/><text x="20" y="26" text-anchor="middle" fill="white" font-size="20" font-weight="bold">S</text></svg>'),scaledSize:new google.maps.Size(40,40)};
  markerTienda=new google.maps.Marker({position:TIENDA,map:map,icon:iconRestaurante});
  const inputDir=document.getElementById('direccion');
  autocomplete=new google.maps.places.Autocomplete(inputDir,{types:['geocode'],componentRestrictions:{country:'mx'}});
  autocomplete.addListener('place_changed',()=>{
    const place=autocomplete.getPlace();
    if(!place.geometry) return;
    const loc=place.geometry.location;
    latCliente=loc.lat(); lngCliente=loc.lng();
    document.getElementById('direccion').value=place.formatted_address||inputDir.value;
    if(markerCliente) markerCliente.setMap(null);
    markerCliente=new google.maps.Marker({position:{lat:latCliente,lng:lngCliente},map:map});
    map.panTo({lat:latCliente,lng:lngCliente});
    calcularRuta({lat:latCliente,lng:lngCliente});
    guardarCliente();
  });
}

function validar(){
  let ok=true;
  const dir=document.getElementById('direccion').value.trim();
  const tel=document.getElementById('telefono').value.trim();
  const nom=document.getElementById('nombre').value.trim();
  if(!dir){ document.getElementById('fieldDir').classList.add('error'); document.getElementById('errDir').classList.add('show'); ok=false; }
  if(!tel){ document.getElementById('fieldTel').classList.add('error'); document.getElementById('errTel').classList.add('show'); ok=false; }
  if(!nom){ document.getElementById('fieldNom').classList.add('error'); document.getElementById('errNom').classList.add('show'); ok=false; }
  if(!ok){ document.getElementById('btnConfirm').classList.add('shake'); setTimeout(()=>document.getElementById('btnConfirm').classList.remove('shake'),400); }
  return ok;
}

function confirmarPedido(){
  if(!validar()) return;
  const btn=document.getElementById('btnConfirm');
  btn.innerText='Enviando...'; btn.disabled=true;

  const cliente={
    nombre: document.getElementById('nombre').value.trim(),
    telefono: document.getElementById('telefono').value.trim(),
    direccion: document.getElementById('direccion').value.trim(),
    referencia: document.getElementById('referencia').value.trim(),
    lat: latCliente, lng: lngCliente
  };

  const pedidoFinal={
    cliente: cliente,
    productos: carrito,
    subtotal: subtotal,
    envio: costoEnvio,
    total: subtotal + costoEnvio,
    distanciaKm: distanciaKm,
    fecha: new Date().toISOString(),
    fecha_timestamp: firebase.database.ServerValue.TIMESTAMP,
    estado: "nuevo",
    ip: ipClienteFinal,
    ciudadIP: ciudadIPFinal,
    sessionId: sessionId
  };

  // 1. Mover de prepedido -> pedidos en santillos-pedidos
  dbPedidos.ref('pedidos').push(pedidoFinal).then(()=>{
    // 2. Guardar contador y limpiar prepedido
    return dbPedidos.ref('prepedido/'+sessionId).remove();
  }).then(()=>{
    localStorage.removeItem('santillos_carrito_v3');
    localStorage.removeItem('santillos_cantidades_v3');
    localStorage.removeItem('santillos_carrito');
    localStorage.removeItem('santillos_cantidades');
    guardarCliente();
    location.href='gracias.html';
  }).catch(e=>{
    alert('Error al enviar pedido: '+e.message);
    btn.innerText='Confirmar pedido'; btn.disabled=false;
  });
}

function contactarSoporte(){
  window.open('https://wa.me/524151000000?text=Soporte%20pedido%20Santillos','_blank');
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg&libraries=places&callback=initMap" async defer></script>
</body>
</html>
