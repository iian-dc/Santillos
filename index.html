<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
.card-location{background:#fff;border-radius:28px;padding:28px 22px 18px;width:100%;max-width:360px;text-align:center;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.title{font-size:22px;font-weight:800;color:#111;margin-bottom:10px}
.subtitle{font-size:14px;color:#444;line-height:1.5;margin-bottom:22px}
.btn-burgundy{width:100%;background:#5e0a28;color:#fff;border:none;padding:16px;border-radius:30px;font-weight:800;font-size:15px;cursor:pointer}
.btn-link{width:100%;background:none;border:none;color:#6b7280;padding:16px;font-weight:600;cursor:pointer}
.btn-row{display:flex;gap:12px;margin-top:18px}
.btn-si{flex:1;background:#e30613;color:#fff;border:none;padding:13px;border-radius:14px;font-weight:800;cursor:pointer}
.btn-no{flex:1;background:#00c853;color:#fff;border:none;padding:13px;border-radius:14px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="overlay" id="overlayPermitir">
  <div class="card-location">
    <svg viewBox="0 0 80 90" style="width:86px;margin:0 auto 12px;display:block" fill="none"><path d="M40 0C18 0 0 18 0 40C0 65 40 90 40 90S80 65 80 40C80 18 62 0 40 0Z" fill="white" stroke="#111" stroke-width="3"/><ellipse cx="40" cy="82" rx="18" ry="4" fill="none" stroke="#b91c45" stroke-width="3"/><circle cx="40" cy="38" r="16" fill="#b91c45"/></svg>
    <div class="title">¿Permitir tu ubicación?</div>
    <div class="subtitle">Necesitamos conocer tu ubicación para que puedas iniciar tu pedido y ayudarte a encontrar la mejor opción de entrega.</div>
    <button class="btn-burgundy" id="btnPermitir" onclick="permitirUbicacion()">Permitir ubicación</button>
    <button class="btn-link" onclick="mostrarConfirmacionNo()">Ahora no</button>
  </div>
</div>
<div class="overlay" id="overlayConfirmar" style="display:none">
  <div class="card-location">
    <div class="title">¿Estás seguro de que no deseas continuar?</div>
    <div class="subtitle">Sin tu ubicación no podremos mostrarte el menú ni calcular el costo de envío.</div>
    <div class="btn-row">
      <button class="btn-si" onclick="window.location.href='https://www.google.com'">Sí</button>
      <button class="btn-no" onclick="volverAPedir()">No</button>
    </div>
  </div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA",authDomain:"santillos-1ac6d.firebaseapp.com",databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com",projectId:"santillos-1ac6d",storageBucket:"santillos-1ac6d.firebasestorage.app",messagingSenderId:"285600299102",appId:"1:285600299102:web:9590597c2b3d8888821ccf"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let ipCliente="desconocida";
fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{ipCliente=d.ip}).catch(()=>{});

function mostrarConfirmacionNo(){document.getElementById('overlayPermitir').style.display='none';document.getElementById('overlayConfirmar').style.display='flex';}
function volverAPedir(){document.getElementById('overlayConfirmar').style.display='none';document.getElementById('overlayPermitir').style.display='flex';}

// PRECARGA EN FONDO
const DB_URL = "https://santillos-1ac6d-default-rtdb.firebaseio.com";
(async function precargarMenuEnFondo(){
  try{
    const [menu, order, config] = await Promise.all([
      fetch(DB_URL+'/menu.json').then(r=>r.json()).catch(()=>null),
      fetch(DB_URL+'/categoryOrder.json').then(r=>r.json()).catch(()=>null),
      fetch(DB_URL+'/config.json').then(r=>r.json()).catch(()=>null)
    ]);
    if(menu) localStorage.setItem('santillos_cache_menu_v2', JSON.stringify(menu));
    if(order && order.length>0) localStorage.setItem('santillos_cache_order_v2', JSON.stringify(order));
    else if(menu) localStorage.setItem('santillos_cache_order_v2', JSON.stringify(Object.keys(menu)));
    if(config) localStorage.setItem('santillos_cache_config', JSON.stringify(config));
  }catch(e){}
})();

function permitirUbicacion(){
  const btn = document.getElementById('btnPermitir');
  btn.innerText = "Obteniendo ubicación...";
  btn.disabled = true;

  if(!navigator.geolocation){ 
    alert("Tu navegador no soporta GPS"); 
    btn.innerText="Permitir ubicación"; btn.disabled=false; return; 
  }
  
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const data={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,ip:ipCliente,userAgent:navigator.userAgent,fecha:new Date().toLocaleString(),timestamp:Date.now(),maps:`https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`};
    try{ 
      const pushRef = await db.ref('ubicaciones').push(data); 
      localStorage.setItem('santillos_ubicacion',JSON.stringify(data)); 
      localStorage.setItem('santillos_ubicacion_key',pushRef.key);
      localStorage.setItem('santillos_ubicacion_ok','1'); 
    }catch(e){}
    window.location.href="menu.html";
  },(err)=>{
    // ERROR: NO mostrar la confirmacion de "Ahora no" cuando el usuario SI quiso permitir
    btn.innerText="Permitir ubicación";
    btn.disabled=false;
    console.log("Error GPS:", err.code, err.message);
    if(err.code === 1){
      // Usuario nego el permiso del navegador -> ahora si mostramos confirmacion
      mostrarConfirmacionNo();
    } else {
      // Error de GPS o timeout -> pedimos que active GPS y reintente, NO lo mandamos a "Ahora no"
      alert("Activa tu GPS y vuelve a darle a Permitir ubicación. Asegúrate de estar en HTTPS.");
    }
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
</script>
</body>
</html>
