<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#1c1c1c;border:1px solid #2a2a2a;width:100%;max-width:360px;border-radius:28px;padding:28px 22px;box-shadow:0 15px 40px rgba(0,0,0,0.6);animation:pop 0.3s ease}
@keyframes pop{0%{transform:scale(0.9);opacity:0}100%{transform:scale(1);opacity:1}}
.logo-wrap{width:72px;height:72px;background:#5e0a28;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px;font-weight:900;border:3px solid #2a2a2a}
.login-title{text-align:center;font-size:20px;font-weight:800;margin-bottom:4px}
.login-sub{text-align:center;font-size:11px;color:#777;font-weight:600;margin-bottom:22px;letter-spacing:0.5px}
.input-group{position:relative;margin-bottom:14px}
.input-group i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#777;font-size:14px}
.input-group input{width:100%;background:#232323;border:1.5px solid #2a2a2a;color:#fff;border-radius:16px;padding:14px 14px 14px 40px;font-size:13px;font-weight:600;outline:none;transition:0.2s}
.input-group input:focus{border-color:#5e0a28;background:#252525}
.btn-login{width:100%;background:#5e0a28;color:#fff;border:none;border-radius:22px;padding:15px;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px;transition:0.2s}
.btn-login:active{transform:scale(0.97)}
.btn-login:disabled{opacity:0.6}
.error-msg{display:none;background:rgba(255,90,90,0.12);border:1px solid rgba(255,90,90,0.3);color:#ff7a7a;font-size:11px;font-weight:700;padding:10px 12px;border-radius:12px;margin-bottom:14px;text-align:center}
.error-msg.show{display:block}
.footer-txt{text-align:center;margin-top:18px;font-size:10px;color:#555;font-weight:700}
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-wrap">S</div>
  <div class="login-title">Santillos Admin</div>
  <div class="login-sub">ACCESO SOLO PARA ADMINISTRADOR</div>

  <div class="error-msg" id="errorMsg"><i class="fa-solid fa-circle-exclamation"></i> Usuario o contraseña incorrectos</div>

  <div class="input-group">
    <i class="fa-solid fa-user"></i>
    <input type="text" id="user" placeholder="Usuario" autocomplete="off">
  </div>

  <div class="input-group">
    <i class="fa-solid fa-lock"></i>
    <input type="password" id="pass" placeholder="Contraseña">
  </div>

  <button class="btn-login" id="btnLogin" onclick="hacerLogin()">Ingresar</button>

  <div class="footer-txt">SANTILLOS • PANEL PRIVADO</div>
</div>

<script>
function hacerLogin(){
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  const error = document.getElementById('errorMsg');
  const btn = document.getElementById('btnLogin');

  // Usuario temporal que me pediste
  if(u === 'admin' && p === '1234'){
    error.classList.remove('show');
    btn.innerText = 'Ingresando...';
    btn.disabled = true;
    
    // Guardamos sesión
    localStorage.setItem('santillos_admin_login', 'true');
    
    // Redirige al admin real
    // Si tu admin está en la raíz se llama admin.html, si lo mueves a /login/admin.html cambia esto
    setTimeout(()=>{
      window.location.href = '../admin.html';
    }, 600);
  }else{
    error.classList.add('show');
    document.getElementById('pass').value='';
    // vibración cortita
    document.querySelector('.login-card').animate([
      {transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}
    ],{duration:250});
  }
}

// Enter para ingresar
document.getElementById('pass').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){ hacerLogin(); }
});
document.getElementById('user').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){ hacerLogin(); }
});
</script>

</body>
</html>
