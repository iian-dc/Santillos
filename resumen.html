<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finalizar compra - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;max-width:500px;margin:0 auto;padding-bottom:24px}
.header{padding:18px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#0f0f0f;z-index:10;border-bottom:1px solid #1e1e1e}
.header a{width:36px;height:36px;background:#1c1c1c;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.header h1{font-size:20px;font-weight:800}
.free-card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;margin:10px 12px;padding:12px}
.free-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.free-top b{font-size:12px} .free-top span{font-size:11px;color:#22c55e;font-weight:800}
.free-bar{width:100%;height:8px;background:#2a2a2a;border-radius:20px;overflow:hidden}
.free-fill{height:100%;background:linear-gradient(90deg,#22c55e,#10d8a2);border-radius:20px;transition:width 0.5s}
.free-sub{font-size:10px;color:#aaa;margin-top:6px}
.map-box{width:100%;height:220px;border-radius:14px;overflow:hidden;margin-top:10px;border:1px solid #2a2a2a}
#map{width:100%;height:100%}
.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;margin:10px 12px;padding:12px}
.card-title{font-size:13px;font-weight:800;margin-bottom:10px}
.input-wrap{position:relative;margin-bottom:4px}
.input-field{background:#232323;border:1.5px solid #333;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;transition:all 0.2s}
.input-field.error{border-color:#ff3b3b;animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.input-field i{color:#777;font-size:14px;min-width:18px;text-align:center}
.input-field input{flex:1;background:transparent;border:none;color:#fff;font-size:12px;outline:none}
.error-msg{font-size:10px;color:#ff3b3b;margin:4px 0 8px 4px;display:none}.error-msg.show{display:block}
.resumen-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.resumen-item img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:#111}
.resumen-info{flex:1}.resumen-name{font-size:11px;font-weight:700}.resumen-qty{font-size:10px;color:#999}.resumen-price{font-size:11px;font-weight:800}
.subtotal-row{display:flex;justify-content:space-between;padding:8px 0;font-size:11px;color:#999;border-top:1px solid #2a2a2a;margin-top:6px}
.total-card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:18px;margin:10px 12px;padding:14px}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.total-row span{font-size:17px;font-weight:800}
.btn-confirm{width:100%;background:#5e0a28;color:#fff;border:none;border-radius:16px;padding:14px;font-weight:800;font-size:14px;cursor:pointer}
.pac-container{background:#232323 !important;border:1px solid #333 !important;border-radius:12px !important;margin-top:4px}.pac-item{color:#fff !important;border-top:1px solid #2a2a2a !important;padding:8px !important}.pac-item-query{color:#fff !important}
</style>
</head>
<body>
<div class="header"><a href="carrito.html"><i class="fa-solid fa-chevron-left"></i></a><h1>Finalizar compra</h1></div>

<div class="free-card">
  <div class="free-top"><b id="freeTxt"></b><span id="freePct"></span></div>
  <div class="free-bar"><div class="free-fill" id="freeFill"></div></div>
  <div class="free-sub" id="freeSub"></div>
  <div class="map-box"><div id="map"></div></div>
</div>

<div class="card">
  <div class="card-title">Detalles de entrega</div>
  <div class="input-wrap" id="wrapDir"><div class="input-field" id="fieldDir"><i class="fa-solid fa-location-dot"></i><input type="text" id="direccion" placeholder="Dirección - Ej: Calle Hidalgo 45"></div><div class="error-msg" id="errDir">Llena tu dirección para completar tu pedido</div></div>
  <div class="input-wrap"><div class="input-field"><i class="fa-solid fa-house"></i><input type="text" id="referencia" placeholder="Referencia - Casa azul, portón negro"></div></div>
  <div class="input-wrap" id="wrapTel"><div class="input-field" id="fieldTel"><i class="fa-solid fa-phone"></i><input type="tel" id="telefono" placeholder="Teléfono"></div><div class="error-msg" id="errTel">Llena tu teléfono para completar tu pedido</div></div>
  <div class="input-wrap" id="wrapNom"><div class="input-field" id="fieldNom"><i class="fa-solid fa-user"></i><input type="text" id="nombre" placeholder="Nombre"></div><div class="error-msg" id="errNom">Llena tu nombre para completar tu pedido</div></div>
</div>

<div class="card"><div class="card-title">Resumen del pedido</div><div id="listaResumen"></div><div class="subtotal-row"><span>Subtotal</span><span id="subtotalTxt">$0</span></div><div class="subtotal-row" style="border-top:none;padding-top:2px"><span>Envío</span><span id="envioTxt"></span></div></div>
<div class="total-card"><div class="total-row"><span>Total</span><span id="totalFinal">$0</span></div><button class="btn-confirm" onclick="confirmarPedido()">Confirmar pedido</button></div>

<script>
const firebaseConfig={apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA",authDomain:"santillos-1ac6d.firebaseapp.com",databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com",projectId:"santillos-1ac6d",storageBucket:"santillos-1ac6d.firebasestorage.app",messagingSenderId:"285600299102",appId:"1:285600299102:web:9590597c2b3d8888821ccf"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const META=200; const TIENDA={lat:21.1560,lng:-100.9340};
let carrito={};try{carrito=JSON.parse(localStorage.getItem('santillos_carrito')||'{}')}catch(e){}
if(Object.keys(carrito).length===0) location.href="carrito.html";
let subtotal=0,html='';Object.values(carrito).forEach(p=>{let t=p.precio*p.cant;subtotal+=t;html+=`<div class="resumen-item"><img src="${p.img}"><div class="resumen-info"><div class="resumen-name">${p.nombre} x${p.cant}</div><div class="resumen-qty">$${p.precio} c/u</div></div><div class="resumen-price">$${t}</div></div>`});
document.getElementById('listaResumen').innerHTML=html;
document.getElementById('subtotalTxt').innerText='$'+subtotal; document.getElementById('totalFinal').innerText='$'+subtotal;
function actualizarBarra(){let f=META-subtotal;let pct=Math.min(100,Math.round(subtotal/META*100));document.getElementById('freeFill').style.width=pct+'%';document.getElementById('freePct').innerText=pct+'%';if(f<=0){document.getElementById('freeTxt').innerText='¡Tienes envío gratis!';document.getElementById('freeSub').innerText='Tu pedido supera $'+META;document.getElementById('envioTxt').innerText='Gratis';document.getElementById('envioTxt').style.color='#22c55e'}else{document.getElementById('freeTxt').innerText='Te faltan $'+f+' para envío gratis';document.getElementById('freeSub').innerText='Cuando completes $'+f+' más, tu envío será gratis';document.getElementById('envioTxt').innerText='— $'+f+' para gratis';document.getElementById('envioTxt').style.color='#999'}} actualizarBarra();
try{let cli=JSON.parse(localStorage.getItem('santillos_cliente')||'{}');if(cli.nombre)nombre.value=cli.nombre;if(cli.telefono)telefono.value=cli.telefono;if(cli.direccion)direccion.value=cli.direccion;if(cli.referencia)referencia.value=cli.referencia;}catch(e){}
let map, markerTienda, markerCliente, directionsService, directionsRenderer;
function initMap(){
  map=new google.maps.Map(document.getElementById('map'),{center:TIENDA,zoom:15,disableDefaultUI:true,styles:[{elementType:"geometry",stylers:[{color:"#1e1e1e"}]},{elementType:"labels.text.fill",stylers:[{color:"#757575"}]},{featureType:"road",elementType:"geometry",stylers:[{color:"#2a2a2a"}]}]});
  markerTienda=new google.maps.Marker({position:TIENDA,map:map,icon:{url:"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="14" fill="#5e0a28" stroke="white" stroke-width="2"/><text x="16" y="21" text-anchor="middle" font-size="14">🍽️</text></svg>'),scaledSize:new google.maps.Size(32,32)}});
  directionsService=new google.maps.DirectionsService();
  directionsRenderer=new google.maps.DirectionsRenderer({map:map,suppressMarkers:true,polylineOptions:{strokeColor:"#5e0a28",strokeWeight:4,strokeOpacity:0.9}});
  const autocomplete=new google.maps.places.Autocomplete(document.getElementById('direccion'),{componentRestrictions:{country:"mx"},fields:["formatted_address","geometry"]});
  autocomplete.addListener('place_changed',()=>{
    const place=autocomplete.getPlace();
    if(!place.geometry) return;
    if(markerCliente) markerCliente.setMap(null);
    markerCliente=new google.maps.Marker({position:place.geometry.location,map:map,icon:{url:"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><circle cx="14" cy="14" r="12" fill="white" stroke="#5e0a28" stroke-width="2"/><text x="14" y="19" text-anchor="middle" font-size="12">📍</text></svg>'),scaledSize:new google.maps.Size(28,28)}});
    const request={origin:TIENDA,destination:place.geometry.location,travelMode:google.maps.TravelMode.DRIVING};
    directionsService.route(request,(result,status)=>{if(status=='OK'){directionsRenderer.setDirections(result)}});
  });
}
function validar(idField,idErr,inputId){const f=document.getElementById(idField);const v=document.getElementById(inputId).value.trim();if(!v){f.classList.add('error');document.getElementById(idErr).classList.add('show');setTimeout(()=>f.classList.remove('error'),800);return false}else{f.classList.remove('error');document.getElementById(idErr).classList.remove('show');return true}}
function confirmarPedido(){let d=validar('fieldDir','errDir','direccion');let t=validar('fieldTel','errTel','telefono');let n=validar('fieldNom','errNom','nombre');if(!d||!t||!n) return;let pedido={cliente:{nombre:nombre.value,telefono:telefono.value,direccion:direccion.value,referencia:referencia.value},productos:carrito,subtotal,total:subtotal,fecha:Date.now(),estado:'pendiente'};localStorage.setItem('santillos_cliente',JSON.stringify(pedido.cliente));db.ref('pedidos').push(pedido).then(()=>{localStorage.setItem('santillos_ultimo_pedido',JSON.stringify(pedido));localStorage.setItem('santillos_carrito','{}');localStorage.setItem('santillos_cantidades','{}');location.href='gracias.html'})}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDLUCoJ0hVpN6olydp4tcbNME_zJwGg1Og&libraries=places&callback=initMap" async defer></script>
</body>
</html>
