<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#fff;min-height:100vh;padding:24px}
.top{background:#0f0f0f;color:#fff;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center}
h1{margin-top:24px;font-size:26px;font-weight:900}
#ubi{margin-top:12px;background:#f5f5f7;padding:12px;border-radius:12px;font-size:12px}
</style>
</head>
<body>
<div class="top"><b>SANTILLOS</b><span style="font-size:11px;background:#e8f5e9;color:#00c853;padding:4px 10px;border-radius:12px">Ubicación activa</span></div>
<h1>Menú principal 🍔</h1>
<p style="color:#666;font-size:13px;margin-top:6px">Aquí vamos a empezar a construir el restaurante desde cero</p>
<div id="ubi">Cargando ubicación...</div>

<script>
const data = JSON.parse(localStorage.getItem('santillos_ubicacion')||'null');
if(!localStorage.getItem('santillos_ubicacion_ok')){
  window.location.href="index.html";
}
if(data){
  document.getElementById('ubi').innerHTML = `<b>Lat:</b> ${data.lat}<br><b>Lng:</b> ${data.lng}<br><b>IP:</b> ${data.ip}<br><a href="${data.maps}" target="_blank">Ver en Maps</a>`;
}
</script>
</body>
</html>
