<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finalizar compra - Santillos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;max-width:500px;margin:0 auto;padding-bottom:24px}
.header{padding:18px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#0f0f0f;z-index:10;border-bottom:1px solid #1e1e1e}
.header a{width:36px;height:36px;background:#1c1c1c;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.header h1{font-size:20px;font-weight:800}
.free-card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;margin:10px 12px;padding:12px}
.free-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.free-top b{font-size:12px} .free-top span{font-size:11px;color:#22c55e;font-weight:800}
.free-bar{width:100%;height:8px;background:#2a2a2a;border-radius:20px;overflow:hidden}
.free-fill{height:100%;background:linear-gradient(90deg,#22c55e,#10d8a2);border-radius:20px;transition:width 0.5s}
.free-sub{font-size:10px;color:#aaa;margin-top:6px}
.map-box{width:100%;height:240px;border-radius:14px;overflow:hidden;margin-top:10px;border:1px solid #2a2a2a}
#map{width:100%;height:100%}
.card{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;margin:10px 12px;padding:12px}
.card-title{font-size:13px;font-weight:800;margin-bottom:10px}
.input-wrap{position:relative;margin-bottom:4px}
.input-field{background:#232323;border:1.5px solid #333;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.input-field.error{border-color:#ff3b3b;animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.input-field i{color:#777;font-size:14px;min-width:18px;text-align:center}
.input-field input{flex:1;background:transparent;border:none;color:#fff;font-size:12px;outline:none}
.error-msg{font-size:10px;color:#ff3b3b;margin:4px 0 8px 4px;display:none}.error-msg.show{display:block}
.resumen-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.total-card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:18px;margin:10px 12px;padding:14px}
.total-row{display:flex;justify-content:space-between;margin-bottom:12px}.total-row span{font-size:17px;font-weight:800}
.btn-confirm{width:100%;background:#5e0a28;color:#fff;border:none;border-radius:16px;padding:14px;font-weight:800;font-size:14px;cursor:pointer}
.pac-container{background:#fff!important;border-radius:12px!important;margin-top:6px;box-shadow:0 4px 20px rgba(0,0,0,0.3)!important}
.pac-item{padding:10px 12px!important;font-size:11px!important}
/* Estilo Rappi 3D para marcador */
.marker-3d{filter: drop-shadow(0 8px 10px rgba(0,0,0,0.45)); transform: translateY(-4px);}
</style>
</head>
<body>
<div class="header"><a href="carrito.html"><i class="fa-solid fa-chevron-left"></i></a><h1>Finalizar compra</h1></div>
<div class="free-card">
  <div class="free-top"><b id="freeTxt"></b><span id="freePct"></span></div>
  <div class="free-bar"><div class="free-fill" id="freeFill"></div></div>
  <div class="free-sub" id="freeSub"></div>
  <div class="map-box"><div id="map"></div></div>
</div>
<div class="card">
  <div class="card-title">Detalles de entrega</div>
  <div class="input-wrap" id="wrapDir"><div class="input-field" id="fieldDir"><i class="fa-solid fa-location-dot"></i><input type="text" id="direccion" placeholder="Escribe tu dirección..."></div><div class="error-msg" id="errDir">Llena tu dirección para completar tu pedido</div></div>
  <div class="input-wrap"><div class="input-field"><i class="fa-solid fa-house"></i><input type="text" id="referencia" placeholder="Referencia - Casa azul, portón negro"></div></div>
  <div class="input-wrap" id="wrapTel"><div class="input-field" id="fieldTel"><i class="fa-solid fa-phone"></i><input type="tel" id="telefono" placeholder="Teléfono"></div><div class="error-msg" id="errTel">Llena tu teléfono para completar tu pedido</div></div>
  <div class="input-wrap" id="wrapNom"><div class="input-field" id="fieldNom"><i class="fa-solid fa-user"></i><input type="text" id="nombre" placeholder="Nombre"></div><div class="error-msg" id="errNom">Llena tu nombre para completar tu pedido</div></div>
</div>
<div class="card"><div class="card-title">Resumen del pedido</div><div id="listaResumen"></div><div style="display:flex;justify-content:space-between;padding:8px 0;font-size:11px;color:#999;border-top:1px solid #2a2a2a;margin-top:6px"><span>Subtotal</span><span id="subtotalTxt"></span></div></div>
<div class="total-card"><div class="total-row"><span>Total</span><span id="totalFinal"></span></div><button class="btn-confirm" onclick="confirmarPedido()">Confirmar pedido</button></div>

<script>
const firebaseConfig={apiKey:"AIzaSyD1eh7jbI-T43XvMErYsxi9C_fw4PI61oA",authDomain:"santillos-1ac6d.firebaseapp.com",databaseURL:"https://santillos-1ac6d-default-rtdb.firebaseio.com",projectId:"santillos-1ac6d",storageBucket:"santillos-1ac6d.firebasestorage.app",messagingSenderId:"285600299102",appId:"1:285600299102:web:9590597c2b3d8888821ccf"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const META=200; const TIENDA={lat:21.1560,lng:-100.9340};
let carrito={};try{carrito=JSON.parse(localStorage.getItem('santillos_carrito')||'{}')}catch(e){}
if(Object.keys(carrito).length===0) location.href="carrito.html";
let subtotal=0,html='';Object.values(carrito).forEach(p=>{let t=p.precio*p.cant;subtotal+=t;html+=`<div class="resumen-item"><img src="${p.img}" style="width:38px;height:38px;border-radius:8px"><div style="flex:1"><div style="font-size:11px;font-weight:700">${p.nombre} x${p.cant}</div></div><div style="font-size:11px;font-weight:800">$${t}</div></div>`});
document.getElementById('listaResumen').innerHTML=html;
document.getElementById('subtotalTxt').innerText='$'+subtotal; document.getElementById('totalFinal').innerText='$'+subtotal;
let f=META-subtotal;let pct=Math.min(100,Math.round(subtotal/META*100));document.getElementById('freeFill').style.width=pct+'%';document.getElementById('freePct').innerText=pct+'%';if(f<=0){document.getElementById('freeTxt').innerText='¡Tienes envio gratis!';document.getElementById('freeSub').innerText='Tu pedido supera $'+META;}else{document.getElementById('freeTxt').innerText='Te faltan $'+f+' para envío gratis';document.getElementById('freeSub').innerText='Cuando completes $'+f+' más, tu envío será gratis';}
try{let cli=JSON.parse(localStorage.getItem('santillos_cliente')||'{}');if(cli.nombre)nombre.value=cli.nombre;if(cli.telefono)telefono.value=cli.telefono;if(cli.direccion)direccion.value=cli.direccion;if(cli.referencia)referencia.value=cli.referencia;}catch(e){}

let map, markerTienda, markerCliente, directionsService, directionsRenderer;
function initMap(){
  map=new google.maps.Map(document.getElementById("map"),{center:TIENDA,zoom:15,disableDefaultUI:false,zoomControl:false});
  directionsService=new google.maps.DirectionsService();
  directionsRenderer=new google.maps.DirectionsRenderer({map:map,suppressMarkers:true,polylineOptions:{strokeColor:"#5e0a28",strokeWeight:4,strokeOpacity:0.8}});

  // --- RESTAURANTE 3D REALISTA ESTILO RAPPI ---
  // No es imagen plana, es 3D con sombra flotante
  const tiendaDiv=document.createElement('div');
  tiendaDiv.className='marker-3d';
  tiendaDiv.innerHTML=`<img src="santillos_3d.png" style="width:58px;height:auto;display:block;">`;

  // Intenta usar AdvancedMarker (más realista), si no existe usa Marker normal
  if(google.maps.marker && google.maps.marker.AdvancedMarkerElement){
    markerTienda=new google.maps.marker.AdvancedMarkerElement({position:TIENDA,map:map,content:tiendaDiv,title:"Santillos"});
  } else {
    markerTienda=new google.maps.Marker({
      position:TIENDA,map:map,
      icon:{url:'santillos_3d.png',scaledSize:new google.maps.Size(58,52),anchor:new google.maps.Point(29,52)},
      title:"Santillos"
    });
  }

  const iconCliente={url:"data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'%3E%3Ccircle cx='14' cy='14' r='12' fill='%23000' stroke='white' stroke-width='3'/%3E%3C/svg%3E",scaledSize:new google.maps.Size(22,22),anchor:new google.maps.Point(11,11)};

  const autocomplete=new google.maps.places.Autocomplete(document.getElementById("direccion"),{componentRestrictions:{country:"mx"}});
  autocomplete.addListener("place_changed",()=>{
    const place=autocomplete.getPlace();
    if(!place.geometry) return;
    const destino=place.geometry.location;
    if(markerCliente) markerCliente.map=null;
    if(google.maps.marker && google.maps.marker.AdvancedMarkerElement){
      const cDiv=document.createElement('div');cDiv.innerHTML=`<div style="width:14px;height:14px;background:#000;border:3px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.4)"></div>`;
      markerCliente=new google.maps.marker.AdvancedMarkerElement({position:destino,map:map,content:cDiv});
    } else {
      markerCliente=new google.maps.Marker({position:destino,map:map,icon:iconCliente});
    }
    calcularRuta(destino);
    const bounds=new google.maps.LatLngBounds();bounds.extend(TIENDA);bounds.extend(destino);map.fitBounds(bounds);
  });
}
function calcularRuta(destino){
  directionsService.route({origin:TIENDA,destination:destino,travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{
    if(status==="OK") directionsRenderer.setDirections(res);
  });
}
function confirmarPedido(){
  let ok=true;
  if(!direccion.value.trim()){document.getElementById('fieldDir').classList.add('error');document.getElementById('errDir').classList.add('show');ok=false;}else{document.getElementById('fieldDir').classList.remove('error');document.getElementById('errDir').classList.remove('show');}
  if(!telefono.value.trim()){document.getElementById('fieldTel').classList.add('error');document.getElementById('errTel').classList.add('show');ok=false;}else{document.getElementById('fieldTel').classList.remove('error');document.getElementById('errTel').classList.remove('show');}
  if(!nombre.value.trim()){document.getElementById('fieldNom').classList.add('error');document.getElementById('errNom').classList.add('show');ok=false;}else{document.getElementById('fieldNom').classList.remove('error');document.getElementById('errNom').classList.remove('show');}
  if(!ok) return;
  const pedido={cliente:{nombre:nombre.value,telefono:telefono.value,direccion:direccion.value,referencia:referencia.value},carrito:carrito,total:subtotal,fecha:new Date().toISOString()};
  db.ref('pedidos').push(pedido).then(()=>{
    localStorage.setItem('santillos_cliente',JSON.stringify(pedido.cliente));
    localStorage.removeItem('santillos_carrito');
    alert('Pedido enviado con éxito');
    location.href='index.html';
  });
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg&libraries=places&callback=initMap" async defer></script>
</body>
</html>
